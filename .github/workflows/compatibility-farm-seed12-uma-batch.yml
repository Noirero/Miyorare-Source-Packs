name: Compatibility Farm Seed12 UMA Batch

on:
  push:
    branches:
      - cf-seed12-batch
    paths:
      - 'compatibility/source-registry.json'
      - 'compatibility/parser-families.json'
      - 'compatibility/harness/uma/**'
      - 'tools/parser_family_plan.py'
      - 'tools/parser_harness_report.py'
      - '.github/workflows/compatibility-farm-seed12-uma-batch.yml'

permissions:
  contents: read

concurrency:
  group: compatibility-farm-seed12-uma-batch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remaining-uma-seed:
    name: Execute remaining UMA seed parser families
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Compatibility Farm
        uses: actions/checkout@v5

      - name: Validate declarative family plan
        run: >-
          python3 tools/parser_family_plan.py
          --registry compatibility/source-registry.json
          --families compatibility/parser-families.json
          validate
          --output build/parser-family-plan-validation.json

      - name: Resolve pinned UMA baseline
        id: provider-ref
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path('compatibility/source-registry.json').read_text(encoding='utf-8'))
          print(f"uma={data['providerBaselines']['uma']}")
          PY

      - name: Checkout pinned UMA source
        uses: actions/checkout@v5
        with:
          repository: InvalidDavid/UMA
          ref: ${{ steps.provider-ref.outputs.uma }}
          path: _upstream/uma
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install deterministic UMA harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _upstream/uma/src/test/kotlin/compatibilityfarm
          mkdir -p _upstream/uma/src/test/resources/compatibility-farm
          cp compatibility/harness/uma/*.kt _upstream/uma/src/test/kotlin/compatibilityfarm/
          cp -R compatibility/harness/uma/resources/. _upstream/uma/src/test/resources/compatibility-farm/

      - name: Execute remaining real UMA Kotlin parser families
        working-directory: _upstream/uma
        run: |
          chmod +x gradlew
          ./gradlew test \
            --tests compatibilityfarm.BacamiParserHarnessTest \
            --tests compatibilityfarm.LikeMangaParserHarnessBehaviorTest \
            --tests compatibilityfarm.MangaPillParserHarnessTest \
            --tests compatibilityfarm.TheMangaParserHarnessTest \
            --no-daemon

      - name: Normalize remaining UMA real parser evidence
        if: always()
        run: >-
          python3 tools/parser_harness_report.py
          --registry compatibility/source-registry.json
          --results-dir _upstream/uma/build/test-results/test
          --provider uma
          --source miyorare:miyorare-id:BACAMI=compatibilityfarm.BacamiParserHarnessTest
          --source miyorare:miyorare-en:LIKEMANGA=compatibilityfarm.LikeMangaParserHarnessBehaviorTest
          --source miyorare:miyorare-en:MANGAPILL=compatibilityfarm.MangaPillParserHarnessTest
          --source miyorare:miyorare-id:THEMANGA=compatibilityfarm.TheMangaParserHarnessTest
          --output build/real-parser-harness-uma-remaining-seed-report.json

      - name: Upload batch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-farm-uma-remaining-seed
          path: |
            build/parser-family-plan-validation.json
            build/real-parser-harness-uma-remaining-seed-report.json
            _upstream/uma/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 14
