name: Source Lab C4 ID Adoption Drift
run-name: Source Lab C4 ID Adoption Drift

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/source-lab-c4-id-adoption-drift.yml'
      - 'tools/source_lab_c4_id_adoption_drift.py'
      - 'tests/test_source_lab_c4_id_adoption_drift.py'
      - 'compatibility/evidence/track-c-batch4-id-baseline.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: source-lab-c4-id-adoption-drift-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_OWNER_ID: '149634319'
  SOURCE_PACKS_AFTER_C3: '7eb7073679f77398d6814aa1989730e4423c895e'
  INVENTORY_BASELINE: '2c4768c7ea9914030868792bcd73d5f7f461907b'
  FARM_BASELINE: '654af67becbdb0adf85ab87663674ba7340b3cf4'
  MIYORARE_AMAIN2_BASELINE: 'f366d775c5b4c3a330b4baf105e24ce93fd66fc7'
  C2_RUN_ID: '39357613207'
  C2_ARTIFACT_ID: '12235399586'
  C2_ARTIFACT_NAME: 'track-c-batch2-id-capability-health-39357613207'
  C2_ARTIFACT_DIGEST: 'sha256:9ad96880a878d20268576eb99833958fb1c9be9dfd09e5d62755073f5f30147c'
  C2_HEAD_SHA: '325ace908d72a0fd6e75a0ac739b599a4d33a0d9'
  C3_RUN_ID: '39362316682'
  C3_ARTIFACT_ID: '12237618161'
  C3_ARTIFACT_NAME: 'track-c-batch3-id-targeted-validation-39362316682'
  C3_ARTIFACT_DIGEST: 'sha256:c320fa8cb1cf9811c0d4d9bd7e1f37528a4bac1ebf08e2704dfae243d05a82ee'
  C3_HEAD_SHA: 'd286c04b1c9d37f65192345b49c8f37290280040'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  id-adoption-drift:
    name: Freeze ID C4 decisions and detect future drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate safe execution context
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "Noirero/Miyorare-Source-Packs" ]]
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              [[ "$PR_HEAD_REPO" == "$GITHUB_REPOSITORY" ]] || {
                echo "::error::C4 accepts same-repository pull requests only"
                exit 1
              }
              ;;
            schedule) ;;
            workflow_dispatch)
              [[ "$GITHUB_ACTOR_ID" == "$EXPECTED_OWNER_ID" ]]
              [[ "$GITHUB_REF_NAME" == "main" ]]
              ;;
            *) echo "::error::unexpected event: $GITHUB_EVENT_NAME"; exit 1 ;;
          esac

      - name: Checkout exact proposed C4 control plane
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: control
          fetch-depth: 1

      - name: Checkout frozen ID inventory baseline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.INVENTORY_BASELINE }}
          path: inventory-baseline
          fetch-depth: 1

      - name: Checkout current informational inventory
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: source-inventory-live
          path: inventory-current
          fetch-depth: 1

      - name: Checkout frozen Farm baseline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.FARM_BASELINE }}
          path: farm-baseline
          fetch-depth: 1

      - name: Checkout current Compatibility Farm
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: compatibility-farm-foundation
          path: farm-current
          fetch-depth: 1

      - name: Checkout frozen Amain2 consumer baseline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Noirero/Miyorare
          ref: ${{ env.MIYORARE_AMAIN2_BASELINE }}
          path: miyorare-baseline
          fetch-depth: 1

      - name: Checkout current Amain2 consumer
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Noirero/Miyorare
          ref: Amain2
          path: miyorare-current
          fetch-depth: 1

      - name: Pin current heads and verify frozen C4 metadata
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          control_sha="$(git -C control rev-parse HEAD)"
          inventory="$(git -C inventory-current rev-parse HEAD)"
          farm="$(git -C farm-current rev-parse HEAD)"
          miyorare="$(git -C miyorare-current rev-parse HEAD)"
          [[ "$control_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C inventory-baseline rev-parse HEAD)" == "$INVENTORY_BASELINE" ]]
          [[ "$(git -C farm-baseline rev-parse HEAD)" == "$FARM_BASELINE" ]]
          [[ "$(git -C miyorare-baseline rev-parse HEAD)" == "$MIYORARE_AMAIN2_BASELINE" ]]
          [[ "$inventory" == "$(git -C inventory-current ls-remote origin refs/heads/source-inventory-live | awk '{print $1}')" ]]
          [[ "$farm" == "$(git -C farm-current ls-remote origin refs/heads/compatibility-farm-foundation | awk '{print $1}')" ]]
          [[ "$miyorare" == "$(git -C miyorare-current ls-remote origin refs/heads/Amain2 | awk '{print $1}')" ]]
          echo "control=$control_sha" >> "$GITHUB_OUTPUT"
          echo "inventory=$inventory" >> "$GITHUB_OUTPUT"
          echo "farm=$farm" >> "$GITHUB_OUTPUT"
          echo "miyorare=$miyorare" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('control/compatibility/evidence/track-c-batch4-id-baseline.json').read_text())
          refs = data['refs']
          assert refs['sourcePacksAfterBatch3'] == os.environ['SOURCE_PACKS_AFTER_C3']
          assert refs['sourceInventory'] == os.environ['INVENTORY_BASELINE']
          assert refs['compatibilityFarm'] == os.environ['FARM_BASELINE']
          assert refs['miyorareAmain2'] == os.environ['MIYORARE_AMAIN2_BASELINE']
          for label, prefix in (('batch2', 'C2'), ('batch3', 'C3')):
              artifact = data['artifacts'][label]
              assert str(artifact['runId']) == os.environ[f'{prefix}_RUN_ID']
              assert str(artifact['artifactId']) == os.environ[f'{prefix}_ARTIFACT_ID']
              assert artifact['name'] == os.environ[f'{prefix}_ARTIFACT_NAME']
              assert artifact['digest'] == os.environ[f'{prefix}_ARTIFACT_DIGEST']
              assert artifact['headSha'] == os.environ[f'{prefix}_HEAD_SHA']
          PY
          # Do not reject current-head movement here. The report below compares semantic
          # ID state against the frozen baseline and fails PR validation only for material drift.

      - name: Download and verify exact C2 and C3 artifacts
        shell: bash
        run: |
          set -euo pipefail
          for label in C2 C3; do
            run_var="${label}_RUN_ID"; artifact_var="${label}_ARTIFACT_ID"; name_var="${label}_ARTIFACT_NAME"; digest_var="${label}_ARTIFACT_DIGEST"; head_var="${label}_HEAD_SHA"
            run_id="${!run_var}"; artifact_id="${!artifact_var}"; artifact_name="${!name_var}"; expected_digest="${!digest_var}"; expected_head="${!head_var}"
            metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id")"
            [[ "$(jq -r '.name' <<<"$metadata")" == "$artifact_name" ]]
            [[ "$(jq -r '.expired' <<<"$metadata")" == "false" ]]
            [[ "$(jq -r '.workflow_run.id' <<<"$metadata")" == "$run_id" ]]
            [[ "$(jq -r '.workflow_run.head_sha' <<<"$metadata")" == "$expected_head" ]]
            [[ "$(jq -r '.digest' <<<"$metadata")" == "$expected_digest" ]]
            target="build/${label,,}"
            mkdir -p "$target"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n "$artifact_name" -D "$target"
          done
          c2_report="$(find build/c2 -name track-c-batch2-id-capability-health.json -print -quit)"
          c3_report="$(find build/c3 -name track-c-batch3-id-targeted-validation.json -print -quit)"
          test -n "$c2_report"; test -s "$c2_report"
          test -n "$c3_report"; test -s "$c3_report"
          cp "$c2_report" build/c2-report.json
          cp "$c3_report" build/c3-report.json

      - name: Compile and run C4 regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              'tools/source_lab_c4_id_adoption_drift.py',
              'tests/test_source_lab_c4_id_adoption_drift.py',
          ):
              path = Path('control') / name
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY
          python3 -m unittest control/tests/test_source_lab_c4_id_adoption_drift.py

      - name: Build Batch 4 ID adoption and drift report
        id: report
        shell: bash
        run: |
          set -euo pipefail
          python3 control/tools/source_lab_c4_id_adoption_drift.py \
            --baseline control/compatibility/evidence/track-c-batch4-id-baseline.json \
            --c2-report build/c2-report.json \
            --c3-report build/c3-report.json \
            --inventory-baseline inventory-baseline/inventory/source-inventory.json \
            --inventory-current inventory-current/inventory/source-inventory.json \
            --farm-baseline farm-baseline/compatibility/source-registry.json \
            --farm-current farm-current/compatibility/source-registry.json \
            --miyorare-baseline-root miyorare-baseline \
            --miyorare-current-root miyorare-current \
            --inventory-current-commit '${{ steps.pins.outputs.inventory }}' \
            --farm-current-commit '${{ steps.pins.outputs.farm }}' \
            --miyorare-current-commit '${{ steps.pins.outputs.miyorare }}' \
            --output build/track-c-batch4-id-adoption-drift.json \
            --markdown-output build/track-c-batch4-id-adoption-drift.md
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          data = json.loads(Path('build/track-c-batch4-id-adoption-drift.json').read_text())
          assert data['schemaVersion'] == 1
          assert data['phase'] == 'TRACK_C_BATCH_4_ID_ADOPTION_DRIFT'
          assert data['readOnly'] is True
          assert data['trackCClosed'] is False
          assert data['batch2']['directC4FindingRows'] == 9
          assert data['batch2']['directC4CanonicalSources'] == 7
          assert data['batch3']['canonicalSources'] == 8
          assert data['batch3']['c4Sources'] == 5
          assert data['batch3']['remediationSources'] == 3
          assert data['c4']['findingRows'] == 14
          assert data['c4']['canonicalSources'] == 11
          assert data['adoption']['policy'] == 'PASS_ONLY'
          assert data['adoption']['eligibleRows'] == 1
          assert data['adoption']['canonicalIds'] == ['miyorare:inventory-id:THRIVEMOE']
          assert data['adoption']['adoptionPerformed'] is False
          assert data['remediation']['remainingRows'] == 3
          assert data['remediation']['canonicalIds'] == [
              'miyorare:inventory-id:LUMOSKOMIK',
              'miyorare:inventory-id:MANGABALLINDONESIAN',
              'miyorare:inventory-id:SOFTKOMIK',
          ]
          assert not any(data['safety'].values())
          if os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
              assert data['status'] == 'TRACK_C_C4_COMPLETE_WITH_C3_REMEDIATION', data['status']
              assert data['handoff']['driftRequired'] is False
          print('status=' + data['status'])
          print('drift=' + ('true' if data['handoff']['driftRequired'] else 'false'))
          print('remediation=' + str(data['remediation']['remainingRows']))
          PY

      - name: Recheck live heads and prove all checkouts stayed read-only
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.pins.outputs.inventory }}' == "$(git -C inventory-current ls-remote origin refs/heads/source-inventory-live | awk '{print $1}')" ]]
          [[ '${{ steps.pins.outputs.farm }}' == "$(git -C farm-current ls-remote origin refs/heads/compatibility-farm-foundation | awk '{print $1}')" ]]
          [[ '${{ steps.pins.outputs.miyorare }}' == "$(git -C miyorare-current ls-remote origin refs/heads/Amain2 | awk '{print $1}')" ]]
          for repo in control inventory-baseline inventory-current farm-baseline farm-current miyorare-baseline miyorare-current; do
            test -z "$(git -C "$repo" status --porcelain)"
          done

      - name: Surface future parity drift without creating promotion authority
        if: steps.report.outputs.drift == 'true'
        shell: bash
        run: |
          echo "::warning::Track C ID parity drift detected. Existing Source Lab inventory/Farm/PENDING/approval pipeline remains the authority."

      - name: Upload Batch 4 checkpoint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-c-batch4-id-adoption-drift-${{ github.run_id }}
          path: |
            build/c2-report.json
            build/c3-report.json
            build/track-c-batch4-id-adoption-drift.json
            build/track-c-batch4-id-adoption-drift.md
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Track C — Batch 4: ID Adoption & Drift'
            echo "Control exact head: ${{ steps.pins.outputs.control }}"
            echo "Frozen inventory/Farm/Amain2: $INVENTORY_BASELINE / $FARM_BASELINE / $MIYORARE_AMAIN2_BASELINE"
            echo "Exact evidence artifacts: C2 $C2_RUN_ID/$C2_ARTIFACT_ID; C3 $C3_RUN_ID/$C3_ARTIFACT_ID"
            if [[ -f build/track-c-batch4-id-adoption-drift.md ]]; then
              cat build/track-c-batch4-id-adoption-drift.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
