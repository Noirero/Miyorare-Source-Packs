name: Source Lab D3 Unified Drift Health
run-name: Source Lab D3 Unified Drift Health

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/source-lab-d3-unified-drift-health.yml'
      - '.github/workflows/p2a-unified-health-ci.yml'
      - '.github/workflows/source-lab-add-to-farm.yml'
      - 'compatibility/evidence/track-d-d3-unified-drift-health.json'
      - 'tools/canonical_source_registry_v2.py'
      - 'tools/unified_source_health.py'
      - 'tools/source_lab_d3_unified_drift_health.py'
      - 'tests/test_p1a_canonical_source_registry_v2.py'
      - 'tests/test_p2a_unified_source_health.py'
      - 'tests/test_source_lab_d3_unified_drift_health.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: source-lab-d3-unified-drift-health-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  EXPECTED_OWNER_ID: '149634319'
  POST_D2_MAIN: 'a888dd8b9509fec5d5ba12a85f47a19b2bb08542'
  FARM_D3_BASELINE: 'b7ca433c756caf210a4e0dbe7a2542a23e60eee7'
  REVIEWED_FARM_COMMIT: 'bd9a1a73d0c4cc1c36d94ca05bcf972672bdf0a2'
  D2_RUN_ID: '39374333195'
  D2_ARTIFACT_ID: '12242931064'
  D2_ARTIFACT_NAME: 'track-d-d2-provider-preference-recovery-39374333195'
  D2_ARTIFACT_DIGEST: 'sha256:ce40dc5cecc9e768f24fcd99b30da31b0d7ba95fb127ab0ddfd0561630e507ad'
  D2_HEAD_SHA: '4064bc528baa158c3f2a6e05a5518ed19ccda810'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  unified-drift-health:
    name: Prove unified drift and health convergence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Validate safe execution context
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "Noirero/Miyorare-Source-Packs" ]]
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              [[ "$PR_HEAD_REPO" == "$GITHUB_REPOSITORY" ]] || { echo "::error::D3 accepts same-repository pull requests only"; exit 1; }
              [[ "$PR_BASE_SHA" == "$POST_D2_MAIN" ]] || { echo "::error::D3 must start from exact post-D2 main"; exit 1; }
              ;;
            workflow_dispatch)
              [[ "$GITHUB_ACTOR_ID" == "$EXPECTED_OWNER_ID" ]]
              [[ "$GITHUB_REF_NAME" == "main" ]]
              ;;
            *) echo "::error::unexpected event: $GITHUB_EVENT_NAME"; exit 1 ;;
          esac

      - name: Checkout exact proposed D3 control plane
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: control
          fetch-depth: 1

      - name: Checkout D3 Compatibility Farm snapshot
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: compatibility-farm-foundation
          path: farm-current
          fetch-depth: 1

      - name: Checkout exact reviewed pack-authority Farm snapshot
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.REVIEWED_FARM_COMMIT }}
          path: farm-reviewed
          fetch-depth: 1

      - name: Pin exact D3 heads and baseline bindings
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          control_sha="$(git -C control rev-parse HEAD)"
          farm_sha="$(git -C farm-current rev-parse HEAD)"
          reviewed_sha="$(git -C farm-reviewed rev-parse HEAD)"
          remote_farm="$(git -C farm-current ls-remote origin refs/heads/compatibility-farm-foundation | awk '{print $1}')"
          [[ "$control_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$farm_sha" == "$remote_farm" ]]
          [[ "$farm_sha" == "$FARM_D3_BASELINE" ]] || { echo "::error::Compatibility Farm moved after D3 planning"; exit 1; }
          [[ "$reviewed_sha" == "$REVIEWED_FARM_COMMIT" ]]
          echo "control=$control_sha" >> "$GITHUB_OUTPUT"
          echo "farm=$farm_sha" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          baseline=json.loads(Path('control/compatibility/evidence/track-d-d3-unified-drift-health.json').read_text())
          assert baseline['phase']=='TRACK_D_D3_UNIFIED_DRIFT_HEALTH'
          assert baseline['readOnlyAcceptance'] is True
          assert baseline['sourcePacksAfterD2']==os.environ['POST_D2_MAIN']
          assert baseline['compatibilityFarmBaseline']==os.environ['FARM_D3_BASELINE']
          assert baseline['reviewedPackAuthorityFarmCommit']==os.environ['REVIEWED_FARM_COMMIT']
          artifact=baseline['d2Artifact']
          assert str(artifact['runId'])==os.environ['D2_RUN_ID']
          assert str(artifact['artifactId'])==os.environ['D2_ARTIFACT_ID']
          assert artifact['name']==os.environ['D2_ARTIFACT_NAME']
          assert artifact['digest']==os.environ['D2_ARTIFACT_DIGEST']
          assert artifact['headSha']==os.environ['D2_HEAD_SHA']
          assert artifact['requiredStatus']=='D2_PROVIDER_PREFERENCE_RECOVERY_PROVEN'
          assert baseline['nextStage']=='TRACK_D_D4_LONG_TERM_AUTOMATION_ACCEPTANCE'
          PY

      - name: Snapshot read-only Farm state
        id: before
        shell: bash
        run: |
          set -euo pipefail
          echo "registry=$(sha256sum farm-current/compatibility/source-registry.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "worker=$(sha256sum farm-current/automation/pending-worker-state.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "status=$(sha256sum farm-current/upstream/status.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Download exact D2 acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/d2
          metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$D2_ARTIFACT_ID")"
          [[ "$(jq -r '.name' <<<"$metadata")" == "$D2_ARTIFACT_NAME" ]]
          [[ "$(jq -r '.expired' <<<"$metadata")" == "false" ]]
          [[ "$(jq -r '.workflow_run.id' <<<"$metadata")" == "$D2_RUN_ID" ]]
          [[ "$(jq -r '.workflow_run.head_sha' <<<"$metadata")" == "$D2_HEAD_SHA" ]]
          [[ "$(jq -r '.digest' <<<"$metadata")" == "$D2_ARTIFACT_DIGEST" ]]
          gh run download "$D2_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$D2_ARTIFACT_NAME" -D build/d2
          d2_report="$(find build/d2 -name track-d-d2-provider-preference-recovery.json -print -quit)"
          test -n "$d2_report"; test -s "$d2_report"
          cp "$d2_report" build/d2-report.json

      - name: Run canonical and health regression suites
        working-directory: control
        run: |
          python3 -m unittest \
            tests.test_p1a_canonical_source_registry_v2 \
            tests.test_p2a_unified_source_health \
            tests.test_source_lab_d3_unified_drift_health -v
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              'tools/canonical_source_registry_v2.py',
              'tools/unified_source_health.py',
              'tools/source_lab_d3_unified_drift_health.py',
          ):
              path = Path(name)
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY

      - name: Build live canonical authority with reviewed-source continuity
        shell: bash
        run: |
          set -euo pipefail
          python3 control/tools/canonical_source_registry_v2.py migrate \
            --farm farm-current/compatibility/source-registry.json \
            --pack-authority control/governance/existing-source-pack-authority.v1.json \
            --farm-commit '${{ steps.pins.outputs.farm }}' \
            --reviewed-farm farm-reviewed/compatibility/source-registry.json \
            --reviewed-farm-commit "$REVIEWED_FARM_COMMIT" \
            --output build/canonical-source-registry-v2.json
          python3 control/tools/canonical_source_registry_v2.py validate \
            --registry build/canonical-source-registry-v2.json

      - name: Build live unified source health
        shell: bash
        run: |
          set -euo pipefail
          python3 control/tools/unified_source_health.py build \
            --farm farm-current/compatibility/source-registry.json \
            --upstream-status control/upstream/status.json \
            --canonical-registry build/canonical-source-registry-v2.json \
            --output build/unified-source-health.json
          python3 control/tools/unified_source_health.py validate \
            --health build/unified-source-health.json

      - name: Build D3 convergence report
        shell: bash
        run: |
          set -euo pipefail
          python3 control/tools/source_lab_d3_unified_drift_health.py \
            --baseline control/compatibility/evidence/track-d-d3-unified-drift-health.json \
            --d2-report build/d2-report.json \
            --canonical-registry build/canonical-source-registry-v2.json \
            --unified-health build/unified-source-health.json \
            --en-drift-workflow control/.github/workflows/source-lab-b4-en-adoption-drift.yml \
            --id-drift-workflow control/.github/workflows/source-lab-c4-id-adoption-drift.yml \
            --unified-health-workflow control/.github/workflows/p2a-unified-health-ci.yml \
            --onboarding-workflow control/.github/workflows/source-lab-add-to-farm.yml \
            --control-head '${{ steps.pins.outputs.control }}' \
            --farm-commit '${{ steps.pins.outputs.farm }}' \
            --output build/track-d-d3-unified-drift-health.json \
            --markdown-output build/track-d-d3-unified-drift-health.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('build/track-d-d3-unified-drift-health.json').read_text())
          assert report['phase']=='TRACK_D_D3_UNIFIED_DRIFT_HEALTH'
          assert report['readOnlyAcceptance'] is True
          assert report['status'] in {
              'D3_UNIFIED_DRIFT_HEALTH_PROVEN',
              'D3_UNIFIED_DRIFT_HEALTH_PROVEN_WITH_OWNER_PACK_HANDOFFS',
          }
          assert report['trackDClosed'] is False
          assert report['nextStage']=='TRACK_D_D4_LONG_TERM_AUTOMATION_ACCEPTANCE'
          assert report['proofs']['packAuthorityContinuity']['status']=='PROVEN'
          assert report['proofs']['driftAndHealthConvergence']['status']=='PROVEN'
          assert report['proofs']['unifiedHealthObservability']['status']=='PROVEN'
          assert report['proofs']['futureOnboardingPackAuthority']['status']=='PROVEN'
          assert not any(report['safety'].values())
          PY

      - name: Recheck Farm and prove D3 acceptance is read-only
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.pins.outputs.farm }}' == "$(git -C farm-current ls-remote origin refs/heads/compatibility-farm-foundation | awk '{print $1}')" ]]
          [[ "$(sha256sum farm-current/compatibility/source-registry.json | awk '{print $1}')" == '${{ steps.before.outputs.registry }}' ]]
          [[ "$(sha256sum farm-current/automation/pending-worker-state.json | awk '{print $1}')" == '${{ steps.before.outputs.worker }}' ]]
          [[ "$(sha256sum farm-current/upstream/status.json | awk '{print $1}')" == '${{ steps.before.outputs.status }}' ]]
          for checkout in control farm-current farm-reviewed; do
            dirty="$(git -C "$checkout" status --porcelain)"
            if [[ -n "$dirty" ]]; then
              echo "::error::D3 read-only proof found a dirty checkout: $checkout"
              printf '%s\n' "$dirty"
              exit 1
            fi
          done

      - name: Upload D3 convergence evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-d-d3-unified-drift-health-${{ github.run_id }}
          path: |
            build/d2-report.json
            build/canonical-source-registry-v2.json
            build/unified-source-health.json
            build/track-d-d3-unified-drift-health.json
            build/track-d-d3-unified-drift-health.md
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          {
            echo '## Track D — D3: Unified Drift & Health'
            echo "Control exact head: ${{ steps.pins.outputs.control }}"
            echo "Compatibility Farm: ${{ steps.pins.outputs.farm }}"
            cat build/track-d-d3-unified-drift-health.md
          } >> "$GITHUB_STEP_SUMMARY"
