name: Compatibility Farm Foundation

on:
  push:
    branches:
      - beta
      - 'compatibility-farm-*'
    paths:
      - 'compatibility/**'
      - 'tools/compatibility_contract.py'
      - 'tools/source_registry.py'
      - 'tools/deterministic_farm.py'
      - 'tools/source_shape_guard.py'
      - 'tools/behavioral_fixture.py'
      - 'tools/parser_harness_report.py'
      - 'tools/parser_harness_aggregate.py'
      - 'tools/repair_engine.py'
      - 'tools/repair_evidence.py'
      - 'tests/test_compatibility_contract.py'
      - 'tests/test_source_registry.py'
      - 'tests/test_deterministic_farm.py'
      - 'tests/test_source_shape_guard.py'
      - 'tests/test_behavioral_fixture.py'
      - 'tests/test_parser_harness_report.py'
      - 'tests/test_parser_harness_aggregate.py'
      - 'tests/test_repair_engine.py'
      - 'tests/test_repair_evidence.py'
      - '.github/workflows/compatibility-farm-foundation.yml'
  pull_request:
    branches:
      - beta
      - main
    paths:
      - 'compatibility/**'
      - 'tools/compatibility_contract.py'
      - 'tools/source_registry.py'
      - 'tools/deterministic_farm.py'
      - 'tools/source_shape_guard.py'
      - 'tools/behavioral_fixture.py'
      - 'tools/parser_harness_report.py'
      - 'tools/parser_harness_aggregate.py'
      - 'tools/repair_engine.py'
      - 'tools/repair_evidence.py'
      - 'tests/test_compatibility_contract.py'
      - 'tests/test_source_registry.py'
      - 'tests/test_deterministic_farm.py'
      - 'tests/test_source_shape_guard.py'
      - 'tests/test_behavioral_fixture.py'
      - 'tests/test_parser_harness_report.py'
      - 'tests/test_parser_harness_aggregate.py'
      - 'tests/test_repair_engine.py'
      - 'tests/test_repair_evidence.py'
      - '.github/workflows/compatibility-farm-foundation.yml'

permissions:
  contents: read

concurrency:
  group: compatibility-farm-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-regression-invariants:
    name: Validate approve-only safety invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve pinned provider baselines
        id: provider-refs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path('compatibility/source-registry.json').read_text(encoding='utf-8'))
          print(f"keiyoushi={data['providerBaselines']['keiyoushi']}")
          print(f"uma={data['providerBaselines']['uma']}")
          print(f"gekkoushi={data['providerBaselines']['gekkoushi']}")
          PY

      - name: Checkout pinned UMA source
        uses: actions/checkout@v5
        with:
          repository: InvalidDavid/UMA
          ref: ${{ steps.provider-refs.outputs.uma }}
          path: _upstream/uma
          fetch-depth: 1

      - name: Checkout pinned Gekkoushi source
        uses: actions/checkout@v5
        with:
          repository: Gekkoushi/plugin-source
          ref: ${{ steps.provider-refs.outputs.gekkoushi }}
          path: _upstream/gekkoushi
          fetch-depth: 1

      - name: Checkout pinned Keiyoushi source
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: ${{ steps.provider-refs.outputs.keiyoushi }}
          path: _upstream/keiyoushi
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile Compatibility Farm helpers
        run: >-
          python3 -m py_compile
          tools/compatibility_contract.py
          tools/source_registry.py
          tools/deterministic_farm.py
          tools/source_shape_guard.py
          tools/behavioral_fixture.py
          tools/parser_harness_report.py
          tools/parser_harness_aggregate.py
          tools/repair_engine.py
          tools/repair_evidence.py

      - name: Validate machine-readable compatibility contract
        run: python3 tools/compatibility_contract.py validate --contract compatibility/contract.json

      - name: Validate ID EN seed source registry
        run: python3 tools/source_registry.py validate --registry compatibility/source-registry.json

      - name: Show seed cohort summary
        run: python3 tools/source_registry.py summary --registry compatibility/source-registry.json

      - name: Validate expanded baseline-bound deterministic fixtures
        run: >-
          python3 tools/deterministic_farm.py validate
          --contract compatibility/contract.json
          --registry compatibility/source-registry.json
          --fixtures compatibility/fixtures/deterministic-seed-8.json

      - name: Verify expanded fixtures against pinned UMA Kotlin source
        run: >-
          python3 tools/source_shape_guard.py
          --registry compatibility/source-registry.json
          --fixtures compatibility/fixtures/deterministic-seed-8.json
          --families compatibility/adapter-families.json
          --provider uma
          --root _upstream/uma
          --output build/source-shape-uma.json

      - name: Verify Gekkoushi-backed fixtures against pinned Kotlin source
        run: >-
          python3 tools/source_shape_guard.py
          --registry compatibility/source-registry.json
          --fixtures compatibility/fixtures/deterministic-seed-8.json
          --families compatibility/adapter-families.json
          --provider gekkoushi
          --root _upstream/gekkoushi
          --output build/source-shape-gekkoushi.json

      - name: Run expanded deterministic Compatibility Farm seed
        run: >-
          python3 tools/deterministic_farm.py run
          --contract compatibility/contract.json
          --registry compatibility/source-registry.json
          --fixtures compatibility/fixtures/deterministic-seed-8.json
          --output build/deterministic-seed-report.json

      - name: Validate behavioral response fixtures
        run: >-
          python3 tools/behavioral_fixture.py validate
          --registry compatibility/source-registry.json
          --fixtures compatibility/fixtures/behavioral-seed-4.json

      - name: Run behavioral response fixture suite
        run: >-
          python3 tools/behavioral_fixture.py run
          --registry compatibility/source-registry.json
          --fixtures compatibility/fixtures/behavioral-seed-4.json
          --output build/behavioral-seed-report.json

      - name: Install real Kotlin parser harness into disposable UMA checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _upstream/uma/src/test/kotlin/compatibilityfarm
          mkdir -p _upstream/uma/src/test/resources/compatibility-farm
          cp compatibility/harness/uma/*.kt _upstream/uma/src/test/kotlin/compatibilityfarm/
          cp -R compatibility/harness/uma/resources/. _upstream/uma/src/test/resources/compatibility-farm/

      - name: Execute real UMA Kotlin parser harness seed including COOKIE auth
        working-directory: _upstream/uma
        run: |
          chmod +x gradlew
          ./gradlew test \
            --tests compatibilityfarm.KomikuParserHarnessTest \
            --tests compatibilityfarm.ShinigamiParserHarnessTest \
            --tests compatibilityfarm.WeebCentralAuthParserHarnessTest \
            --no-daemon

      - name: Normalize UMA real parser execution evidence
        run: >-
          python3 tools/parser_harness_report.py
          --registry compatibility/source-registry.json
          --results-dir _upstream/uma/build/test-results/test
          --provider uma
          --source miyorare:miyorare-id:KOMIKU=compatibilityfarm.KomikuParserHarnessTest
          --source miyorare:miyorare-id:SHINIGAMI=compatibilityfarm.ShinigamiParserHarnessTest
          --source miyorare:miyorare-en:WEEBCENTRAL=compatibilityfarm.WeebCentralAuthParserHarnessTest
          --output build/real-parser-harness-uma-report.json

      - name: Isolate upstream Gekkoushi tests and install real parser harness
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d _upstream/gekkoushi/src/test ]]; then
            mv _upstream/gekkoushi/src/test _upstream/gekkoushi/_compatibility-upstream-tests
          fi
          mkdir -p _upstream/gekkoushi/src/test/kotlin/compatibilityfarm
          mkdir -p _upstream/gekkoushi/src/test/resources/compatibility-farm/shinigami
          cp compatibility/harness/uma/DeterministicMangaLoaderContext.kt _upstream/gekkoushi/src/test/kotlin/compatibilityfarm/
          cp compatibility/harness/gekkoushi/*.kt _upstream/gekkoushi/src/test/kotlin/compatibilityfarm/
          cp -R compatibility/harness/gekkoushi/resources/. _upstream/gekkoushi/src/test/resources/compatibility-farm/
          cp -R compatibility/harness/uma/resources/shinigami/. _upstream/gekkoushi/src/test/resources/compatibility-farm/shinigami/

      - name: Auto-repair recognized Gekkoushi request-header forwarding gap
        run: >-
          python3 tools/repair_engine.py
          --recipes compatibility/repair-recipes.json
          --recipe forward-parser-request-headers-to-http-get
          --provider gekkoushi
          --canonical-id miyorare:miyorare-id:SHINIGAMI
          --root _upstream/gekkoushi
          --path src/main/kotlin/tsuki/site/id/Shinigami.kt
          --output build/repair-shinigami-gekkoushi.json

      - name: Execute real Gekkoushi Kotlin parser harness seed after repair
        working-directory: _upstream/gekkoushi
        run: |
          chmod +x gradlew
          ./gradlew test \
            --tests compatibilityfarm.DoujinDesuParserHarnessTest \
            --tests compatibilityfarm.ShinigamiGekkoushiParserHarnessTest \
            --no-daemon

      - name: Normalize Gekkoushi real parser execution evidence
        run: >-
          python3 tools/parser_harness_report.py
          --registry compatibility/source-registry.json
          --results-dir _upstream/gekkoushi/build/test-results/test
          --provider gekkoushi
          --source miyorare:miyorare-id:DOUJINDESU=compatibilityfarm.DoujinDesuParserHarnessTest
          --source miyorare:miyorare-id:SHINIGAMI=compatibilityfarm.ShinigamiGekkoushiParserHarnessTest
          --output build/real-parser-harness-gekkoushi-report.json

      - name: Install real Keiyoushi parser harness into disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          module=_upstream/keiyoushi/src/id/komiku
          mkdir -p "$module/compatibility-farm-test"
          mkdir -p "$module/compatibility-farm-resources/compatibility-farm"
          cp compatibility/harness/keiyoushi/KeiyoushiKomikuParserHarnessTest.kt "$module/compatibility-farm-test/"
          cp -R compatibility/harness/keiyoushi/runtime/. "$module/compatibility-farm-test/"
          cp -R compatibility/harness/keiyoushi/resources/. "$module/compatibility-farm-resources/compatibility-farm/"
          cat >> "$module/build.gradle.kts" <<'EOF'

          // Compatibility Farm test-only wiring. This exists only in the disposable CI checkout.
          android {
              sourceSets {
                  named("test") {
                      java.directories.add("compatibility-farm-test")
                      kotlin.directories.add("compatibility-farm-test")
                      resources.directories.add("compatibility-farm-resources")
                  }
              }
              testOptions {
                  unitTests.isReturnDefaultValues = true
              }
          }

          dependencies {
              testImplementation(libs.junit)
              testImplementation(libs.bundles.common)
          }

          // Main KSP must remain enabled because it generates keiyoushi.source.Generated.
          // Test KSP is irrelevant to the parser harness and fails when it sees no test @Source.
          tasks.matching { it.name == "kspDebugUnitTestKotlin" }.configureEach {
              enabled = false
          }
          EOF

      - name: Execute real Keiyoushi Komiku parser harness seed
        working-directory: _upstream/keiyoushi
        run: |
          chmod +x gradlew
          ./gradlew :src:id:komiku:testDebugUnitTest \
            --tests compatibilityfarm.KeiyoushiKomikuParserHarnessTest \
            --no-daemon

      - name: Normalize Keiyoushi real parser execution evidence
        run: >-
          python3 tools/parser_harness_report.py
          --registry compatibility/source-registry.json
          --results-dir _upstream/keiyoushi/src/id/komiku/build/test-results/testDebugUnitTest
          --provider keiyoushi
          --source miyorare:miyorare-id:KOMIKU=compatibilityfarm.KeiyoushiKomikuParserHarnessTest
          --output build/real-parser-harness-keiyoushi-report.json

      - name: Aggregate real parser evidence across providers
        run: >-
          python3 tools/parser_harness_aggregate.py
          --registry compatibility/source-registry.json
          --report build/real-parser-harness-uma-report.json
          --report build/real-parser-harness-gekkoushi-report.json
          --report build/real-parser-harness-keiyoushi-report.json
          --output build/real-parser-harness-aggregate.json

      - name: Attach auto-repair outcome to aggregate evidence
        run: >-
          python3 tools/repair_evidence.py
          --aggregate build/real-parser-harness-aggregate.json
          --repair-report build/repair-shinigami-gekkoushi.json
          --output build/real-parser-harness-evidence.json

      - name: Run repository unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Upload Compatibility Farm reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-farm-foundation-reports
          path: |
            build/deterministic-seed-report.json
            build/source-shape-uma.json
            build/source-shape-gekkoushi.json
            build/behavioral-seed-report.json
            build/repair-shinigami-gekkoushi.json
            build/real-parser-harness-uma-report.json
            build/real-parser-harness-gekkoushi-report.json
            build/real-parser-harness-keiyoushi-report.json
            build/real-parser-harness-aggregate.json
            build/real-parser-harness-evidence.json
            _upstream/uma/build/test-results/test/*.xml
            _upstream/gekkoushi/build/test-results/test/*.xml
            _upstream/keiyoushi/src/id/komiku/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 14
