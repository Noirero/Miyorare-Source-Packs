name: Seal Source Pack Draft

on:
  workflow_call:
    inputs:
      tag:
        description: Draft miyorare-sources-vX.Y.Z release tag to seal
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing miyorare-sources-vX.Y.Z draft to seal, or sealed release to verify
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: source-pack-seal-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout trust contract
        uses: actions/checkout@v5

      - name: Validate release identity and state
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^miyorare-sources-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Not an official Source Pack tag: $TAG"
            exit 1
          }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" <<'PY' >> "$GITHUB_ENV"
          import json, os, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          if data.get('tagName') != os.environ['TAG']:
              raise SystemExit('release tag mismatch')
          if data.get('isPrerelease'):
              raise SystemExit('Source Pack stable release staging must not be prerelease')
          print(f"RELEASE_IS_DRAFT={'true' if data.get('isDraft') else 'false'}")
          PY

      - name: Download staged payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist seal
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          test -s dist/miyorare-source-packs.json
          if [ -e dist/miyorare-release-lock.json ] || [ -e dist/miyorare-release-lock.sha256 ]; then
            test -s dist/miyorare-release-lock.json
            test -s dist/miyorare-release-lock.sha256
            echo "Existing seal assets found; this workflow never overwrites release seals."
            cp dist/miyorare-release-lock.json seal/miyorare-release-lock.json
            cp dist/miyorare-release-lock.sha256 seal/miyorare-release-lock.sha256
            echo "already_sealed=true" >> "$GITHUB_ENV"
          else
            echo "already_sealed=false" >> "$GITHUB_ENV"
          fi

      - name: Validate authoritative compatibility manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/source_pack_manifest.py validate \
            --manifest dist/miyorare-source-packs.json \
            --contract compatibility/miyorare-source-pack-contract.v1.json \
            --tag "$TAG"

      - name: Require exact stable runtime compatibility contract
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_COMMIT="$(python3 - <<'PY'
          import json
          print(json.load(open('dist/miyorare-source-packs.json', encoding='utf-8'))['runtimeCompatibility']['commit'])
          PY
          )"
          [[ "$RUNTIME_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/Noirero/Miyorare/${RUNTIME_COMMIT}/compatibility/miyorare-source-pack-contract.v1.json" \
            -o "$RUNNER_TEMP/miyorare-contract.json"
          cmp --silent compatibility/miyorare-source-pack-contract.v1.json "$RUNNER_TEMP/miyorare-contract.json" || {
            echo "::error::Source Pack contract differs from the exact stable Miyorare runtime baseline."
            exit 1
          }

      - name: Refuse retroactive sealing of published releases
        if: env.RELEASE_IS_DRAFT != 'true' && env.already_sealed != 'true'
        shell: bash
        run: |
          echo "::error::Published Source Pack $TAG is unsealed. Phase 3 forbids retroactive sealing; stable releases must be sealed while draft."
          exit 1

      - name: Build canonical release lock while draft
        if: env.RELEASE_IS_DRAFT == 'true' && env.already_sealed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json id,tagName,targetCommitish,publishedAt,url,isDraft,isPrerelease \
            > "$RUNNER_TEMP/release-metadata.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path('dist')
          contract_path = Path('compatibility/miyorare-source-pack-contract.v1.json')
          manifest_path = dist / 'miyorare-source-packs.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('tag') != os.environ['TAG']:
              raise SystemExit('release manifest tag does not match GitHub release tag')

          expected_jars = {}
          for pack in manifest.get('packs', []):
              for shard in pack.get('shards', []):
                  name = shard.get('assetName')
                  digest = shard.get('sha256')
                  if not isinstance(name, str) or not isinstance(digest, str) or len(digest) != 64:
                      raise SystemExit('release manifest contains an invalid shard binding')
                  expected_jars[name] = digest.lower()
          if not expected_jars:
              raise SystemExit('release manifest binds no Source Pack jars')
          for name, expected in expected_jars.items():
              path = dist / name
              if not path.is_file():
                  raise SystemExit(f'missing manifest-bound asset: {name}')
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'manifest SHA-256 mismatch for {name}')

          assets = []
          for path in sorted(p for p in dist.iterdir() if p.is_file()):
              if path.name in {'miyorare-release-lock.json', 'miyorare-release-lock.sha256'}:
                  continue
              data = path.read_bytes()
              assets.append({
                  'name': path.name,
                  'size': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })

          metadata = json.loads(Path(os.environ['RUNNER_TEMP'], 'release-metadata.json').read_text(encoding='utf-8'))
          if metadata.get('isDraft') is not True or metadata.get('isPrerelease') is True:
              raise SystemExit('release must still be a stable-channel draft when the lock is created')
          contract_bytes = contract_path.read_bytes()
          lock = {
              'schemaVersion': 1,
              'kind': 'MIYORARE_SOURCE_PACK_RELEASE_LOCK',
              'immutable': True,
              'sealedBeforePublish': True,
              'tag': os.environ['TAG'],
              'releaseId': metadata.get('id'),
              'releaseUrl': metadata.get('url'),
              'targetCommitish': metadata.get('targetCommitish'),
              'publishedAt': metadata.get('publishedAt'),
              'contract': {
                  'path': str(contract_path),
                  'sha256': hashlib.sha256(contract_bytes).hexdigest(),
              },
              'releaseManifestSha256': hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
              'assets': assets,
              'signatureMode': 'GITHUB_ARTIFACT_ATTESTATION',
              'signatureIssuer': 'https://token.actions.githubusercontent.com',
              'signatureRepository': 'Noirero/Miyorare-Source-Packs',
              'signatureWorkflow': '.github/workflows/source-pack-release-seal.yml',
          }
          out = Path('seal/miyorare-release-lock.json')
          out.write_text(json.dumps(lock, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          Path('seal/miyorare-release-lock.sha256').write_text(
              f'{digest}  miyorare-release-lock.json\n', encoding='utf-8'
          )
          PY

      - name: Cryptographically attest release lock with GitHub OIDC
        if: env.RELEASE_IS_DRAFT == 'true' && env.already_sealed != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: seal/miyorare-release-lock.json

      - name: Verify cryptographic attestation and staged payload
        shell: bash
        run: |
          set -euo pipefail
          (cd seal && sha256sum -c miyorare-release-lock.sha256)
          gh attestation verify seal/miyorare-release-lock.json --repo "$GITHUB_REPOSITORY"
          cp seal/miyorare-release-lock.json dist/miyorare-release-lock.json
          cp seal/miyorare-release-lock.sha256 dist/miyorare-release-lock.sha256
          python3 tools/verify_release_lock.py \
            --dir dist \
            --tag "$TAG" \
            --require-sealed-before-publish

      - name: Upload immutable seal assets to draft once
        if: env.RELEASE_IS_DRAFT == 'true' && env.already_sealed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            seal/miyorare-release-lock.json \
            seal/miyorare-release-lock.sha256 \
            --repo "$GITHUB_REPOSITORY"

      - name: Re-download and audit staged release from GitHub
        shell: bash
        run: |
          set -euo pipefail
          rm -rf audit
          mkdir audit
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir audit
          test -s audit/miyorare-release-lock.json
          test -s audit/miyorare-release-lock.sha256
          python3 tools/source_pack_manifest.py validate \
            --manifest audit/miyorare-source-packs.json \
            --contract compatibility/miyorare-source-pack-contract.v1.json \
            --tag "$TAG"
          gh attestation verify audit/miyorare-release-lock.json --repo "$GITHUB_REPOSITORY"
          python3 tools/verify_release_lock.py \
            --dir audit \
            --tag "$TAG" \
            --require-sealed-before-publish

      - name: Summary
        shell: bash
        run: |
          {
            echo '# Source Pack draft seal'
            echo
            echo "Tag: \`$TAG\`"
            echo "Draft at verification: \`$RELEASE_IS_DRAFT\`"
            echo 'Schema 3 compatibility metadata was validated.'
            echo 'Release payload is bound by SHA-256 in a canonical release lock.'
            echo 'The lock proves seal-before-publish and is attested using GitHub OIDC.'
            echo 'The complete remote asset set was downloaded again and verified before stable publication.'
            echo 'Seal files are never overwritten by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
