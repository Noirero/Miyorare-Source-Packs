name: Miyorare Source Sync Result

on:
  workflow_run:
    workflows:
      - Miyorare Upstream Sync
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  summary:
    name: Summarize manual upstream diagnostics
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Emit read-only recovery summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Miyorare Source Sync Result'
            echo
            echo "Recovery diagnostics run: \`$RUN_ID\`"
            echo "Conclusion: **$RUN_CONCLUSION**"
            echo
            echo 'Routine upstream intake no longer opens or refreshes automation pull requests.'
            echo 'Source Lab Auto Farm owns scheduled detection, Candidate Farm execution, and WAITING_FOR_APPROVAL staging.'
            echo 'No repository ref, last-known-good state, approval state, or release is mutated by this summary workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
