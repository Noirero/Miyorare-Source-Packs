name: Miyorare Source Sync Result

on:
  workflow_run:
    workflows:
      - Miyorare Upstream Sync
    types:
      - completed

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: miyorare-upstream-status-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  persist:
    name: Persist atomic Source Sync result
    if: github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      AUTOMATION_BRANCH: automation/upstream-sync-${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Checkout protected base branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_BRANCH }}
          fetch-depth: 0

      - name: Start proposal from current protected base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$AUTOMATION_BRANCH" "origin/$HEAD_BRANCH"

      - name: Download sync evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _sync-plan _diagnostics/keiyoushi _diagnostics/gekkoushi _promoted-registry
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name upstream-sync-plan --dir _sync-plan || true
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name keiyoushi-intake-report --dir _diagnostics/keiyoushi || true
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name gekkoushi-overlay-report --dir _diagnostics/gekkoushi || true
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name promoted-upstream-registry --dir _promoted-registry || true
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs > _sync-plan/jobs.json

      - name: Apply validated registry proposal
        shell: bash
        run: |
          set -euo pipefail
          registry_artifact="$(find _promoted-registry -type f -name registry.json -print -quit || true)"
          if [[ -n "$registry_artifact" ]]; then
            cp "$registry_artifact" upstream/registry.json
            echo "Applied validated registry proposal from $registry_artifact"
          else
            echo 'No promoted registry artifact; active registry remains unchanged.'
          fi

      - name: Generate status and outcome as one transaction
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = int(os.environ['RUN_ID'])
          run_conclusion = os.environ.get('RUN_CONCLUSION', '')
          registry = json.loads(Path('upstream/registry.json').read_text(encoding='utf-8'))
          providers = registry['providers']

          plan_path = Path('_sync-plan/sync-plan.json')
          if plan_path.is_file():
              plan = json.loads(plan_path.read_text(encoding='utf-8'))
          else:
              plan = {'providers': {}}

          jobs = json.loads(Path('_sync-plan/jobs.json').read_text(encoding='utf-8')).get('jobs', [])
          failed_jobs = [job.get('name', 'unknown') for job in jobs if job.get('conclusion') in ('failure', 'cancelled', 'timed_out')]

          kei_report_path = Path('_diagnostics/keiyoushi/keiyoushi-intake.json')
          kei_adapter_path = Path('_diagnostics/keiyoushi/keiyoushi-semantic-adapter.json')
          gek_report_path = Path('_diagnostics/gekkoushi/gekkoushi-overlay-report.json')
          kei_report = json.loads(kei_report_path.read_text(encoding='utf-8')) if kei_report_path.is_file() else None
          kei_adapter = json.loads(kei_adapter_path.read_text(encoding='utf-8')) if kei_adapter_path.is_file() else None
          gek_report = json.loads(gek_report_path.read_text(encoding='utf-8')) if gek_report_path.is_file() else None

          result = {
              'schema': 2,
              'workflowRunId': run_id,
              'providers': {},
          }

          pipeline_failed = run_conclusion != 'success'
          if not plan_path.is_file() and not pipeline_failed:
              raise SystemExit('successful upstream run did not publish upstream-sync-plan')

          for provider in ('keiyoushi', 'uma', 'gekkoushi'):
              provider_registry = providers[provider]
              current = provider_registry['lastKnownGood']
              candidate_info = plan.get('providers', {}).get(provider, {})
              candidate = candidate_info.get('candidate', current)
              changed = bool(candidate_info.get('changed', False))

              if pipeline_failed:
                  entry = {
                      'state': 'broken',
                      'lastKnownGood': current,
                      'reason': 'upstream-sync-pipeline-failure',
                      'failedJobs': failed_jobs,
                  }
                  if changed:
                      entry['candidate'] = candidate
              elif not changed:
                  entry = {
                      'state': 'synced',
                      'lastKnownGood': current,
                  }
              elif candidate == current:
                  entry = {
                      'state': 'promoted',
                      'candidate': candidate,
                      'lastKnownGood': current,
                  }
              else:
                  reason = 'candidate-validation-or-integration-held'
                  if provider == 'keiyoushi' and kei_report and kei_report.get('blockingSourceCount', 0):
                      reason = 'compatibility-or-intake-validation-failure'
                  elif provider == 'keiyoushi' and kei_adapter and kei_adapter.get('blocked'):
                      reason = 'semantic-adapter-blocked'
                  elif provider == 'gekkoushi' and gek_report and gek_report.get('conflicts'):
                      reason = 'protected-overlay-conflict'
                  entry = {
                      'state': 'held',
                      'candidate': candidate,
                      'lastKnownGood': current,
                      'reason': reason,
                  }

              if provider == 'keiyoushi':
                  entry['semanticBase'] = provider_registry['semanticBase']
                  entry['semanticAdapters'] = list(provider_registry.get('semanticAdapters', []))
                  if kei_report:
                      affected = []
                      for source in kei_report.get('sources', []):
                          if source.get('state') == 'unaffected':
                              continue
                          affected.append({
                              'canonicalId': source.get('canonicalId'),
                              'pack': source.get('pack'),
                              'sourceName': source.get('officialSourceName'),
                              'module': source.get('keiyoushiModule'),
                              'state': source.get('state'),
                              'action': source.get('action'),
                              'changeClasses': source.get('changeClasses', []),
                              'adapterCoverage': source.get('adapterCoverage', []),
                              'changedFiles': [item.get('path') for item in source.get('files', [])],
                          })
                      entry['sourceStatus'] = affected
                      entry['sharedRuntimeFiles'] = kei_report.get('sharedRuntimeFiles', [])
                      entry['affectedSourceCount'] = kei_report.get('affectedSourceCount', len(affected))
                      entry['blockingSourceCount'] = kei_report.get('blockingSourceCount', 0)
                  elif kei_adapter and kei_adapter.get('blocked'):
                      blocked = []
                      for item in kei_adapter.get('blocked', []):
                          changed_files = [
                              path for path in (item.get('keiyoushiFile'), item.get('umaFile'))
                              if path
                          ]
                          blocked.append({
                              'canonicalId': item.get('canonicalId'),
                              'pack': None,
                              'sourceName': None,
                              'module': item.get('module'),
                              'state': 'review-required',
                              'action': 'semantic-adapter-blocked',
                              'reason': item.get('reason'),
                              'changeClasses': [],
                              'adapterCoverage': [],
                              'changedFiles': changed_files,
                          })
                      entry['sourceStatus'] = blocked
                      entry['adapterBlocked'] = kei_adapter.get('blocked', [])
                      entry['affectedSourceCount'] = len(blocked)
                      entry['blockingSourceCount'] = len(blocked)
                  else:
                      entry['sourceStatus'] = []
                      entry['affectedSourceCount'] = 0
                      entry['blockingSourceCount'] = 0

              if provider == 'gekkoushi' and gek_report:
                  entry['overlayConflicts'] = gek_report.get('conflicts', [])
                  entry['overlayConflictDetails'] = gek_report.get('conflictDetails', [])
                  entry['protectedOverlayTargets'] = gek_report.get('protectedTargets', [])
                  if gek_report.get('conflicts') and entry.get('state') == 'promoted':
                      entry['state'] = 'promoted-with-held-sources'
                      entry['heldSourceReason'] = 'protected-miyorare-overlay-diverged-from-upstream'

              result['providers'][provider] = entry

          Path('upstream/status.json.tmp').write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          PY

          python3 tools/source_pack_outcome.py \
            --status upstream/status.json.tmp \
            --output upstream/outcome.json.tmp || OUTCOME_RC=$?
          OUTCOME_RC="${OUTCOME_RC:-0}"

          python3 - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path('upstream/status.json.tmp').read_text(encoding='utf-8'))
          outcome = json.loads(Path('upstream/outcome.json.tmp').read_text(encoding='utf-8'))
          if status.get('workflowRunId') != outcome.get('workflowRunId'):
              raise SystemExit('status/outcome workflowRunId mismatch')
          if outcome.get('outcome') not in {'PASS', 'HELD', 'FAIL'}:
              raise SystemExit('invalid Source Pack outcome')
          Path('upstream/status.json').write_text(
              Path('upstream/status.json.tmp').read_text(encoding='utf-8'), encoding='utf-8'
          )
          Path('upstream/outcome.json').write_text(
              Path('upstream/outcome.json.tmp').read_text(encoding='utf-8'), encoding='utf-8'
          )
          print(outcome['outcome'])
          PY

          OUTCOME="$(python3 -c 'import json; print(json.load(open("upstream/outcome.json"))["outcome"])')"
          echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
          if [[ "$OUTCOME" == "FAIL" && "$OUTCOME_RC" -eq 0 ]]; then
            echo "::error::FAIL outcome must make the classifier return non-zero."
            exit 1
          fi
          if [[ "$OUTCOME" != "FAIL" && "$OUTCOME_RC" -ne 0 ]]; then
            echo "::error::Non-FAIL outcome returned non-zero."
            exit 1
          fi

      - name: Write readable Actions summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          status = json.loads(Path('upstream/status.json').read_text(encoding='utf-8'))
          outcome = json.loads(Path('upstream/outcome.json').read_text(encoding='utf-8'))
          summary_path = Path(os.environ['GITHUB_STEP_SUMMARY'])

          labels = {
              'synced': ('🟢', 'SYNCED', 'Tidak ada update baru. Versi aktif tetap aman.'),
              'promoted': ('🔵', 'UPDATED', 'Kandidat lolos dan siap masuk melalui PR.'),
              'held': ('🟠', 'HELD', 'Kandidat baru ditahan. Last-known-good tetap dipakai.'),
              'promoted-with-held-sources': ('🟠', 'PARTIAL', 'Provider lolos, tetapi source tertentu tetap ditahan.'),
              'waiting-approval': ('🟡', 'READY', 'Sudah lolos pemeriksaan dan menunggu approval.'),
              'broken': ('🔴', 'FAIL', 'Pipeline/active state gagal dan release diblokir.'),
              'unknown': ('⚪', 'UNKNOWN', 'Status belum dapat dipastikan.'),
          }

          lines = [
              '# Miyorare Source Sync Result',
              '',
              f"**Outcome: {outcome['outcome']}**",
              f"Active last-known-good set safe: `{str(outcome['activeSetSafe']).lower()}`",
              f"Upstream workflow run: `{status['workflowRunId']}`",
              '',
              '| Provider | Status | Hasil |',
              '|---|---|---|',
          ]

          held = []
          failed = []
          promoted = []
          for provider in ('keiyoushi', 'uma', 'gekkoushi'):
              info = status.get('providers', {}).get(provider, {})
              state = info.get('state', 'unknown')
              icon, label, message = labels.get(state, labels['unknown'])
              lines.append(f'| {provider.capitalize()} | {icon} **{label}** | {message} |')
              if state in ('held', 'promoted-with-held-sources', 'waiting-approval'):
                  held.append((provider, info))
              elif state in ('broken', 'failed', 'unknown'):
                  failed.append((provider, info))
              if state == 'promoted':
                  promoted.append(provider)

          lines.extend(['', '## Kesimpulan'])
          if failed:
              lines.append('❌ **FAIL** — terjadi kegagalan pipeline/active-state. Kandidat tidak dipublish.')
          elif held:
              lines.append('⚠️ **HELD** — kandidat tidak aman untuk dipromosikan. Last-known-good tetap aktif; ini bukan production failure.')
          elif promoted:
              lines.append('✅ **PASS** — kandidat yang lolos sudah disiapkan pada automation PR.')
          else:
              lines.append('✅ **PASS** — semua provider aman dan tidak ada update yang perlu dipromosikan.')

          if held:
              lines.extend(['', '## Yang ditahan'])
              for provider, info in held:
                  reason = info.get('reason') or info.get('heldSourceReason') or 'validation-safety-check'
                  lines.append(f'### {provider.capitalize()}')
                  lines.append(f'- Alasan: `{reason}`')
                  lines.append(f'- Last-known-good: `{info.get("lastKnownGood", "unknown")}`')
                  candidate = info.get('candidate')
                  if candidate:
                      lines.append(f'- Kandidat: `{candidate}`')
                  blocking = [item for item in info.get('sourceStatus', []) if item.get('state') not in (None, 'unaffected')]
                  if blocking:
                      lines.append('- Source terdampak:')
                      for item in blocking:
                          name = item.get('sourceName') or item.get('canonicalId') or 'unknown'
                          detail = (
                              ', '.join(item.get('changeClasses', []))
                              or item.get('reason')
                              or item.get('action')
                              or 'validation hold'
                          )
                          lines.append(f'  - **{name}** — {detail}')
                  overlay_conflicts = info.get('overlayConflicts', [])
                  if overlay_conflicts:
                      lines.append('- Protected overlay targets:')
                      for target in overlay_conflicts:
                          lines.append(f'  - `{target}`')

          if failed:
              lines.extend(['', '## Kegagalan'])
              for provider, info in failed:
                  lines.append(f"- **{provider.capitalize()}** — `{info.get('reason', 'pipeline-failure')}`")
                  jobs = info.get('failedJobs', [])
                  if jobs:
                      lines.append(f"  - Jobs: {', '.join(jobs)}")

          summary_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          for provider, info in held:
              count = info.get('blockingSourceCount') or len(info.get('sourceStatus', []))
              reason = info.get('reason', 'candidate-held')
              print(f'::warning title={provider.capitalize()} candidate HELD::{reason}; affected={count}; last-known-good remains active.')
          PY

      - name: Commit atomic proposal on automation branch
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          rm -f upstream/status.json.tmp upstream/outcome.json.tmp
          git fetch origin "$HEAD_BRANCH"

          registry_changed=false
          if ! git diff --quiet -- upstream/registry.json; then
            registry_changed=true
          fi

          semantic_changed="$(python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def load_base(path):
              raw = subprocess.check_output(
                  ['git', 'show', f'origin/{os.environ["HEAD_BRANCH"]}:{path}'],
                  text=True,
              )
              return json.loads(raw)

          def normalize(value):
              if isinstance(value, dict):
                  return {
                      key: normalize(item)
                      for key, item in value.items()
                      if key != 'workflowRunId'
                  }
              if isinstance(value, list):
                  return [normalize(item) for item in value]
              return value

          current_status = json.loads(Path('upstream/status.json').read_text(encoding='utf-8'))
          current_outcome = json.loads(Path('upstream/outcome.json').read_text(encoding='utf-8'))
          base_status = load_base('upstream/status.json')
          base_outcome = load_base('upstream/outcome.json')
          changed = (
              normalize(current_status) != normalize(base_status)
              or normalize(current_outcome) != normalize(base_outcome)
          )
          print('true' if changed else 'false')
          PY
          )"

          if [[ "$registry_changed" != "true" && "$semantic_changed" != "true" ]]; then
            echo 'No semantic Source Pack state change; no automation PR is needed.'
            stale_pr="$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base "$HEAD_BRANCH" \
              --head "$AUTOMATION_BRANCH" \
              --json number \
              --jq '.[0].number // empty')"
            if [[ -n "$stale_pr" ]]; then
              gh pr close "$stale_pr" \
                --repo "$GITHUB_REPOSITORY" \
                --comment "Superseded automatically: the latest upstream sync has no semantic change versus ${HEAD_BRANCH}."
            fi
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add upstream/registry.json upstream/status.json upstream/outcome.json
          if git diff --cached --quiet; then
            echo 'No staged Source Pack changes versus protected base.'
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Record Source Pack ${{ steps.classify.outputs.outcome }} proposal from sync run ${RUN_ID}"

          if git fetch origin "$AUTOMATION_BRANCH"; then
            remote_sha="$(git rev-parse FETCH_HEAD)"
            git push --force-with-lease="$AUTOMATION_BRANCH:$remote_sha" origin "HEAD:${AUTOMATION_BRANCH}"
          else
            git push origin "HEAD:${AUTOMATION_BRANCH}"
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Open or refresh automation pull request
        id: pr
        if: steps.persist.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          outcome='${{ steps.classify.outputs.outcome }}'
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          title="chore(upstream): Source Sync ${outcome}"
          body="$(cat <<EOF
          Automated Compatibility Farm update from upstream workflow run ${RUN_ID}.

          - Outcome: **${outcome}**
          - Base branch: \`${HEAD_BRANCH}\`
          - Automation branch: \`${AUTOMATION_BRANCH}\`
          - Evidence: ${run_url}
          - Delivery: pull request only; no protected-main bypass is required.

          This PR contains the validated registry advancement when applicable plus the matching atomic \`upstream/status.json\` and \`upstream/outcome.json\` state. New sync runs refresh this same PR instead of opening hourly duplicates.
          EOF
          )"

          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base "$HEAD_BRANCH" \
            --head "$AUTOMATION_BRANCH" \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$HEAD_BRANCH" \
              --head "$AUTOMATION_BRANCH" \
              --title "$title" \
              --body "$body")"
            pr_number="${pr_url##*/}"
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "Automation PR: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${pr_number}"

      - name: Dispatch contract CI for automation PR head
        if: steps.persist.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run source-pack-contract.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$AUTOMATION_BRANCH"

      - name: Fail only for genuine FAIL state
        if: steps.classify.outputs.outcome == 'FAIL'
        shell: bash
        run: |
          echo "::error::Source Pack pipeline/active state is FAIL."
          exit 1
