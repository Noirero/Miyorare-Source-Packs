name: Persist Upstream Sync Status

on:
  workflow_run:
    workflows:
      - Miyorare Upstream Sync
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: miyorare-upstream-status-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  persist:
    name: Persist promoted and held provider status
    if: github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Checkout workflow branch after promotion
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_BRANCH }}
          fetch-depth: 0

      - name: Download immutable sync plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _sync-plan
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name upstream-sync-plan --dir _sync-plan
          test -f _sync-plan/sync-plan.json

      - name: Resolve final provider status
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs > _sync-plan/jobs.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path('_sync-plan/sync-plan.json').read_text(encoding='utf-8'))
          jobs = json.loads(Path('_sync-plan/jobs.json').read_text(encoding='utf-8')).get('jobs', [])
          registry_path = Path('upstream/registry.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))

          conclusions = {job.get('name', ''): job.get('conclusion') for job in jobs}

          def find(prefix):
              values = [value for name, value in conclusions.items() if name.startswith(prefix)]
              if not values:
                  return None
              if any(value == 'failure' for value in values):
                  return 'failure'
              if any(value == 'cancelled' for value in values):
                  return 'cancelled'
              if all(value in ('success', 'skipped') for value in values):
                  return 'success'
              return values[0]

          result = {'schema': 1, 'workflowRunId': int(__import__('os').environ['RUN_ID']), 'providers': {}}
          for provider, candidate_info in plan['providers'].items():
              current = registry['providers'][provider]['lastKnownGood']
              candidate = candidate_info['candidate']
              changed = bool(candidate_info['changed'])

              if not changed:
                  result['providers'][provider] = {
                      'state': 'synced',
                      'lastKnownGood': current,
                  }
                  continue

              if candidate == current:
                  result['providers'][provider] = {
                      'state': 'promoted',
                      'candidate': candidate,
                      'lastKnownGood': current,
                  }
                  continue

              if provider == 'gekkoushi':
                  guard = find('Guard Miyorare Gekkoushi overlays')
                  validation = find('Validate Gekkoushi ')
                  if guard not in (None, 'success', 'skipped'):
                      reason = 'protected-overlay-conflict'
                  elif validation not in (None, 'success', 'skipped'):
                      reason = 'compatibility-or-build-validation-failure'
                  else:
                      reason = 'integration-or-promotion-failure'
              elif provider == 'keiyoushi':
                  validation = find('Validate Keiyoushi candidate')
                  reason = 'compatibility-validation-failure' if validation not in (None, 'success', 'skipped') else 'integration-or-promotion-failure'
              else:
                  validation = find('Validate UMA ')
                  reason = 'compatibility-or-build-validation-failure' if validation not in (None, 'success', 'skipped') else 'integration-or-promotion-failure'

              result['providers'][provider] = {
                  'state': 'held',
                  'candidate': candidate,
                  'lastKnownGood': current,
                  'reason': reason,
              }

          Path('upstream/status.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit status even when every candidate is held
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- upstream/status.json; then
            echo 'No status change to persist.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add upstream/status.json
          git commit -m "Record upstream sync held/promoted status"
          git push origin "HEAD:${HEAD_BRANCH}"
