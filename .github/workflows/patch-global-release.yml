name: Patch Global release workflow

on:
  push:
    branches:
      - fix-global-rawdex-release-duplicate
    paths:
      - .github/workflows/patch-global-release.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix-global-rawdex-release-duplicate
          fetch-depth: 0

      - name: Apply minimal release workflow repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/release-source-packs.yml')
          text = path.read_text(encoding='utf-8')

          old_overlay = """          root = Path('miyorare/extensions/miyorare-sources/overlays/gekkoushi/all')
          if not root.is_dir():
              raise SystemExit(0)
          for file in root.rglob('*.kt'):
"""
          new_overlay = """          root = Path('miyorare/extensions/miyorare-sources/overlays/gekkoushi/all')
          if not root.is_dir():
              raise SystemExit(0)

          # RawDEX moved from the pinned legacy Madara implementation to the
          # Miyorare-owned Global overlay. Remove only the legacy copy from
          # this disposable release checkout so the runtime identity is unique.
          legacy_rawdex = Path('_upstream/gekkoushi/src/main/kotlin/tsuki/site/madara/ko/RawDex.kt')
          if legacy_rawdex.exists():
              legacy_rawdex.unlink()
              print(f'removed legacy Global RawDEX parser: {legacy_rawdex}')

          for file in root.rglob('*.kt'):
"""
          if text.count(old_overlay) != 1:
              raise SystemExit('expected exactly one Global overlay insertion point')
          text = text.replace(old_overlay, new_overlay, 1)

          old_contract = """          assert data['sourceNames'] == ['EXHENTAI', 'GELBOORU'], data['sourceNames']
          assert data['sourceCount'] == 2, data['sourceCount']
"""
          new_contract = """          assert data['sourceNames'] == ['EXHENTAI', 'GELBOORU', 'RAWDEX', 'NEWXTOON'], data['sourceNames']
          assert data['sourceCount'] == 4, data['sourceCount']
"""
          if text.count(old_contract) != 1:
              raise SystemExit('expected exactly one stale Global source contract')
          text = text.replace(old_contract, new_contract, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/patch-global-release.yml
          git diff --check
          git diff -- .github/workflows/release-source-packs.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/release-source-packs.yml
          git commit -m "fix: align Global release with RawDEX and New XTOON"
          git push origin HEAD:fix-global-rawdex-release-duplicate
