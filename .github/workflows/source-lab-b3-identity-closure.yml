name: Source Lab B3 Identity Closure
run-name: Source Lab B3 Identity Closure

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/source-lab-b3-identity-closure.yml'
      - 'tools/source_lab_b3_identity_closure.py'
      - 'tests/test_source_lab_b3_identity_closure.py'
      - 'compatibility/evidence/track-b-batch3-identity-closure.json'
      - 'compatibility/evidence/track-b-batch3-runtime-boundary.json'
      - 'compatibility/evidence/track-b-batch3-upstream-disposition.json'
      - 'compatibility/evidence/track-b-batch3-live-runtime-access.json'
      - 'tools/source_lab_b3_reconciliation.py'
      - 'tools/source_lab_b3_runtime_closure.py'

permissions:
  contents: read

concurrency:
  group: source-lab-b3-identity-closure-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  EXPECTED_OWNER_ID: '149634319'
  FARM_REGISTRY_COMMIT: '85c6a874ed64f6b7af470b28dc6e42963f64d462'
  FARM_REGISTRY_BLOB: '98bf322a52a6e0994bfc2504a3df1fc0467a38b4'
  KEI_CURRENT: '314a0d1b2b6b194f6a4f9aee252fec9ce55ae5ca'
  REMOVE_DOWN_COMMIT: 'c691d6e2851741b28771ae9bf2f21ce4553fb4bb'
  REMOVE_DOWN_PARENT: '1e6826c06e311bc7451b91a0eac6a66187120c2f'
  REMOVE_DEAD_COMMIT: '6023a875f30c5f4d4049c997b47fcf347b87808c'
  REMOVE_DEAD_PARENT: 'fbd03511dd813afedfe1cd0c2d990a7f4fe8eebb'
  CMANHUA_COMMIT: '05c19676fd9870109557536d6e8646dd4a96bba0'
  CMANHUA_PARENT: 'f20c2b02cd478bbb3f77010961ca22d7f22f4f63'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  identity-closure:
    name: Close B3 identity-only rows without authority mutation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Validate safe execution context
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "Noirero/Miyorare-Source-Packs" ]]
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              [[ "$PR_HEAD_REPO" == "$GITHUB_REPOSITORY" ]] || {
                echo "::error::B3 identity closure accepts same-repository PRs only"
                exit 1
              }
              ;;
            workflow_dispatch)
              [[ "$GITHUB_ACTOR_ID" == "$EXPECTED_OWNER_ID" ]]
              [[ "$GITHUB_REF_NAME" == "main" ]]
              ;;
            *) echo "::error::unexpected event: $GITHUB_EVENT_NAME"; exit 1 ;;
          esac

      - name: Checkout proposed identity closure
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: control
          fetch-depth: 1

      - name: Checkout exact Compatibility Farm registry
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.FARM_REGISTRY_COMMIT }}
          path: farm
          fetch-depth: 1

      - name: Checkout Keiyoushi before Remove down
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: keiyoushi/extensions-source
          ref: ${{ env.REMOVE_DOWN_PARENT }}
          path: kei-down-before
          fetch-depth: 1

      - name: Checkout Keiyoushi Remove down commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: keiyoushi/extensions-source
          ref: ${{ env.REMOVE_DOWN_COMMIT }}
          path: kei-down-after
          fetch-depth: 1

      - name: Checkout Keiyoushi before dead-source removal
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: keiyoushi/extensions-source
          ref: ${{ env.REMOVE_DEAD_PARENT }}
          path: kei-dead-before
          fetch-depth: 1

      - name: Checkout Keiyoushi dead-source removal
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: keiyoushi/extensions-source
          ref: ${{ env.REMOVE_DEAD_COMMIT }}
          path: kei-dead-after
          fetch-depth: 1

      - name: Checkout Keiyoushi before CManhua migration
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: keiyoushi/extensions-source
          ref: ${{ env.CMANHUA_PARENT }}
          path: kei-cmanhua-before
          fetch-depth: 1

      - name: Checkout Keiyoushi CManhua migration
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: keiyoushi/extensions-source
          ref: ${{ env.CMANHUA_COMMIT }}
          path: kei-cmanhua-after
          fetch-depth: 1

      - name: Checkout current Keiyoushi reference head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: keiyoushi/extensions-source
          ref: ${{ env.KEI_CURRENT }}
          path: kei-current
          fetch-depth: 1

      - name: Verify exact Farm identities and upstream transitions
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C farm hash-object compatibility/source-registry.json)" == "$FARM_REGISTRY_BLOB" ]]
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          evidence = json.loads(Path('control/compatibility/evidence/track-b-batch3-identity-closure.json').read_text())
          registry = json.loads(Path('farm/compatibility/source-registry.json').read_text())
          by_id = {row['canonicalId']: row for row in registry['sources']}

          src = evidence['source']
          expected_source = {
              'farmRegistryCommit': os.environ['FARM_REGISTRY_COMMIT'],
              'farmRegistryBlob': os.environ['FARM_REGISTRY_BLOB'],
              'keiyoushiCurrentHead': os.environ['KEI_CURRENT'],
              'removeDownCommit': os.environ['REMOVE_DOWN_COMMIT'],
              'removeDownParent': os.environ['REMOVE_DOWN_PARENT'],
              'removeDeadCommit': os.environ['REMOVE_DEAD_COMMIT'],
              'removeDeadParent': os.environ['REMOVE_DEAD_PARENT'],
              'cmanhuaMigrationCommit': os.environ['CMANHUA_COMMIT'],
              'cmanhuaMigrationParent': os.environ['CMANHUA_PARENT'],
          }
          assert src == expected_source
          assert evidence['schemaVersion'] == 1
          assert evidence['phase'] == 'TRACK_B_BATCH_3_IDENTITY_CLOSURE_EVIDENCE'
          assert evidence['readOnly'] is True
          assert len(evidence['entries']) == 9

          def commit_message(repo):
              return subprocess.check_output(
                  ['git', '-C', repo, 'log', '-1', '--pretty=%B'], text=True,
              )

          roots = {
              os.environ['REMOVE_DOWN_COMMIT']: ('kei-down-before', 'kei-down-after'),
              os.environ['REMOVE_DEAD_COMMIT']: ('kei-dead-before', 'kei-dead-after'),
          }

          for entry in evidence['entries']:
              cid = entry['canonicalId']
              farm = entry['farmIdentity']
              original = by_id[cid]
              assert original['providers'] == ['keiyoushi'], (cid, original['providers'])
              upstream = original['upstreamIdentities']['keiyoushi']
              assert upstream['module'] == farm['module']
              assert upstream['sourceId'] == farm['sourceId']
              assert upstream['sourceName'] == farm['sourceName']

              proof = entry['proof']
              if entry['disposition'] == 'UPSTREAM_DEAD_REMOVAL':
                  before, after = roots[proof['commit']]
                  module = farm['module']
                  before_path = Path(before) / module
                  after_path = Path(after) / module
                  current_path = Path('kei-current') / module
                  assert before_path.is_dir(), (cid, 'missing before removal')
                  assert not after_path.exists(), (cid, 'still present after removal')
                  assert not current_path.exists(), (cid, 'reappeared at current head')
                  build = (before_path / 'build.gradle.kts').read_text()
                  assert farm['baseUrl'] in build, (cid, farm['baseUrl'])
                  assert proof['commitMessageMarker'] in commit_message(after)
              elif entry['disposition'] == 'LOCALE_MIGRATION_CONFIRMED':
                  assert cid == 'miyorare:inventory-en:CMANHUA'
                  assert (Path('kei-cmanhua-before') / farm['module']).is_dir()
                  assert not (Path('kei-cmanhua-after') / farm['module']).exists()
                  target = Path('kei-cmanhua-after') / proof['targetModule']
                  current_target = Path('kei-current') / proof['targetModule']
                  assert target.is_dir()
                  assert current_target.is_dir()
                  build = (current_target / 'build.gradle.kts').read_text()
                  assert 'name = "CManhua"' in build
                  assert 'pkgName = "en.cmanhua"' in build
                  assert 'lang = "zh"' in build
                  assert 'baseUrl = "https://cmanhua.com"' in build
                  assert proof['commitMessageMarker'] in commit_message('kei-cmanhua-after')
              else:
                  raise AssertionError(entry['disposition'])
          PY

      - name: Compile and run identity-closure regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              'tools/source_lab_b3_reconciliation.py',
              'tools/source_lab_b3_runtime_closure.py',
              'tools/source_lab_b3_identity_closure.py',
              'tests/test_source_lab_b3_reconciliation.py',
              'tests/test_source_lab_b3_runtime_closure.py',
              'tests/test_source_lab_b3_identity_closure.py',
          ):
              path = Path('control') / name
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY
          PYTHONPATH=control/tools python3 -m unittest \
            control/tests/test_source_lab_b3_reconciliation.py \
            control/tests/test_source_lab_b3_runtime_closure.py \
            control/tests/test_source_lab_b3_identity_closure.py

      - name: Build final read-only Batch 3 closure report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          PYTHONPATH=control/tools python3 control/tools/source_lab_b3_identity_closure.py \
            --boundary control/compatibility/evidence/track-b-batch3-runtime-boundary.json \
            --upstream-evidence control/compatibility/evidence/track-b-batch3-upstream-disposition.json \
            --live-access-evidence control/compatibility/evidence/track-b-batch3-live-runtime-access.json \
            --identity-evidence control/compatibility/evidence/track-b-batch3-identity-closure.json \
            --output build/track-b-batch3-identity-closure.json \
            --markdown-output build/track-b-batch3-identity-closure.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('build/track-b-batch3-identity-closure.json').read_text())
          assert data['schemaVersion'] == 1
          assert data['phase'] == 'TRACK_B_BATCH_3_IDENTITY_CLOSURE'
          assert data['readOnly'] is True
          assert data['summary']['rows'] == 33
          assert data['summary']['newlyClosedPrimaryMissingRows'] == 8
          assert data['summary']['evidenceBackedRows'] == 33
          assert data['summary']['routes'] == {
              'LIVE_ACCESS_BLOCKED': 8,
              'LIVE_DOMAIN_DISPOSITION': 1,
              'PROVEN_UPSTREAM_DEAD': 23,
              'PROVEN_UPSTREAM_MIGRATION': 1,
          }
          assert data['safety'] == {
              'approvesOverlay': False,
              'mutatesAuthority': False,
              'mutatesCanonicalIds': False,
              'mutatesLastKnownGood': False,
              'mutatesRetryHeld': False,
              'promotesProvider': False,
          }
          PY

      - name: Prove control checkout was not mutated
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C control status --porcelain)"

      - name: Upload B3 identity closure evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-b-batch3-identity-closure-${{ github.run_id }}
          path: |
            build/track-b-batch3-identity-closure.json
            build/track-b-batch3-identity-closure.md
          if-no-files-found: error
          retention-days: 14
