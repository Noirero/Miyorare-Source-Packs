name: Source Lab Control Plane CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/source-lab-*.yml'
      - '.github/workflows/release-source-packs.yml'
      - 'tools/approval_state.py'
      - 'tools/authorized_promotion.py'
      - 'tools/candidate_lifecycle.py'
      - 'tools/candidate_registry.py'
      - 'tools/approval_evidence.py'
      - 'tools/source_inventory_bulk_enroll.py'
      - 'tools/source_pending_worker.py'
      - 'tools/source_live_parser_harness.py'
      - 'tools/source_pending_approval.py'
      - 'tests/**'
  push:
    branches:
      - 'source-lab-owner-control-plane-*'
      - 'source-lab-auto-enroll-*'
      - 'source-lab-autonomous-pending-*'
      - 'source-lab-real-parser-*'
      - 'source-lab-one-click-*'
    paths:
      - '.github/workflows/source-lab-*.yml'
      - 'tools/source_inventory_bulk_enroll.py'
      - 'tools/source_pending_worker.py'
      - 'tools/source_live_parser_harness.py'
      - 'tools/source_pending_approval.py'
      - 'tests/test_source_inventory_bulk_enroll.py'
      - 'tests/test_source_pending_worker.py'
      - 'tests/test_source_live_parser_harness.py'
      - 'tests/test_source_pending_approval.py'

permissions:
  contents: read

jobs:
  validate:
    name: Validate fail-closed owner control plane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout proposed control plane
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Parse Source Lab workflow YAML
        shell: ruby {0}
        run: |
          require 'yaml'
          Dir['.github/workflows/source-lab-*.yml'].sort.each do |path|
            YAML.load_file(path, aliases: true)
            puts "parsed #{path}"
          end

      - name: Verify complete capability and action surface
        shell: python {0}
        run: |
          from pathlib import Path

          required = {
              'source-lab-run-farm.yml': ['149634319', 'compatibility-farm-foundation', 'source-lab-candidate-farm.yml'],
              'source-lab-candidate-farm.yml': [
                  'candidate-source-registry.json',
                  'parser_family_plan.py',
                  'validate',
                  'candidate-family-plan-validation.json',
              ],
              'source-lab-approve-candidate.yml': ['WAITING_FOR_APPROVAL', 'approval_state.py approve', 'source-lab-approval-'],
              'source-lab-promote-candidate.yml': ['authorized_promotion.py', 'approval_run_id', 'compatibility-farm-foundation'],
              'source-lab-sign-candidate.yml': ['actions/attest-build-provenance@v2', 'GITHUB_ARTIFACT_ATTESTATION'],
              'source-lab-publish-candidate.yml': ['gh attestation verify', 'release-source-packs.yml', 'compatibility-farm-foundation'],
              'source-lab-add-to-farm.yml': [
                  '149634319',
                  'source-inventory-live',
                  'compatibility-farm-foundation',
                  'inventory_commit',
                  'foundation_commit',
                  'needsAttention',
                  'compatibilityEnrollment',
                  "'state': 'PENDING'",
                  "'parserCoverageRequired': False",
                  '--force-with-lease',
              ],
              'source-lab-sync-farm-membership.yml': [
                  '149634319',
                  'source-inventory-live',
                  'compatibility-farm-foundation',
                  'source_inventory_bulk_enroll.py',
                  'parser_family_plan.py',
                  'git push origin HEAD:compatibility-farm-foundation',
              ],
              'source-lab-pending-worker.yml': [
                  '149634319',
                  'compatibility-farm-foundation',
                  'source_pending_worker.py',
                  'source_live_parser_harness.py',
                  'SourceFactoryShim.kt',
                  'pending-worker-state.json',
                  'buildJar --no-daemon',
                  'compileDebugKotlin',
                  'testDebugUnitTest',
                  'libs.tachiyomi.lib.v14',
                  'libs.tachiyomi.lib.v16',
                  'compatibility-farm-test-resources',
                  'live-parser-results.json',
                  'finalize',
                  '--fail-threshold 3',
                  'discarding stale batch state',
              ],
              'source-lab-approve-ready-sources.yml': [
                  '149634319',
                  'source_pending_approval.py',
                  'pending-worker-state.json',
                  'compatibility/source-registry.json',
                  'compatibility-farm-foundation',
                  'source-onboarding-approval-plan.json',
                  'last-source-onboarding-approval.json',
                  'refusing stale write',
              ],
          }
          root = Path('.github/workflows')
          for name, needles in required.items():
              text = (root / name).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{name} missing required fail-closed marker: {needle}')

          worker = Path('tools/source_pending_worker.py').read_text(encoding='utf-8')
          for marker in (
              'PARSER_PENDING',
              'READY_FOR_APPROVAL',
              'REAL_PARSER_PASS',
              'REAL_PARSER_BLOCKED',
              'NEEDS_ATTENTION',
              'WAITING_FOR_APPROVAL',
              'ownerActionRequired',
              'publishEligible',
              'compatibilityEnrollment',
              'PENDING',
              'DOMAIN_CONFIG_RE',
              'PARSER_HOST_RE',
              'upstream-declared-broken',
              'retrySlots',
              'retry_budget',
              'AUTOMATION_INFRASTRUCTURE',
              'attemptConsumed',
              'failureType',
              'failureMessage',
          ):
              if marker not in worker:
                  raise SystemExit(f'source_pending_worker.py missing state contract marker: {marker}')

          approval = Path('tools/source_pending_approval.py').read_text(encoding='utf-8')
          for marker in (
              'READY_FOR_APPROVAL',
              'REAL_PARSER_PASS',
              'testedVersions',
              '"state": "ACTIVE"',
              '"state": APPROVED',
              'parserCoverageRequired',
              'evidence digest mismatch',
              'provider baseline moved after test',
          ):
              if marker not in approval:
                  raise SystemExit(f'source_pending_approval.py missing approval contract marker: {marker}')

          harness = Path('tools/source_live_parser_harness.py').read_text(encoding='utf-8')
          for marker in (
              'real-live-parser',
              'LiveMangaLoaderContext',
              'parser.getList',
              'parser.getDetails',
              'parser.getPages',
              'popularMangaRequest',
              'mangaDetailsRequest',
              'chapterListRequest',
              'pageListRequest',
              'AUTH_REQUIRED',
              'keiyoushi.source.KeiSource',
              'createSources',
              'actual.getPopularManga(1)',
              'actual.fetchMangaUpdate',
              'actual.getPageList',
              'failureType',
              'failureMessage',
          ):
              if marker not in harness:
                  raise SystemExit(f'source_live_parser_harness.py missing real-parser marker: {marker}')

          auth = (root / 'source-lab-backend-authorization.yml').read_text(encoding='utf-8')
          for capability in ('RUN_FARM', 'APPROVE', 'PROMOTE', 'SIGN', 'PUBLISH', 'ADD_TO_FARM'):
              if capability not in auth:
                  raise SystemExit(f'backend authorization missing capability {capability}')
          if 'optionalCapabilities' not in auth:
              raise SystemExit('new capabilities must remain backward-compatible through optionalCapabilities')
          if 'APPROVE_READY_SOURCES' not in auth:
              raise SystemExit('backend authorization must advertise APPROVE_READY_SOURCES')

          forbidden = ('SOURCE_LAB_KEYSTORE_BASE64', 'SOURCE_LAB_STORE_PASSWORD', 'SOURCE_LAB_KEY_PASSWORD')
          action_text = '\n'.join((root / name).read_text(encoding='utf-8') for name in required)
          for secret in forbidden:
              if secret in action_text:
                  raise SystemExit(f'control-plane workflow must not consume APK signing secret: {secret}')

      - name: Verify Compatibility Farm lifecycle dependencies exist
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin compatibility-farm-foundation
          for path in \
            tools/approval_state.py \
            tools/authorized_promotion.py \
            tools/candidate_lifecycle.py \
            tools/candidate_registry.py \
            tools/approval_evidence.py \
            tools/parser_family_plan.py; do
            git cat-file -e "origin/compatibility-farm-foundation:$path"
          done

      - name: Compile lifecycle helpers from authoritative foundation
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/foundation"
          git worktree add --detach "$work" origin/compatibility-farm-foundation
          python3 -m py_compile \
            "$work/tools/approval_state.py" \
            "$work/tools/authorized_promotion.py" \
            "$work/tools/candidate_lifecycle.py" \
            "$work/tools/candidate_registry.py" \
            "$work/tools/approval_evidence.py" \
            "$work/tools/parser_family_plan.py"

      - name: Test ID and EN bulk enrollment engine
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/source_inventory_bulk_enroll.py
          python3 tests/test_source_inventory_bulk_enroll.py

      - name: Test autonomous PENDING queue worker and parser gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/source_pending_worker.py tools/source_live_parser_harness.py
          python3 tests/test_source_pending_worker.py
          python3 tests/test_source_live_parser_harness.py

      - name: Test one-click source onboarding approval
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/source_pending_approval.py
          python3 tests/test_source_pending_approval.py
