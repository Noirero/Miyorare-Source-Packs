name: Source Lab B2 Capability Health Decision
run-name: Source Lab B2 Capability Health Decision

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/source-lab-b2-capability-health.yml'
      - 'tools/source_lab_b2_capability_health.py'
      - 'tests/test_source_lab_b2_capability_health.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: source-lab-b2-capability-health-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  EXPECTED_OWNER_ID: '149634319'
  B1_INVENTORY_SHA: '55f291a2a53f3dee4db41078766d9a18acff8a31'
  B1_FOUNDATION_SHA: '7a69b02865a3dd494326c367024aededd81e9a69'
  B1_MIYORARE_SHA: '4fb61632f43af55b22e24b168717d495f0926f81'
  B1_STRUCTURAL_COHORT_SIZE: '38'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  decision:
    name: Build read-only EN capability and health decision matrix
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Validate safe execution context
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "Noirero/Miyorare-Source-Packs" ]]
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              [[ "$PR_HEAD_REPO" == "$GITHUB_REPOSITORY" ]] || {
                echo "::error::B2 only accepts same-repository pull requests"
                exit 1
              }
              ;;
            workflow_dispatch)
              [[ "$GITHUB_ACTOR_ID" == "$EXPECTED_OWNER_ID" ]]
              [[ "$GITHUB_REF_NAME" == "main" ]]
              ;;
            *) echo "::error::unexpected event: $GITHUB_EVENT_NAME"; exit 1 ;;
          esac

      - name: Checkout proposed B2 control plane
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: control
          fetch-depth: 1

      - name: Checkout frozen Batch 1 informational inventory
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.B1_INVENTORY_SHA }}
          path: inventory
          fetch-depth: 1

      - name: Checkout frozen Batch 1 Compatibility Farm authority
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.B1_FOUNDATION_SHA }}
          path: farm
          fetch-depth: 1

      - name: Checkout frozen Batch 1 Miyorare aliases
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Noirero/Miyorare
          ref: ${{ env.B1_MIYORARE_SHA }}
          path: miyorare
          fetch-depth: 1

      - name: Prove frozen B1 provenance identity
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          control_sha="$(git -C control rev-parse HEAD)"
          inventory_sha="$(git -C inventory rev-parse HEAD)"
          foundation_sha="$(git -C farm rev-parse HEAD)"
          miyorare_sha="$(git -C miyorare rev-parse HEAD)"
          [[ "$inventory_sha" == "$B1_INVENTORY_SHA" ]]
          [[ "$foundation_sha" == "$B1_FOUNDATION_SHA" ]]
          [[ "$miyorare_sha" == "$B1_MIYORARE_SHA" ]]
          [[ "$control_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "control_sha=$control_sha" >> "$GITHUB_OUTPUT"
          echo "inventory_sha=$inventory_sha" >> "$GITHUB_OUTPUT"
          echo "foundation_sha=$foundation_sha" >> "$GITHUB_OUTPUT"
          echo "miyorare_sha=$miyorare_sha" >> "$GITHUB_OUTPUT"

      - name: Snapshot all read-only authority inputs
        id: before
        shell: bash
        run: |
          set -euo pipefail
          echo "source_registry=$(sha256sum farm/compatibility/source-registry.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "source_health=$(sha256sum farm/upstream/source-health.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "upstream_registry=$(sha256sum farm/upstream/registry.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "status=$(sha256sum farm/upstream/status.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "worker_state=$(sha256sum farm/automation/pending-worker-state.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "inventory=$(sha256sum inventory/inventory/source-inventory.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "aliases=$(sha256sum miyorare/extensions/miyorare-sources/multi-upstream.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Compile B1 and B2 auditors without filesystem mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              'tools/source_lab_b1_en_mapping.py',
              'tools/source_lab_b2_capability_health.py',
              'tests/test_source_lab_b2_capability_health.py',
          ):
              path = Path('control') / name
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY

      - name: Run B2 regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest control/tests/test_source_lab_b2_capability_health.py

      - name: Rebuild frozen Batch 1 cohort
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python3 control/tools/source_lab_b1_en_mapping.py \
            --inventory inventory/inventory/source-inventory.json \
            --farm-registry farm/compatibility/source-registry.json \
            --aliases miyorare/extensions/miyorare-sources/multi-upstream.json \
            --upstream-registry farm/upstream/registry.json \
            --status farm/upstream/status.json \
            --inventory-commit '${{ steps.pins.outputs.inventory_sha }}' \
            --foundation-commit '${{ steps.pins.outputs.foundation_sha }}' \
            --miyorare-commit '${{ steps.pins.outputs.miyorare_sha }}' \
            --output build/track-b-batch1-en-mapping.json \
            --markdown-output build/track-b-batch1-en-mapping.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('build/track-b-batch1-en-mapping.json').read_text(encoding='utf-8'))
          actual = report['summary']['structuralAttentionCount']
          expected = int('${{ env.B1_STRUCTURAL_COHORT_SIZE }}')
          if actual != expected:
              raise SystemExit(f'Frozen B1 cohort drifted: expected {expected}, got {actual}')
          PY

      - name: Build Batch 2 capability and health decision matrix
        id: b2
        shell: bash
        run: |
          set -euo pipefail
          python3 control/tools/source_lab_b2_capability_health.py \
            --b1-report build/track-b-batch1-en-mapping.json \
            --inventory inventory/inventory/source-inventory.json \
            --farm-registry farm/compatibility/source-registry.json \
            --source-health farm/upstream/source-health.json \
            --inventory-commit '${{ steps.pins.outputs.inventory_sha }}' \
            --foundation-commit '${{ steps.pins.outputs.foundation_sha }}' \
            --miyorare-commit '${{ steps.pins.outputs.miyorare_sha }}' \
            --control-commit '${{ steps.pins.outputs.control_sha }}' \
            --output build/track-b-batch2-capability-health.json \
            --markdown-output build/track-b-batch2-capability-health.md
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          report = json.loads(Path('build/track-b-batch2-capability-health.json').read_text(encoding='utf-8'))
          if report.get('status') != 'COMPLETE_WITH_DECISIONS' or report.get('readOnly') is not True:
              raise SystemExit('B2 decision matrix did not complete read-only')
          summary = report['summary']
          expected = int('${{ env.B1_STRUCTURAL_COHORT_SIZE }}')
          if summary['decisionRows'] != expected or summary['b1StructuralAttentionCount'] != expected:
              raise SystemExit('B2 does not cover the exact frozen 38-row B1 cohort')
          for key in ('decisionRows', 'batch3Rows', 'deferredTrackCRows', 'deferredTrackDRows'):
              print(f"{key}={summary[key]}")
          PY

      - name: Prove B2 did not mutate authority state
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(sha256sum farm/compatibility/source-registry.json | awk '{print $1}')" == "${{ steps.before.outputs.source_registry }}" ]]
          [[ "$(sha256sum farm/upstream/source-health.json | awk '{print $1}')" == "${{ steps.before.outputs.source_health }}" ]]
          [[ "$(sha256sum farm/upstream/registry.json | awk '{print $1}')" == "${{ steps.before.outputs.upstream_registry }}" ]]
          [[ "$(sha256sum farm/upstream/status.json | awk '{print $1}')" == "${{ steps.before.outputs.status }}" ]]
          [[ "$(sha256sum farm/automation/pending-worker-state.json | awk '{print $1}')" == "${{ steps.before.outputs.worker_state }}" ]]
          [[ "$(sha256sum inventory/inventory/source-inventory.json | awk '{print $1}')" == "${{ steps.before.outputs.inventory }}" ]]
          [[ "$(sha256sum miyorare/extensions/miyorare-sources/multi-upstream.json | awk '{print $1}')" == "${{ steps.before.outputs.aliases }}" ]]
          test -z "$(git -C control status --porcelain)"
          test -z "$(git -C inventory status --porcelain)"
          test -z "$(git -C farm status --porcelain)"
          test -z "$(git -C miyorare status --porcelain)"

      - name: Upload B2 decision evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-b-batch2-capability-health-${{ github.run_id }}
          path: |
            build/track-b-batch2-capability-health.json
            build/track-b-batch2-capability-health.md
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Track B — Batch 2: Capability & Health Decision'
            echo "Control: ${{ steps.pins.outputs.control_sha }}"
            echo "Frozen B1 inventory: ${{ steps.pins.outputs.inventory_sha }}"
            echo "Frozen B1 foundation: ${{ steps.pins.outputs.foundation_sha }}"
            echo "Frozen B1 Miyorare beta: ${{ steps.pins.outputs.miyorare_sha }}"
            echo "Decision rows: ${{ steps.b2.outputs.decisionRows }}"
            echo "Batch 3 rows: ${{ steps.b2.outputs.batch3Rows }}"
            echo "Track C deferred rows: ${{ steps.b2.outputs.deferredTrackCRows }}"
            echo "Track D deferred rows: ${{ steps.b2.outputs.deferredTrackDRows }}"
            echo ''
            cat build/track-b-batch2-capability-health.md
          } >> "$GITHUB_STEP_SUMMARY"
