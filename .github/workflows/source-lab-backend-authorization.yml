name: Source Lab Backend Authorization
run-name: Source Lab auth ${{ inputs.challenge }}

on:
  workflow_dispatch:
    inputs:
      challenge:
        description: Ephemeral challenge generated by Miyorare Source Lab
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: source-lab-auth-${{ inputs.challenge }}
  cancel-in-progress: false

jobs:
  authorize-owner:
    name: Authorize Source Lab owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed unless the exact owner dispatched this run
        shell: bash
        env:
          SOURCE_LAB_CHALLENGE: ${{ inputs.challenge }}
          EXPECTED_ACTOR_ID: "149634319"
          EXPECTED_REPOSITORY: "Noirero/Miyorare-Source-Packs"
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "Unexpected event: ${GITHUB_EVENT_NAME}" >&2
            exit 1
          fi

          if [[ "${GITHUB_ACTOR_ID}" != "${EXPECTED_ACTOR_ID}" ]]; then
            echo "Actor id is not authorized for Source Lab owner controls." >&2
            exit 1
          fi

          if [[ "${GITHUB_REPOSITORY}" != "${EXPECTED_REPOSITORY}" ]]; then
            echo "Repository mismatch." >&2
            exit 1
          fi

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Authorization proof must be minted from the default main branch." >&2
            exit 1
          fi

          if [[ ! "${SOURCE_LAB_CHALLENGE}" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Challenge must be exactly 32 random bytes encoded as lowercase hex." >&2
            exit 1
          fi

          mkdir -p build/source-lab-authz
          umask 077
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          # Keep the legacy capability array unchanged so already-installed
          # Source Lab versions remain able to parse schema v1. New capabilities
          # are advertised separately and are opt-in for newer clients.
          payload = {
              "schemaVersion": 1,
              "challenge": os.environ["SOURCE_LAB_CHALLENGE"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "actorId": os.environ["GITHUB_ACTOR_ID"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "ref": os.environ["GITHUB_REF"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "capabilities": [
                  "RUN_FARM",
                  "APPROVE",
                  "PROMOTE",
                  "SIGN",
                  "PUBLISH",
              ],
              "optionalCapabilities": [
                  "ADD_TO_FARM",
              ],
          }
          Path("build/source-lab-authz/metadata.json").write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          PY

      - name: Mint GitHub-signed OIDC proof
        uses: actions/github-script@v8
        env:
          SOURCE_LAB_CHALLENGE: ${{ inputs.challenge }}
        with:
          script: |
            const fs = require('fs')
            const audience = `miyorare-source-lab:${process.env.SOURCE_LAB_CHALLENGE}`
            const token = await core.getIDToken(audience)
            fs.writeFileSync('build/source-lab-authz/authorization.jwt', token, { mode: 0o600 })

      - name: Validate proof files before upload
        shell: bash
        run: |
          set -euo pipefail
          test -s build/source-lab-authz/authorization.jwt
          test -s build/source-lab-authz/metadata.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          jwt = Path("build/source-lab-authz/authorization.jwt").read_text(encoding="utf-8").strip()
          if len(jwt.split(".")) != 3:
              raise SystemExit("OIDC token is not a three-part JWT")

          metadata = json.loads(Path("build/source-lab-authz/metadata.json").read_text(encoding="utf-8"))
          if metadata.get("schemaVersion") != 1:
              raise SystemExit("metadata schema mismatch")
          if metadata["challenge"] != os.environ["SOURCE_LAB_CHALLENGE"]:
              raise SystemExit("metadata challenge mismatch")
          if metadata["runId"] != os.environ["GITHUB_RUN_ID"]:
              raise SystemExit("metadata run id mismatch")
          legacy = {"RUN_FARM", "APPROVE", "PROMOTE", "SIGN", "PUBLISH"}
          optional = {"ADD_TO_FARM"}
          if set(metadata.get("capabilities", [])) != legacy:
              raise SystemExit("legacy metadata capability set mismatch")
          if set(metadata.get("optionalCapabilities", [])) != optional:
              raise SystemExit("optional metadata capability set mismatch")
          PY
        env:
          SOURCE_LAB_CHALLENGE: ${{ inputs.challenge }}

      - name: Upload short-lived authorization proof
        id: upload-proof
        uses: actions/upload-artifact@v4
        with:
          name: source-lab-authorization-${{ inputs.challenge }}
          path: build/source-lab-authz/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Verify uploaded proof archive is Android-compatible
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload-proof.outputs.artifact-id }}
          SOURCE_LAB_CHALLENGE: ${{ inputs.challenge }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_ID:-}"
          ARCHIVE="$RUNNER_TEMP/source-lab-auth-proof.zip"

          downloaded=false
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              -o "$ARCHIVE"; then
              downloaded=true
              break
            fi
            sleep "$attempt"
          done
          if [ "$downloaded" != true ] || [ ! -s "$ARCHIVE" ]; then
            echo "Uploaded authorization artifact could not be downloaded for verification." >&2
            exit 1
          fi

          python3 - "$ARCHIVE" <<'PY'
          import json
          import os
          import sys
          import zipfile
          from pathlib import PurePosixPath

          archive_path = sys.argv[1]
          expected = {"authorization.jwt", "metadata.json"}
          with zipfile.ZipFile(archive_path) as archive:
              entries = {
                  PurePosixPath(info.filename).name: info
                  for info in archive.infolist()
                  if not info.is_dir()
              }
              missing = expected - set(entries)
              if missing:
                  raise SystemExit(f"artifact is missing required files: {sorted(missing)}")

              for name in expected:
                  if entries[name].compress_type != zipfile.ZIP_DEFLATED:
                      raise SystemExit(
                          f"{name} is not DEFLATED; Android ZipInputStream compatibility would regress"
                      )

              jwt = archive.read("authorization.jwt").decode("utf-8").strip()
              if len(jwt.split(".")) != 3:
                  raise SystemExit("artifact JWT is malformed")

              metadata = json.loads(archive.read("metadata.json").decode("utf-8"))
              if metadata.get("schemaVersion") != 1:
                  raise SystemExit("artifact metadata schema mismatch")
              if metadata.get("challenge") != os.environ["SOURCE_LAB_CHALLENGE"]:
                  raise SystemExit("artifact challenge mismatch")
              if metadata.get("runId") != os.environ["GITHUB_RUN_ID"]:
                  raise SystemExit("artifact run id mismatch")
              legacy = {"RUN_FARM", "APPROVE", "PROMOTE", "SIGN", "PUBLISH"}
              optional = {"ADD_TO_FARM"}
              if set(metadata.get("capabilities", [])) != legacy:
                  raise SystemExit("artifact legacy capability set mismatch")
              if set(metadata.get("optionalCapabilities", [])) != optional:
                  raise SystemExit("artifact optional capability set mismatch")

          print("Authorization artifact is complete, backward-compatible, and Android ZipInputStream compatible.")
          PY
