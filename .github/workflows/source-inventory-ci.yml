name: Source Inventory CI

on:
  push:
    branches:
      - 'source-inventory-*'
    paths:
      - 'tools/source_inventory.py'
      - 'tools/canonical_source_registry_v2.py'
      - 'governance/canonical-source-registry-v2.schema.json'
      - 'tests/test_p1a_canonical_source_registry_v2.py'
      - 'source-inventory-tests/**'
      - '.github/workflows/source-inventory-*.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/source_inventory.py'
      - 'tools/canonical_source_registry_v2.py'
      - 'governance/canonical-source-registry-v2.schema.json'
      - 'tests/test_p1a_canonical_source_registry_v2.py'
      - 'source-inventory-tests/**'
      - '.github/workflows/source-inventory-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate automatic source inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout proposed inventory engine
        uses: actions/checkout@v5
        with:
          path: source-packs

      - name: Checkout Miyorare canonical manifests
        uses: actions/checkout@v5
        with:
          repository: Noirero/Miyorare
          ref: beta
          path: miyorare
          fetch-depth: 1

      - name: Checkout Compatibility Farm membership
        uses: actions/checkout@v5
        with:
          ref: compatibility-farm-foundation
          path: farm
          fetch-depth: 1

      - name: Checkout Keiyoushi
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: main
          path: upstream-keiyoushi
          fetch-depth: 1

      - name: Checkout UMA
        uses: actions/checkout@v5
        with:
          repository: InvalidDavid/UMA
          ref: master
          path: upstream-uma
          fetch-depth: 1

      - name: Checkout Gekkoushi
        uses: actions/checkout@v5
        with:
          repository: Gekkoushi/plugin-source
          ref: master
          path: upstream-gekkoushi
          fetch-depth: 1

      - name: Run inventory and canonical registry unit tests
        working-directory: source-packs
        run: |
          python3 -m unittest discover -s source-inventory-tests -p 'test_*.py' -v
          python3 -m unittest tests.test_p1a_canonical_source_registry_v2 -v
          python3 -m py_compile tools/source_inventory.py tools/canonical_source_registry_v2.py

      - name: Build inventory from real upstream trees
        shell: bash
        run: |
          set -euo pipefail
          python3 source-packs/tools/source_inventory.py build \
            --keiyoushi-root upstream-keiyoushi \
            --uma-root upstream-uma \
            --gekkoushi-root upstream-gekkoushi \
            --aliases miyorare/extensions/miyorare-sources/multi-upstream.json \
            --farm-registry farm/compatibility/source-registry.json \
            --keiyoushi-commit "$(git -C upstream-keiyoushi rev-parse HEAD)" \
            --uma-commit "$(git -C upstream-uma rev-parse HEAD)" \
            --gekkoushi-commit "$(git -C upstream-gekkoushi rev-parse HEAD)" \
            --output build/source-inventory.json
          python3 source-packs/tools/source_inventory.py validate \
            --inventory build/source-inventory.json

      - name: Build Canonical Source Registry V2 projection from live Farm state
        shell: bash
        run: |
          set -euo pipefail
          python3 source-packs/tools/canonical_source_registry_v2.py migrate \
            --farm farm/compatibility/source-registry.json \
            --output build/canonical-source-registry-v2.json
          python3 source-packs/tools/canonical_source_registry_v2.py validate \
            --registry build/canonical-source-registry-v2.json

      - name: Verify identity, provider and LKG preservation
        shell: python {0}
        run: |
          import json
          from pathlib import Path

          farm = json.loads(Path('farm/compatibility/source-registry.json').read_text(encoding='utf-8'))
          v2 = json.loads(Path('build/canonical-source-registry-v2.json').read_text(encoding='utf-8'))
          old = {item['canonicalId']: item for item in farm['sources']}
          new = {item['canonicalId']: item for item in v2['sources']}
          if set(old) != set(new):
              raise SystemExit('V2 canonical identity set differs from live Farm registry')
          if v2.get('providerBaselines') != farm.get('providerBaselines'):
              raise SystemExit('V2 provider baselines differ from live Farm registry')
          for canonical, before in old.items():
              after = new[canonical]
              identities = before.get('upstreamIdentities', {})
              if after.get('providers') != identities:
                  raise SystemExit(f'{canonical}: provider identity mapping changed during V2 projection')
              if after.get('compatibility', {}).get('lastKnownGood') != before.get('lastKnownGood', {}):
                  raise SystemExit(f'{canonical}: LKG changed during V2 projection')
              if after.get('compatibility', {}).get('currentVersion') != before.get('currentVersion', {}):
                  raise SystemExit(f'{canonical}: current provider version changed during V2 projection')
          print(f'V2 projection preserved {len(new)} canonical source identities')

      - name: Verify discovery coverage and Farm separation
        shell: python {0}
        run: |
          import json
          from pathlib import Path

          inventory = json.loads(Path('build/source-inventory.json').read_text(encoding='utf-8'))
          farm = json.loads(Path('farm/compatibility/source-registry.json').read_text(encoding='utf-8'))
          if inventory.get('informationalOnly') is not True:
              raise SystemExit('inventory must be informational only')
          provider_mappings = inventory.get('stats', {}).get('providerMappings', 0)
          if provider_mappings <= len(farm.get('sources', [])):
              raise SystemExit('inventory did not expand beyond current Farm membership')
          discovered = {provider for item in inventory['sources'] for provider in item['providers']}
          expected = {'keiyoushi', 'uma', 'gekkoushi'}
          if discovered != expected:
              raise SystemExit(f'provider coverage mismatch: {sorted(discovered)}')
          print(json.dumps(inventory['stats'], sort_keys=True))

      - name: Upload generated registry previews for inspection
        uses: actions/upload-artifact@v4
        with:
          name: source-registry-previews
          path: |
            build/source-inventory.json
            build/canonical-source-registry-v2.json
          if-no-files-found: error
          retention-days: 7
