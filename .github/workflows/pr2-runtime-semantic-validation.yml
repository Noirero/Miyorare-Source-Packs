name: PR2 Frozen Runtime Semantic Validation

on:
  push:
    branches:
      - validation/pr2-runtime-semantic
    paths:
      - 'validation/**'
      - '.github/workflows/pr2-runtime-semantic-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr2-frozen-runtime-semantic
  cancel-in-progress: true

env:
  CANDIDATE_SHA: 4ba0b0aa1e61911bf4d1d524c6dd2e69f17b2c90
  MIYORARE_MAIN_SHA: 1724f0f1ca875ee32320c92d00294e7650a55678
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-pack:
    name: Build frozen candidate (${{ matrix.pack }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pack: [id, en, global]

    steps:
      - name: Checkout exact frozen Source-Packs candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Prove candidate SHA is frozen
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "Validating frozen Source-Packs candidate $CANDIDATE_SHA"

      - name: Resolve frozen validated pins
        id: pins
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p = json.loads(Path('upstream/registry.json').read_text(encoding='utf-8'))['providers']
          print(f"uma={p['uma']['lastKnownGood']}")
          print(f"gekkoushi={p['gekkoushi']['lastKnownGood']}")
          print(f"keiyoushi={p['keiyoushi']['lastKnownGood']}")
          print(f"semantic_base={p['keiyoushi']['semanticBase']}")
          PY

      - name: Checkout exact production Miyorare main
        uses: actions/checkout@v5
        with:
          repository: Noirero/Miyorare
          ref: ${{ env.MIYORARE_MAIN_SHA }}
          path: miyorare
          fetch-depth: 1

      - name: Checkout validated Gekkoushi
        uses: actions/checkout@v5
        with:
          repository: Gekkoushi/plugin-source
          ref: ${{ steps.pins.outputs.gekkoushi }}
          path: _upstream/gekkoushi
          fetch-depth: 1

      - name: Checkout validated UMA
        if: matrix.pack != 'global'
        uses: actions/checkout@v5
        with:
          repository: InvalidDavid/UMA
          ref: ${{ steps.pins.outputs.uma }}
          path: _upstream/uma
          fetch-depth: 1

      - name: Checkout validated Keiyoushi with history
        if: matrix.pack != 'global'
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: ${{ steps.pins.outputs.keiyoushi }}
          path: _upstream/keiyoushi
          fetch-depth: 0

      - name: Materialize frozen pins and semantic adapters
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/upstream_sync.py materialize \
            --registry upstream/registry.json \
            --miyorare-root miyorare

      - name: Verify canonical aliases
        if: matrix.pack != 'global'
        shell: bash
        run: |
          set -euo pipefail
          python3 miyorare/extensions/miyorare-sources/tools/verify_multi_upstream.py \
            --manifest miyorare/extensions/miyorare-sources/multi-upstream.json \
            --packs miyorare/extensions/miyorare-sources/packs.json \
            --uma _upstream/uma \
            --keiyoushi _upstream/keiyoushi \
            --output build/runtime-verified-${{ matrix.pack }}.json

      - name: Apply frozen Miyorare Gekkoushi overlays
        env:
          PACK: ${{ matrix.pack }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          pack = os.environ['PACK']
          selected = 'all' if pack == 'global' else pack
          source_root = Path('miyorare/extensions/miyorare-sources/overlays/gekkoushi') / selected
          if not source_root.is_dir():
              raise SystemExit(0)
          for file in source_root.rglob('*.kt'):
              rel = file.relative_to(source_root)
              target = Path('_upstream/gekkoushi/src/main/kotlin/tsuki/site') / selected / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(file, target)
              print(f'overlay: {file} -> {target}')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare UMA language shard
        if: matrix.pack != 'global'
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/prepare_pack.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --upstream _upstream/uma \
            --pack '${{ matrix.pack }}'

      - name: Build UMA language shard
        if: matrix.pack != 'global'
        working-directory: _upstream/uma
        run: |
          chmod +x gradlew
          ./gradlew buildJar --rerun-tasks --no-daemon

      - name: Finalize UMA language shard
        if: matrix.pack != 'global'
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/finalize_pack.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --upstream _upstream/uma \
            --pack '${{ matrix.pack }}' \
            --output build/runtime-${{ matrix.pack }}

      - name: Prepare Gekkoushi language shard
        if: matrix.pack != 'global'
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/prepare_gekkoushi_shard.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --uma-upstream _upstream/uma \
            --gekkoushi-upstream _upstream/gekkoushi \
            --pack '${{ matrix.pack }}'

      - name: Prepare Gekkoushi global shard
        if: matrix.pack == 'global'
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/prepare_global_gekkoushi_shard.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --gekkoushi-upstream _upstream/gekkoushi \
            --pack global

      - name: Build Gekkoushi shard
        working-directory: _upstream/gekkoushi
        run: |
          chmod +x gradlew
          ./gradlew buildJar --rerun-tasks --no-daemon

      - name: Finalize Gekkoushi language shard
        if: matrix.pack != 'global'
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/finalize_pack.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --upstream _upstream/gekkoushi \
            --pack '${{ matrix.pack }}' \
            --output build/runtime-${{ matrix.pack }}

      - name: Finalize Gekkoushi global shard
        if: matrix.pack == 'global'
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/finalize_global_shard.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --upstream _upstream/gekkoushi \
            --output build/runtime-global

      - name: Finalize logical language pack
        if: matrix.pack != 'global'
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/finalize_logical_pack.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --pack '${{ matrix.pack }}' \
            --uma-metadata _upstream/uma/miyorare-pack.json \
            --gekkoushi-metadata _upstream/gekkoushi/miyorare-pack.json \
            --output build/runtime-${{ matrix.pack }}

      - name: Finalize logical global pack
        if: matrix.pack == 'global'
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/finalize_global_pack.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --pack global \
            --gekkoushi-metadata _upstream/gekkoushi/miyorare-pack.json \
            --output build/runtime-global

      - name: Verify exact runtime shard set
        env:
          PACK: ${{ matrix.pack }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          pack = os.environ['PACK']
          expected = {
              'id': {'miyorare-id-uma.jar', 'miyorare-id-gekkoushi.jar'},
              'en': {'miyorare-en-uma.jar', 'miyorare-en-gekkoushi.jar'},
              'global': {'miyorare-global-gekkoushi.jar'},
          }[pack]
          root = Path(f'build/runtime-{pack}')
          actual = {p.name for p in root.glob('*.jar')}
          if actual != expected:
              raise SystemExit(f'{pack}: unexpected runtime JAR set: {sorted(actual)} != {sorted(expected)}')
          for jar in root.glob('*.jar'):
              sidecar = Path(str(jar) + '.sha256')
              if not sidecar.is_file():
                  raise SystemExit(f'missing SHA-256 sidecar for {jar.name}')
          print(f'{pack}: exact candidate shard set verified: {sorted(actual)}')
          PY

      - name: Upload frozen runtime shards
        uses: actions/upload-artifact@v4
        with:
          name: pr2-runtime-${{ matrix.pack }}
          path: build/runtime-${{ matrix.pack }}/*.jar
          if-no-files-found: error
          retention-days: 2

  runtime-semantic:
    name: Miyorare main runtime + live semantic smoke
    needs: build-pack
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout validation harness only
        uses: actions/checkout@v5
        with:
          ref: validation/pr2-runtime-semantic
          path: validation-source
          fetch-depth: 1

      - name: Checkout exact production Miyorare main
        uses: actions/checkout@v5
        with:
          repository: Noirero/Miyorare
          ref: ${{ env.MIYORARE_MAIN_SHA }}
          path: miyorare
          fetch-depth: 1

      - name: Download frozen candidate shards
        uses: actions/download-artifact@v4
        with:
          pattern: pr2-runtime-*
          path: candidate-jars
          merge-multiple: true

      - name: Inject validation test and candidate JARs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C miyorare rev-parse HEAD)" = "$MIYORARE_MAIN_SHA"

          mkdir -p miyorare/app/src/androidTest/assets/runtime-packs
          mkdir -p miyorare/app/src/androidTest/kotlin/org/koitharu/kotatsu/tsuki
          cp candidate-jars/*.jar miyorare/app/src/androidTest/assets/runtime-packs/
          cp validation-source/validation/Pr2RuntimeSemanticTest.kt \
            miyorare/app/src/androidTest/kotlin/org/koitharu/kotatsu/tsuki/Pr2RuntimeSemanticTest.kt

          python3 - <<'PY'
          from pathlib import Path
          root = Path('miyorare/app/src/androidTest/assets/runtime-packs')
          expected = {
              'miyorare-id-uma.jar',
              'miyorare-id-gekkoushi.jar',
              'miyorare-en-uma.jar',
              'miyorare-en-gekkoushi.jar',
              'miyorare-global-gekkoushi.jar',
          }
          actual = {p.name for p in root.glob('*.jar')}
          if actual != expected:
              raise SystemExit(f'runtime input mismatch: {sorted(actual)} != {sorted(expected)}')
          print('Runtime will test exact five candidate shards')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Compile validation instrumentation test
        working-directory: miyorare
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugAndroidTestKotlin --no-daemon --stacktrace

      - name: Enable KVM
        shell: bash
        run: sudo chmod 666 /dev/kvm || true

      - name: Run frozen candidate on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd miyorare && ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.tsuki.Pr2RuntimeSemanticTest --no-daemon --stacktrace

      - name: Upload semantic validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2-runtime-semantic-evidence
          path: |
            miyorare/app/build/reports/androidTests/connected/
            miyorare/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 7
