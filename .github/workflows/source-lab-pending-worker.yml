name: Source Lab Pending Worker

on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-lab-pending-worker.yml'
      - 'tools/source_pending_worker.py'
      - 'tools/source_live_parser_harness.py'

permissions:
  contents: write

concurrency:
  group: source-lab-pending-worker
  cancel-in-progress: false

jobs:
  worker:
    name: Process Compatibility Farm PENDING queue
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXPECTED_OWNER_ID: '149634319'
      BATCH_SIZE: '8'
    steps:
      - name: Validate execution context
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "Noirero/Miyorare-Source-Packs" ]]
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch|push) ;;
            *) echo "unexpected event: $GITHUB_EVENT_NAME" >&2; exit 1 ;;
          esac
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_ACTOR_ID" == "$EXPECTED_OWNER_ID" ]]
          fi

      - name: Checkout control plane
        uses: actions/checkout@v5
        with:
          ref: main
          path: control
          fetch-depth: 1

      - name: Checkout authoritative Compatibility Farm
        uses: actions/checkout@v5
        with:
          ref: compatibility-farm-foundation
          path: farm
          fetch-depth: 0

      - name: Pin Farm head and lifecycle
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          foundation_sha="$(git -C farm rev-parse HEAD)"
          remote_sha="$(git -C farm ls-remote origin refs/heads/compatibility-farm-foundation | awk '{print $1}')"
          [[ "$foundation_sha" == "$remote_sha" ]]
          echo "foundation_sha=$foundation_sha" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          status = json.loads(Path('farm/upstream/status.json').read_text(encoding='utf-8'))
          registry = json.loads(Path('farm/compatibility/source-registry.json').read_text(encoding='utf-8'))
          baselines = registry.get('providerBaselines', {})
          providers = status.get('providers', {})
          safe = status.get('schema') == 3 and isinstance(baselines, dict) and isinstance(providers, dict)
          for provider, baseline in baselines.items():
              provider_status = providers.get(provider)
              safe = (
                  safe
                  and isinstance(provider_status, dict)
                  and provider_status.get('activeCommit') == baseline
                  and provider_status.get('lastKnownGood') == baseline
              )
          staged = status.get('approvalCandidate')
          if isinstance(staged, dict):
              for provider, item in staged.get('providers', {}).items():
                  safe = safe and isinstance(item, dict) and item.get('current') == baselines.get(provider)
          print(f"safe={'true' if safe else 'false'}")
          PY

      - name: Plan next balanced PENDING batch
        id: plan
        if: steps.guard.outputs.safe == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p farm/automation farm/build
          python3 control/tools/source_pending_worker.py plan \
            --registry farm/compatibility/source-registry.json \
            --state farm/automation/pending-worker-state.json \
            --batch-size "$BATCH_SIZE" \
            --output farm/build/pending-worker-plan.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path('farm/build/pending-worker-plan.json').read_text(encoding='utf-8'))
          providers = sorted({p for item in data['items'] for p in item['providers']})
          print(f"count={data['batchSize']}")
          print('providers=' + ','.join(providers))
          PY

      - name: Resolve pinned provider baselines
        id: refs
        if: steps.plan.outputs.count != '' && steps.plan.outputs.count != '0'
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path('farm/compatibility/source-registry.json').read_text(encoding='utf-8'))
          for provider in ('keiyoushi', 'uma', 'gekkoushi'):
              print(f"{provider}={data['providerBaselines'][provider]}")
          PY

      - name: Checkout pinned Keiyoushi
        if: steps.plan.outputs.count != '' && steps.plan.outputs.count != '0'
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: ${{ steps.refs.outputs.keiyoushi }}
          path: _upstream/keiyoushi
          fetch-depth: 1

      - name: Checkout pinned UMA
        if: steps.plan.outputs.count != '' && steps.plan.outputs.count != '0'
        uses: actions/checkout@v5
        with:
          repository: InvalidDavid/UMA
          ref: ${{ steps.refs.outputs.uma }}
          path: _upstream/uma
          fetch-depth: 1

      - name: Checkout pinned Gekkoushi
        if: steps.plan.outputs.count != '' && steps.plan.outputs.count != '0'
        uses: actions/checkout@v5
        with:
          repository: Gekkoushi/plugin-source
          ref: ${{ steps.refs.outputs.gekkoushi }}
          path: _upstream/gekkoushi
          fetch-depth: 1

      - name: Set up Java 17
        if: steps.plan.outputs.count != '' && steps.plan.outputs.count != '0'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.plan.outputs.count != '' && steps.plan.outputs.count != '0'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Set up Android SDK
        if: steps.plan.outputs.count != '' && steps.plan.outputs.count != '0'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Initialize compile evidence
        if: steps.plan.outputs.count != '' && steps.plan.outputs.count != '0'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('farm/build/compile-results.json').write_text(
              json.dumps({'keiyoushi': {}, 'uma': {}, 'gekkoushi': {}}, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Compile selected UMA baseline once
        if: steps.plan.outputs.count != '' && steps.plan.outputs.count != '0'
        shell: bash
        run: |
          set -u
          present="$(python3 - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('farm/build/pending-worker-plan.json').read_text())
          print('true' if any('uma' in item['providers'] for item in plan['items']) else 'false')
          PY
          )"
          if [[ "$present" == "true" ]]; then
            if (cd _upstream/uma && chmod +x gradlew && ./gradlew buildJar --no-daemon); then ok=true; else ok=false; fi
            OK="$ok" python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('farm/build/compile-results.json')
          data = json.loads(path.read_text())
          data['uma']['*'] = os.environ['OK'] == 'true'
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          fi

      - name: Compile selected Gekkoushi baseline once
        if: steps.plan.outputs.count != '' && steps.plan.outputs.count != '0'
        shell: bash
        run: |
          set -u
          present="$(python3 - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('farm/build/pending-worker-plan.json').read_text())
          print('true' if any('gekkoushi' in item['providers'] for item in plan['items']) else 'false')
          PY
          )"
          if [[ "$present" == "true" ]]; then
            if (cd _upstream/gekkoushi && chmod +x gradlew && ./gradlew buildJar --no-daemon); then ok=true; else ok=false; fi
            OK="$ok" python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('farm/build/compile-results.json')
          data = json.loads(path.read_text())
          data['gekkoushi']['*'] = os.environ['OK'] == 'true'
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          fi

      - name: Compile selected Keiyoushi modules independently
        if: steps.plan.outputs.count != '' && steps.plan.outputs.count != '0'
        shell: bash
        run: |
          set -u
          mapfile -t modules < <(python3 - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('farm/build/pending-worker-plan.json').read_text())
          modules = sorted({item['upstreamIdentities']['keiyoushi']['module'] for item in plan['items'] if 'keiyoushi' in item['providers']})
          print('\n'.join(modules))
          PY
          )
          for module in "${modules[@]}"; do
            [[ -n "$module" ]] || continue
            task=":${module//\//:}:compileDebugKotlin"
            if (cd _upstream/keiyoushi && chmod +x gradlew && ./gradlew "$task" --no-daemon); then ok=true; else ok=false; fi
            MODULE="$module" OK="$ok" python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('farm/build/compile-results.json')
          data = json.loads(path.read_text())
          data['keiyoushi'][os.environ['MODULE']] = os.environ['OK'] == 'true'
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          done

      - name: Profile source shape, compile evidence, and reachability
        if: steps.plan.outputs.count != '' && steps.plan.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          python3 control/tools/source_pending_worker.py assess \
            --plan farm/build/pending-worker-plan.json \
            --keiyoushi-root _upstream/keiyoushi \
            --uma-root _upstream/uma \
            --gekkoushi-root _upstream/gekkoushi \
            --compile-results farm/build/compile-results.json \
            --timeout 8 \
            --fail-threshold 3 \
            --output farm/build/pending-worker-profile-results.json

      - name: Isolate upstream Gekkoushi tests
        if: steps.plan.outputs.count != '' && steps.plan.outputs.count != '0'
        shell: bash
        run: |
          if [[ -d _upstream/gekkoushi/src/test ]]; then
            mv _upstream/gekkoushi/src/test _upstream/gekkoushi/_compatibility-upstream-tests
          fi

      - name: Generate real parser smoke harnesses
        if: steps.plan.outputs.count != '' && steps.plan.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          for provider in uma gekkoushi keiyoushi; do
            python3 control/tools/source_live_parser_harness.py generate \
              --plan farm/build/pending-worker-plan.json \
              --profile-results farm/build/pending-worker-profile-results.json \
              --provider "$provider" \
              --provider-root "_upstream/$provider" \
              --output "farm/build/live-parser-$provider-manifest.json"
          done

      - name: Install Keiyoushi generic test runtime
        if: steps.plan.outputs.count != '' && steps.plan.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          test -f farm/compatibility/harness/keiyoushi/runtime/eu/kanade/tachiyomi/source/SourceFactoryShim.kt
          mapfile -t modules < <(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('farm/build/live-parser-keiyoushi-manifest.json').read_text())
          print('\n'.join(sorted({item['locator'] for item in data['tests']})))
          PY
          )
          for module in "${modules[@]}"; do
            [[ -n "$module" ]] || continue
            target="_upstream/keiyoushi/$module"
            mkdir -p "$target/compatibility-farm-test"
            cp -R farm/compatibility/harness/keiyoushi/runtime/. "$target/compatibility-farm-test/"

            lib_version="$(sed -n 's/.*libVersion[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$target/build.gradle.kts" | head -n 1)"
            case "$lib_version" in
              1.4) tachiyomi_test_dep='testImplementation(libs.tachiyomi.lib.v14)' ;;
              1.6) tachiyomi_test_dep='testImplementation(libs.tachiyomi.lib.v16)' ;;
              *)
                echo "Unsupported Keiyoushi libVersion for $module: $lib_version" >&2
                exit 1
                ;;
            esac

            resources="$target/compatibility-farm-test-resources/assets"
            mkdir -p "$resources"
            theme="$(sed -n 's/.*theme[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$target/build.gradle.kts" | head -n 1)"
            if [[ -n "$theme" && -d "_upstream/keiyoushi/lib-multisrc/$theme/assets" ]]; then
              cp -R "_upstream/keiyoushi/lib-multisrc/$theme/assets/." "$resources/"
            fi
            if [[ -d "$target/assets" ]]; then
              cp -R "$target/assets/." "$resources/"
            fi

            cat >> "$target/build.gradle.kts" <<EOF

          // Compatibility Farm generated real-parser test wiring. Disposable pinned checkout only.
          android {
              sourceSets {
                  named("test") {
                      java.directories.add("compatibility-farm-test")
                      kotlin.directories.add("compatibility-farm-test")
                      resources.srcDir("compatibility-farm-test-resources")
                  }
              }
              testOptions { unitTests.isReturnDefaultValues = true }
          }
          dependencies {
              testImplementation(libs.junit)
              testImplementation(libs.bundles.common)
              $tachiyomi_test_dep
          }
          tasks.matching { it.name == "kspDebugUnitTestKotlin" }.configureEach { enabled = false }
          EOF
          done

      - name: Execute UMA generated real parser tests
        if: steps.plan.outputs.count != '' && steps.plan.outputs.count != '0'
        continue-on-error: true
        shell: bash
        run: |
          set -u
          mapfile -t tests < <(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('farm/build/live-parser-uma-manifest.json').read_text())
          print('\n'.join(item['testClass'] for item in data['tests']))
          PY
          )
          if [[ ${#tests[@]} -gt 0 ]]; then
            args=()
            for test in "${tests[@]}"; do args+=(--tests "$test"); done
            (cd _upstream/uma && chmod +x gradlew && ./gradlew test "${args[@]}" --no-daemon)
          fi

      - name: Execute Gekkoushi generated real parser tests
        if: steps.plan.outputs.count != '' && steps.plan.outputs.count != '0'
        continue-on-error: true
        shell: bash
        run: |
          set -u
          mapfile -t tests < <(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('farm/build/live-parser-gekkoushi-manifest.json').read_text())
          print('\n'.join(item['testClass'] for item in data['tests']))
          PY
          )
          if [[ ${#tests[@]} -gt 0 ]]; then
            args=()
            for test in "${tests[@]}"; do args+=(--tests "$test"); done
            (cd _upstream/gekkoushi && chmod +x gradlew && ./gradlew test "${args[@]}" --no-daemon)
          fi

      - name: Execute Keiyoushi generated real parser tests
        if: steps.plan.outputs.count != '' && steps.plan.outputs.count != '0'
        continue-on-error: true
        shell: bash
        run: |
          set -u
          python3 - <<'PY' > farm/build/keiyoushi-tests.tsv
          import json
          from pathlib import Path
          data = json.loads(Path('farm/build/live-parser-keiyoushi-manifest.json').read_text())
          for item in data['tests']:
              print(item['locator'], item['testClass'], sep='\t')
          PY
          while IFS=$'\t' read -r module test; do
            [[ -n "$module" && -n "$test" ]] || continue
            task=":${module//\//:}:testDebugUnitTest"
            (cd _upstream/keiyoushi && chmod +x gradlew && ./gradlew "$task" --tests "$test" --no-daemon) || true
          done < farm/build/keiyoushi-tests.tsv

      - name: Collect real parser evidence
        if: steps.plan.outputs.count != '' && steps.plan.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          python3 control/tools/source_live_parser_harness.py collect \
            --manifest farm/build/live-parser-uma-manifest.json \
            --manifest farm/build/live-parser-gekkoushi-manifest.json \
            --manifest farm/build/live-parser-keiyoushi-manifest.json \
            --output farm/build/live-parser-results.json

      - name: Enforce real parser gate
        if: steps.plan.outputs.count != '' && steps.plan.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          python3 control/tools/source_pending_worker.py finalize \
            --profile-results farm/build/pending-worker-profile-results.json \
            --parser-results farm/build/live-parser-results.json \
            --fail-threshold 3 \
            --output farm/build/pending-worker-results.json

      - name: Persist autonomous queue state
        if: steps.plan.outputs.count != '' && steps.plan.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 control/tools/source_pending_worker.py apply \
            --registry farm/compatibility/source-registry.json \
            --state farm/automation/pending-worker-state.json \
            --results farm/build/pending-worker-results.json \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --checked-at "$checked_at" \
            --summary farm/build/pending-worker-summary.json

      - name: Commit queue progress if Farm head is still current
        if: steps.plan.outputs.count != '' && steps.plan.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ steps.guard.outputs.foundation_sha }}'
          remote="$(git -C farm ls-remote origin refs/heads/compatibility-farm-foundation | awk '{print $1}')"
          if [[ "$remote" != "$expected" ]]; then
            echo "Farm head changed during worker execution; discarding stale batch state." >&2
            exit 0
          fi
          cd farm
          if [[ -z "$(git status --porcelain -- automation/pending-worker-state.json)" ]]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/pending-worker-state.json
          git commit -m 'farm: advance autonomous pending queue with real parser evidence'
          git push origin HEAD:compatibility-farm-foundation

      - name: Upload worker evidence
        if: always() && steps.plan.outputs.count != '' && steps.plan.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: source-lab-pending-worker-${{ github.run_id }}
          path: |
            farm/build/pending-worker-plan.json
            farm/build/compile-results.json
            farm/build/pending-worker-profile-results.json
            farm/build/live-parser-*-manifest.json
            farm/build/live-parser-results.json
            farm/build/pending-worker-results.json
            farm/build/pending-worker-summary.json
            _upstream/uma/build/test-results/test/*.xml
            _upstream/gekkoushi/build/test-results/test/*.xml
            _upstream/keiyoushi/**/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '## Autonomous PENDING worker — real parser gated' >> "$GITHUB_STEP_SUMMARY"
          echo "Lifecycle safe: ${{ steps.guard.outputs.safe }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Planned sources: ${{ steps.plan.outputs.count }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f farm/build/pending-worker-summary.json ]]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat farm/build/pending-worker-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
