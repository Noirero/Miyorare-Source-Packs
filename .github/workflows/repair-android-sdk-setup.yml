name: Audit Android SDK Setup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-source-pack-android-sdk-setup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Verify explicit Android SDK packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Audit Source Pack workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.github/workflows')
          self_name = 'repair-android-sdk-setup.yml'
          uses_line = 'uses: android-actions/setup-android@v4'
          failures = []
          checked = 0

          for path in sorted([*root.glob('*.yml'), *root.glob('*.yaml')]):
              if path.name == self_name:
                  continue
              lines = path.read_text(encoding='utf-8').splitlines()
              for index, line in enumerate(lines):
                  if line.strip() != uses_line:
                      continue
                  checked += 1
                  base_indent = len(line) - len(line.lstrip())
                  block = []
                  for following in lines[index + 1:]:
                      if following.strip():
                          indent = len(following) - len(following.lstrip())
                          if indent < base_indent:
                              break
                      block.append(following)

                  expected_with = ' ' * base_indent + 'with:'
                  expected_packages = ' ' * (base_indent + 2) + 'packages: platform-tools'
                  if expected_with not in block or expected_packages not in block:
                      failures.append(f'{path}:{index + 1}')

          if checked == 0:
              raise SystemExit('No android-actions/setup-android@v4 usage found to audit.')
          if failures:
              print('Android SDK setup must explicitly request packages: platform-tools at:')
              for item in failures:
                  print(f' - {item}')
              raise SystemExit(1)

          print(f'Android SDK audit passed for {checked} setup-android step(s).')
          PY
