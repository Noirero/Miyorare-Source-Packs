name: Miyorare Upstream Sync

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: miyorare-upstream-sync
  cancel-in-progress: false

env:
  REGISTRY: upstream/registry.json

jobs:
  plan:
    name: Detect upstream updates
    runs-on: ubuntu-latest
    outputs:
      keiyoushi_current: ${{ steps.plan.outputs.KEIYOUSHI_CURRENT }}
      keiyoushi_candidate: ${{ steps.plan.outputs.KEIYOUSHI_CANDIDATE }}
      keiyoushi_changed: ${{ steps.plan.outputs.KEIYOUSHI_CHANGED }}
      uma_current: ${{ steps.plan.outputs.UMA_CURRENT }}
      uma_candidate: ${{ steps.plan.outputs.UMA_CANDIDATE }}
      uma_changed: ${{ steps.plan.outputs.UMA_CHANGED }}
      gekkoushi_current: ${{ steps.plan.outputs.GEKKOUSHI_CURRENT }}
      gekkoushi_candidate: ${{ steps.plan.outputs.GEKKOUSHI_CANDIDATE }}
      gekkoushi_changed: ${{ steps.plan.outputs.GEKKOUSHI_CHANGED }}
    steps:
      - name: Checkout sync engine
        uses: actions/checkout@v5

      - name: Validate registry
        run: python3 tools/upstream_sync.py validate --registry "$REGISTRY"

      - name: Resolve upstream heads
        id: plan
        run: |
          python3 tools/upstream_sync.py plan \
            --registry "$REGISTRY" \
            --output upstream/sync-plan.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload sync plan
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-plan
          path: upstream/sync-plan.json
          retention-days: 7

  validate-keiyoushi:
    name: Validate Keiyoushi candidate
    needs: plan
    if: needs.plan.outputs.keiyoushi_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync engine
        uses: actions/checkout@v5
        with:
          path: source-packs

      - name: Checkout Miyorare beta
        uses: actions/checkout@v5
        with:
          repository: Noirero/Miyorare
          ref: beta
          path: miyorare
          fetch-depth: 1

      - name: Checkout last-known-good UMA
        uses: actions/checkout@v5
        with:
          repository: InvalidDavid/UMA
          ref: ${{ needs.plan.outputs.uma_current }}
          path: _upstream/uma
          fetch-depth: 1

      - name: Checkout Keiyoushi candidate with history
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: ${{ needs.plan.outputs.keiyoushi_candidate }}
          path: _upstream/keiyoushi
          fetch-depth: 0

      - name: Materialize candidate pin
        run: |
          python3 source-packs/tools/upstream_sync.py materialize \
            --registry source-packs/$REGISTRY \
            --miyorare-root miyorare \
            --override keiyoushi=${{ needs.plan.outputs.keiyoushi_candidate }}

      - name: Classify registered Keiyoushi source impact
        run: |
          python3 source-packs/tools/keiyoushi_intake.py \
            --aliases miyorare/extensions/miyorare-sources/multi-upstream.json \
            --repo _upstream/keiyoushi \
            --base ${{ needs.plan.outputs.keiyoushi_current }} \
            --candidate ${{ needs.plan.outputs.keiyoushi_candidate }} \
            --output build/keiyoushi-intake.json \
            --strict

      - name: Verify canonical aliases against candidate
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/verify_multi_upstream.py \
            --manifest miyorare/extensions/miyorare-sources/multi-upstream.json \
            --packs miyorare/extensions/miyorare-sources/packs.json \
            --uma _upstream/uma \
            --keiyoushi _upstream/keiyoushi \
            --output build/verified-multi-upstream.json

      - name: Upload Keiyoushi intake report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keiyoushi-intake-report
          path: build/keiyoushi-intake.json
          if-no-files-found: ignore
          retention-days: 14

  validate-uma:
    name: Validate UMA ${{ matrix.pack }} candidate
    needs: plan
    if: needs.plan.outputs.uma_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack: [id, en]
    steps:
      - name: Checkout sync engine
        uses: actions/checkout@v5
        with:
          path: source-packs

      - name: Checkout Miyorare beta
        uses: actions/checkout@v5
        with:
          repository: Noirero/Miyorare
          ref: beta
          path: miyorare
          fetch-depth: 1

      - name: Checkout UMA candidate
        uses: actions/checkout@v5
        with:
          repository: InvalidDavid/UMA
          ref: ${{ needs.plan.outputs.uma_candidate }}
          path: _upstream/uma
          fetch-depth: 1

      - name: Materialize candidate pin
        run: |
          python3 source-packs/tools/upstream_sync.py materialize \
            --registry source-packs/$REGISTRY \
            --miyorare-root miyorare \
            --override uma=${{ needs.plan.outputs.uma_candidate }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare candidate shard
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/prepare_pack.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --upstream _upstream/uma \
            --pack '${{ matrix.pack }}'

      - name: Build candidate shard
        working-directory: _upstream/uma
        run: |
          chmod +x gradlew
          ./gradlew buildJar --rerun-tasks --no-daemon

      - name: Finalize candidate shard
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/finalize_pack.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --upstream _upstream/uma \
            --pack '${{ matrix.pack }}' \
            --output build/uma-${{ matrix.pack }}

  gekkoushi-overlay-guard:
    name: Guard Miyorare Gekkoushi overlays
    needs: plan
    if: needs.plan.outputs.gekkoushi_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync engine
        uses: actions/checkout@v5
        with:
          path: source-packs

      - name: Checkout Miyorare beta
        uses: actions/checkout@v5
        with:
          repository: Noirero/Miyorare
          ref: beta
          path: miyorare
          fetch-depth: 1

      - name: Checkout Gekkoushi candidate with history
        uses: actions/checkout@v5
        with:
          repository: Gekkoushi/plugin-source
          ref: ${{ needs.plan.outputs.gekkoushi_candidate }}
          path: _upstream/gekkoushi
          fetch-depth: 0

      - name: Three-way protected overlay guard
        run: |
          python3 source-packs/tools/upstream_sync.py overlay-conflicts \
            --registry source-packs/$REGISTRY \
            --miyorare-root miyorare \
            --upstream-repo _upstream/gekkoushi \
            --provider gekkoushi \
            --base ${{ needs.plan.outputs.gekkoushi_current }} \
            --candidate ${{ needs.plan.outputs.gekkoushi_candidate }} \
            --output build/gekkoushi-overlay-report.json

      - name: Upload overlay report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gekkoushi-overlay-report
          path: build/gekkoushi-overlay-report.json
          if-no-files-found: ignore
          retention-days: 14

  validate-gekkoushi:
    name: Validate Gekkoushi ${{ matrix.pack }} candidate
    needs: [plan, gekkoushi-overlay-guard]
    if: needs.plan.outputs.gekkoushi_changed == 'true' && needs.gekkoushi-overlay-guard.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack: [id, en, global]
    steps:
      - name: Checkout sync engine
        uses: actions/checkout@v5
        with:
          path: source-packs

      - name: Checkout Miyorare beta
        uses: actions/checkout@v5
        with:
          repository: Noirero/Miyorare
          ref: beta
          path: miyorare
          fetch-depth: 1

      - name: Checkout last-known-good UMA
        uses: actions/checkout@v5
        with:
          repository: InvalidDavid/UMA
          ref: ${{ needs.plan.outputs.uma_current }}
          path: _upstream/uma
          fetch-depth: 1

      - name: Checkout Gekkoushi candidate
        uses: actions/checkout@v5
        with:
          repository: Gekkoushi/plugin-source
          ref: ${{ needs.plan.outputs.gekkoushi_candidate }}
          path: _upstream/gekkoushi
          fetch-depth: 1

      - name: Materialize candidate pin
        run: |
          python3 source-packs/tools/upstream_sync.py materialize \
            --registry source-packs/$REGISTRY \
            --miyorare-root miyorare \
            --override gekkoushi=${{ needs.plan.outputs.gekkoushi_candidate }}

      - name: Apply matching Miyorare overlays
        env:
          PACK: ${{ matrix.pack }}
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          pack = os.environ['PACK']
          root = Path('miyorare/extensions/miyorare-sources/overlays/gekkoushi')
          if not root.is_dir():
              raise SystemExit(0)
          allowed = {'all'} if pack == 'global' else {pack}
          for file in root.rglob('*.kt'):
              rel = file.relative_to(root)
              if not rel.parts or rel.parts[0] not in allowed:
                  continue
              target = Path('_upstream/gekkoushi/src/main/kotlin/tsuki/site') / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(file, target)
              print(f'overlay: {file} -> {target}')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare UMA metadata for Gekkoushi language shard
        if: matrix.pack != 'global'
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/prepare_pack.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --upstream _upstream/uma \
            --pack '${{ matrix.pack }}'

      - name: Prepare language shard
        if: matrix.pack != 'global'
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/prepare_gekkoushi_shard.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --uma-upstream _upstream/uma \
            --gekkoushi-upstream _upstream/gekkoushi \
            --pack '${{ matrix.pack }}'

      - name: Prepare global shard
        if: matrix.pack == 'global'
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/prepare_global_gekkoushi_shard.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --gekkoushi-upstream _upstream/gekkoushi \
            --pack global

      - name: Build candidate shard
        working-directory: _upstream/gekkoushi
        run: |
          chmod +x gradlew
          ./gradlew buildJar --rerun-tasks --no-daemon

      - name: Finalize language shard
        if: matrix.pack != 'global'
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/finalize_pack.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --upstream _upstream/gekkoushi \
            --pack '${{ matrix.pack }}' \
            --output build/gekkoushi-${{ matrix.pack }}

      - name: Finalize global shard
        if: matrix.pack == 'global'
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/finalize_global_shard.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --upstream _upstream/gekkoushi \
            --output build/gekkoushi-global

  integration:
    name: Validate combined effective set (${{ matrix.pack }})
    needs: [plan, validate-keiyoushi, validate-uma, gekkoushi-overlay-guard, validate-gekkoushi]
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.plan.outputs.keiyoushi_changed == 'true' || needs.plan.outputs.uma_changed == 'true' || needs.plan.outputs.gekkoushi_changed == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack: [id, en, global]
    env:
      KEI_CHANGED: ${{ needs.plan.outputs.keiyoushi_changed }}
      KEI_RESULT: ${{ needs.validate-keiyoushi.result }}
      UMA_CHANGED: ${{ needs.plan.outputs.uma_changed }}
      UMA_RESULT: ${{ needs.validate-uma.result }}
      GEK_CHANGED: ${{ needs.plan.outputs.gekkoushi_changed }}
      GEK_GUARD_RESULT: ${{ needs.gekkoushi-overlay-guard.result }}
      GEK_RESULT: ${{ needs.validate-gekkoushi.result }}
    steps:
      - name: Checkout sync engine
        uses: actions/checkout@v5
        with:
          path: source-packs

      - name: Resolve effective validated refs
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          kei='${{ needs.plan.outputs.keiyoushi_current }}'
          uma='${{ needs.plan.outputs.uma_current }}'
          gek='${{ needs.plan.outputs.gekkoushi_current }}'
          if [[ "$KEI_CHANGED" == "true" && "$KEI_RESULT" == "success" ]]; then kei='${{ needs.plan.outputs.keiyoushi_candidate }}'; fi
          if [[ "$UMA_CHANGED" == "true" && "$UMA_RESULT" == "success" ]]; then uma='${{ needs.plan.outputs.uma_candidate }}'; fi
          if [[ "$GEK_CHANGED" == "true" && "$GEK_GUARD_RESULT" == "success" && "$GEK_RESULT" == "success" ]]; then gek='${{ needs.plan.outputs.gekkoushi_candidate }}'; fi
          echo "keiyoushi=$kei" >> "$GITHUB_OUTPUT"
          echo "uma=$uma" >> "$GITHUB_OUTPUT"
          echo "gekkoushi=$gek" >> "$GITHUB_OUTPUT"

      - name: Checkout Miyorare beta
        uses: actions/checkout@v5
        with:
          repository: Noirero/Miyorare
          ref: beta
          path: miyorare
          fetch-depth: 1

      - name: Checkout effective UMA
        uses: actions/checkout@v5
        with:
          repository: InvalidDavid/UMA
          ref: ${{ steps.refs.outputs.uma }}
          path: _upstream/uma
          fetch-depth: 1

      - name: Checkout effective Gekkoushi
        uses: actions/checkout@v5
        with:
          repository: Gekkoushi/plugin-source
          ref: ${{ steps.refs.outputs.gekkoushi }}
          path: _upstream/gekkoushi
          fetch-depth: 1

      - name: Checkout effective Keiyoushi
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: ${{ steps.refs.outputs.keiyoushi }}
          path: _upstream/keiyoushi
          fetch-depth: 1

      - name: Materialize effective pins
        run: |
          python3 source-packs/tools/upstream_sync.py materialize \
            --registry source-packs/$REGISTRY \
            --miyorare-root miyorare \
            --override keiyoushi=${{ steps.refs.outputs.keiyoushi }} \
            --override uma=${{ steps.refs.outputs.uma }} \
            --override gekkoushi=${{ steps.refs.outputs.gekkoushi }}

      - name: Verify canonical aliases
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/verify_multi_upstream.py \
            --manifest miyorare/extensions/miyorare-sources/multi-upstream.json \
            --packs miyorare/extensions/miyorare-sources/packs.json \
            --uma _upstream/uma \
            --keiyoushi _upstream/keiyoushi \
            --output build/verified-multi-upstream.json

      - name: Apply matching Miyorare overlays
        env:
          PACK: ${{ matrix.pack }}
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          pack = os.environ['PACK']
          root = Path('miyorare/extensions/miyorare-sources/overlays/gekkoushi')
          if not root.is_dir():
              raise SystemExit(0)
          allowed = {'all'} if pack == 'global' else {pack}
          for file in root.rglob('*.kt'):
              rel = file.relative_to(root)
              if not rel.parts or rel.parts[0] not in allowed:
                  continue
              target = Path('_upstream/gekkoushi/src/main/kotlin/tsuki/site') / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(file, target)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare UMA language shard
        if: matrix.pack != 'global'
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/prepare_pack.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --upstream _upstream/uma \
            --pack '${{ matrix.pack }}'

      - name: Build UMA language shard
        if: matrix.pack != 'global'
        working-directory: _upstream/uma
        run: |
          chmod +x gradlew
          ./gradlew buildJar --rerun-tasks --no-daemon

      - name: Finalize UMA language shard
        if: matrix.pack != 'global'
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/finalize_pack.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --upstream _upstream/uma \
            --pack '${{ matrix.pack }}' \
            --output build/integration-${{ matrix.pack }}

      - name: Prepare Gekkoushi language shard
        if: matrix.pack != 'global'
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/prepare_gekkoushi_shard.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --uma-upstream _upstream/uma \
            --gekkoushi-upstream _upstream/gekkoushi \
            --pack '${{ matrix.pack }}'

      - name: Prepare Gekkoushi global shard
        if: matrix.pack == 'global'
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/prepare_global_gekkoushi_shard.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --gekkoushi-upstream _upstream/gekkoushi \
            --pack global

      - name: Build Gekkoushi shard
        working-directory: _upstream/gekkoushi
        run: |
          chmod +x gradlew
          ./gradlew buildJar --rerun-tasks --no-daemon

      - name: Finalize Gekkoushi language shard
        if: matrix.pack != 'global'
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/finalize_pack.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --upstream _upstream/gekkoushi \
            --pack '${{ matrix.pack }}' \
            --output build/integration-${{ matrix.pack }}

      - name: Finalize Gekkoushi global shard
        if: matrix.pack == 'global'
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/finalize_global_shard.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --upstream _upstream/gekkoushi \
            --output build/integration-global

      - name: Finalize logical language pack
        if: matrix.pack != 'global'
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/finalize_logical_pack.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --pack '${{ matrix.pack }}' \
            --uma-metadata _upstream/uma/miyorare-pack.json \
            --gekkoushi-metadata _upstream/gekkoushi/miyorare-pack.json \
            --output build/integration-${{ matrix.pack }}

      - name: Finalize logical global pack
        if: matrix.pack == 'global'
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/finalize_global_pack.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --pack global \
            --gekkoushi-metadata _upstream/gekkoushi/miyorare-pack.json \
            --output build/integration-global

  candidate-handoff:
    name: Hand validated candidates to Compatibility Farm
    needs: [plan, validate-keiyoushi, validate-uma, gekkoushi-overlay-guard, validate-gekkoushi, integration]
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.plan.outputs.keiyoushi_changed == 'true' || needs.plan.outputs.uma_changed == 'true' || needs.plan.outputs.gekkoushi_changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Download immutable sync plan
        uses: actions/download-artifact@v5
        with:
          name: upstream-sync-plan
          path: upstream-handoff

      - name: Build fail-closed candidate handoff
        env:
          KEI_CHANGED: ${{ needs.plan.outputs.keiyoushi_changed }}
          KEI_RESULT: ${{ needs.validate-keiyoushi.result }}
          UMA_CHANGED: ${{ needs.plan.outputs.uma_changed }}
          UMA_RESULT: ${{ needs.validate-uma.result }}
          GEK_CHANGED: ${{ needs.plan.outputs.gekkoushi_changed }}
          GEK_GUARD_RESULT: ${{ needs.gekkoushi-overlay-guard.result }}
          GEK_RESULT: ${{ needs.validate-gekkoushi.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path('upstream-handoff/sync-plan.json').read_text(encoding='utf-8'))
          handoff = {
              'schemaVersion': 1,
              'maintenanceMode': 'APPROVE_ONLY',
              'state': 'CANDIDATE',
              'approvalState': 'NOT_READY',
              'nextAction': 'RUN_REAL_PARSER_COMPATIBILITY_FARM',
              'ownerActionRequired': False,
              'publishEligible': False,
              'registryMutationAllowed': False,
              'releaseDispatchAllowed': False,
              'plan': plan,
              'validationResults': {
                  'keiyoushi': os.environ['KEI_RESULT'],
                  'uma': os.environ['UMA_RESULT'],
                  'gekkoushiOverlayGuard': os.environ['GEK_GUARD_RESULT'],
                  'gekkoushi': os.environ['GEK_RESULT'],
                  'integration': os.environ['INTEGRATION_RESULT'],
              },
          }
          Path('upstream-handoff/candidate-handoff.json').write_text(
              json.dumps(handoff, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Upload candidate handoff evidence
        uses: actions/upload-artifact@v4
        with:
          name: upstream-candidate-handoff
          path: upstream-handoff/candidate-handoff.json
          if-no-files-found: error
          retention-days: 14
