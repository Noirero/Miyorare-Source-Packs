name: Miyorare Upstream Sync

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miyorare-upstream-sync-main-recovery
  cancel-in-progress: false

jobs:
  diagnostics:
    name: Read-only upstream recovery diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fail closed on recovery context
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REPOSITORY" == "Noirero/Miyorare-Source-Packs" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]

      - name: Checkout authoritative Compatibility Farm state
        uses: actions/checkout@v5
        with:
          ref: compatibility-farm-foundation
          path: farm
          fetch-depth: 1

      - name: Compare upstream heads with authoritative last-known-good
        shell: bash
        run: |
          set -euo pipefail
          export KEI_HEAD="$(gh api repos/keiyoushi/extensions-source/git/ref/heads/main --jq '.object.sha')"
          export UMA_HEAD="$(gh api repos/InvalidDavid/UMA/git/ref/heads/master --jq '.object.sha')"
          export GEK_HEAD="$(gh api repos/Gekkoushi/plugin-source/git/ref/heads/master --jq '.object.sha')"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          registry = json.loads(Path('farm/upstream/registry.json').read_text(encoding='utf-8'))
          heads = {
              'keiyoushi': os.environ['KEI_HEAD'],
              'uma': os.environ['UMA_HEAD'],
              'gekkoushi': os.environ['GEK_HEAD'],
          }
          print('## Upstream recovery diagnostics')
          print('')
          print('Routine upstream intake is owned by **Source Lab Auto Farm**. This workflow is read-only and exists only for diagnostics/recovery.')
          print('')
          print('| Provider | Last-known-good | Upstream head | State |')
          print('|---|---|---|---|')
          for provider in ('keiyoushi', 'uma', 'gekkoushi'):
              current = registry['providers'][provider]['lastKnownGood']
              head = heads[provider]
              state = 'change detected' if head != current else 'current'
              print(f'| {provider} | `{current[:12]}` | `{head[:12]}` | {state} |')
          print('')
          print('No repository ref, LKG, release, or approval state is mutated by this recovery workflow.')
          PY
