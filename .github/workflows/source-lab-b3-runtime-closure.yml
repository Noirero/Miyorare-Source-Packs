name: Source Lab B3 Runtime Closure
run-name: Source Lab B3 Runtime Closure

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/source-lab-b3-runtime-closure.yml'
      - '.github/workflows/source-lab-b3-live-runtime-probe.yml'
      - 'tools/source_lab_b3_reconciliation.py'
      - 'tools/source_lab_b3_runtime_closure.py'
      - 'tests/test_source_lab_b3_reconciliation.py'
      - 'tests/test_source_lab_b3_runtime_closure.py'
      - 'compatibility/evidence/track-b-batch3-runtime-boundary.json'
      - 'compatibility/evidence/track-b-batch3-upstream-disposition.json'
      - 'compatibility/evidence/track-b-batch3-live-runtime-access.json'

permissions:
  contents: read

concurrency:
  group: source-lab-b3-runtime-closure-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  EXPECTED_OWNER_ID: '149634319'
  PROBE_HEAD: 'e6073478360889dc3c38eaea4bcac9e9a66d03dd'
  PROBE_RUN: '39344310445'
  PROBE_ARTIFACT_ID: '12230556420'
  PROBE_ARTIFACT_DIGEST: 'sha256:bbdb0ca0d3aab9e2657dca70eefb32515aabdb3dcf8cfa7f90a830eebfc8f9d1'
  PROBE_WORKFLOW_BLOB: '387c150e3fc65e68a60b49e9fc844a8ee7702e37'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  close-runtime-cohort:
    name: Close B3 runtime cohort without parser mutation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Validate safe execution context
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "Noirero/Miyorare-Source-Packs" ]]
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              [[ "$PR_HEAD_REPO" == "$GITHUB_REPOSITORY" ]] || {
                echo "::error::B3 runtime closure accepts same-repository PRs only"
                exit 1
              }
              ;;
            workflow_dispatch)
              [[ "$GITHUB_ACTOR_ID" == "$EXPECTED_OWNER_ID" ]]
              [[ "$GITHUB_REF_NAME" == "main" ]]
              ;;
            *) echo "::error::unexpected event: $GITHUB_EVENT_NAME"; exit 1 ;;
          esac

      - name: Checkout proposed runtime closure
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: control
          fetch-depth: 1

      - name: Prove frozen live-probe provenance
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C control hash-object .github/workflows/source-lab-b3-live-runtime-probe.yml)" == "$PROBE_WORKFLOW_BLOB" ]]
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('control/compatibility/evidence/track-b-batch3-live-runtime-access.json').read_text())
          assert data['schemaVersion'] == 1
          assert data['phase'] == 'TRACK_B_BATCH_3_LIVE_RUNTIME_ACCESS'
          assert data['readOnly'] is True
          assert len(data['entries']) == 9
          src = data['source']
          assert src['pr'] == 160
          assert src['head'] == os.environ['PROBE_HEAD']
          assert src['runId'] == int(os.environ['PROBE_RUN'])
          assert src['artifactId'] == int(os.environ['PROBE_ARTIFACT_ID'])
          assert src['artifactDigest'] == os.environ['PROBE_ARTIFACT_DIGEST']
          assert src['probeWorkflowBlob'] == os.environ['PROBE_WORKFLOW_BLOB']
          PY

      - name: Compile and run runtime-closure regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              'tools/source_lab_b3_reconciliation.py',
              'tools/source_lab_b3_runtime_closure.py',
              'tests/test_source_lab_b3_reconciliation.py',
              'tests/test_source_lab_b3_runtime_closure.py',
          ):
              path = Path('control') / name
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY
          PYTHONPATH=control/tools python3 -m unittest \
            control/tests/test_source_lab_b3_reconciliation.py \
            control/tests/test_source_lab_b3_runtime_closure.py

      - name: Build read-only runtime closure report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          PYTHONPATH=control/tools python3 control/tools/source_lab_b3_runtime_closure.py \
            --boundary control/compatibility/evidence/track-b-batch3-runtime-boundary.json \
            --upstream-evidence control/compatibility/evidence/track-b-batch3-upstream-disposition.json \
            --live-access-evidence control/compatibility/evidence/track-b-batch3-live-runtime-access.json \
            --output build/track-b-batch3-runtime-closure.json \
            --markdown-output build/track-b-batch3-runtime-closure.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('build/track-b-batch3-runtime-closure.json').read_text())
          assert data['schemaVersion'] == 1
          assert data['phase'] == 'TRACK_B_BATCH_3_RUNTIME_CLOSURE'
          assert data['readOnly'] is True
          assert data['summary']['rows'] == 33
          assert data['summary']['upstreamEvidenceBackedRows'] == 16
          assert data['summary']['liveAccessEvidenceBackedRows'] == 9
          assert data['summary']['evidenceBackedRows'] == 25
          assert data['summary']['routes'] == {
              'LIVE_ACCESS_BLOCKED': 8,
              'LIVE_DOMAIN_DISPOSITION': 1,
              'PRIMARY_MISSING_UNRESOLVED': 8,
              'PROVEN_UPSTREAM_DEAD': 15,
              'PROVEN_UPSTREAM_MIGRATION': 1,
          }
          assert data['safety'] == {
              'approvesOverlay': False,
              'mutatesAuthority': False,
              'mutatesCanonicalIds': False,
              'mutatesLastKnownGood': False,
              'mutatesRetryHeld': False,
              'promotesProvider': False,
          }
          PY

      - name: Prove control checkout was not mutated
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C control status --porcelain)"

      - name: Upload B3 runtime closure evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-b-batch3-runtime-closure-${{ github.run_id }}
          path: |
            build/track-b-batch3-runtime-closure.json
            build/track-b-batch3-runtime-closure.md
          if-no-files-found: error
          retention-days: 14
