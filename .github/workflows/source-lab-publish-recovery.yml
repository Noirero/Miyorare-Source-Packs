name: Source Lab Publish Recovery
run-name: Source Lab publish recovery ${{ github.run_id }}

on:
  workflow_run:
    workflows:
      - Source Lab Publish Candidate
    types:
      - completed
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/source-lab-publish-recovery.yml'

permissions:
  actions: write
  contents: read

# Serialize recovery with Auto Farm so the provider lifecycle is never advanced
# by two autonomous control loops at the same time.
concurrency:
  group: source-lab-auto-farm
  cancel-in-progress: false

jobs:
  recover:
    name: Rerun exact failed Owner publish
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_OWNER_ID: '149634319'
      MAX_PUBLISH_ATTEMPTS: '3'
    steps:
      - name: Fail closed on automation context
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "Noirero/Miyorare-Source-Packs" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          case "$GITHUB_EVENT_NAME" in
            workflow_run|schedule|push) ;;
            *) echo "Unexpected recovery event: $GITHUB_EVENT_NAME" >&2; exit 1 ;;
          esac

      - name: Checkout authoritative Compatibility Farm
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: compatibility-farm-foundation
          path: farm
          fetch-depth: 1

      - name: Resolve exact failed publish from live authority
        id: target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          status = json.loads(Path('farm/upstream/status.json').read_text(encoding='utf-8'))
          if status.get('schema') != 3:
              raise SystemExit('unexpected upstream status schema')

          promotion = status.get('lastPromotion')
          published = status.get('lastPublish')
          failure = status.get('lastPublishFailure')

          available = False
          candidate = ''
          signing_run_id = ''
          publish_run_id = ''

          if isinstance(promotion, dict) and isinstance(failure, dict):
              promoted_candidate = promotion.get('candidateSetId')
              already_published = (
                  isinstance(published, dict)
                  and published.get('candidateSetId') == promoted_candidate
              )
              failed_candidate = failure.get('candidateSetId')
              failed_signing = failure.get('signingRunId')
              failed_publish = failure.get('publishRunId')
              if (
                  not already_published
                  and failed_candidate == promoted_candidate
                  and isinstance(failed_candidate, str)
                  and len(failed_candidate) == 64
                  and all(ch in '0123456789abcdef' for ch in failed_candidate)
                  and isinstance(failed_signing, int)
                  and failed_signing > 0
                  and isinstance(failed_publish, int)
                  and failed_publish > 0
              ):
                  available = True
                  candidate = failed_candidate
                  signing_run_id = str(failed_signing)
                  publish_run_id = str(failed_publish)

          print(f"available={'true' if available else 'false'}")
          print(f"candidate_set_id={candidate}")
          print(f"signing_run_id={signing_run_id}")
          print(f"publish_run_id={publish_run_id}")
          PY

      - name: Validate exact Owner-authorized failed run
        id: validate
        if: steps.target.outputs.available == 'true'
        env:
          CANDIDATE_SET_ID: ${{ steps.target.outputs.candidate_set_id }}
          SIGNING_RUN_ID: ${{ steps.target.outputs.signing_run_id }}
          PUBLISH_RUN_ID: ${{ steps.target.outputs.publish_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SET_ID" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SIGNING_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$PUBLISH_RUN_ID" =~ ^[0-9]+$ ]]

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISH_RUN_ID" > "$RUNNER_TEMP/publish-run.json"
          python3 - "$RUNNER_TEMP/publish-run.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          run = json.load(open(sys.argv[1], encoding='utf-8'))
          expected = {
              'event': 'workflow_dispatch',
              'head_branch': 'main',
              'conclusion': 'failure',
              'path': '.github/workflows/source-lab-publish-candidate.yml',
          }
          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit(f"failed publish run {key} mismatch: {run.get(key)!r}")
          if run.get('status') != 'completed':
              raise SystemExit('failed publish run is not completed')
          if str(run.get('actor', {}).get('id')) != os.environ['EXPECTED_OWNER_ID']:
              raise SystemExit('failed publish run was not Owner-authorized')
          if run.get('display_title') != f"Source Lab publish {os.environ['CANDIDATE_SET_ID']}":
              raise SystemExit('failed publish candidate title mismatch')
          attempt = run.get('run_attempt')
          if not isinstance(attempt, int) or attempt < 1:
              raise SystemExit('failed publish run attempt is invalid')
          retry = attempt < int(os.environ['MAX_PUBLISH_ATTEMPTS'])
          print(f"before_attempt={attempt}")
          print(f"retry={'true' if retry else 'false'}")
          PY

      - name: Rerun exact Owner-authorized publish
        id: rerun
        if: >-
          steps.target.outputs.available == 'true' &&
          steps.validate.outputs.retry == 'true'
        env:
          PUBLISH_RUN_ID: ${{ steps.target.outputs.publish_run_id }}
          BEFORE_ATTEMPT: ${{ steps.validate.outputs.before_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISH_RUN_ID/rerun" >/dev/null

          new_attempt=""
          for _ in $(seq 1 90); do
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISH_RUN_ID")"
            attempt="$(jq -r '.run_attempt' <<<"$payload")"
            status="$(jq -r '.status' <<<"$payload")"
            if [[ "$attempt" =~ ^[0-9]+$ ]] && (( attempt > BEFORE_ATTEMPT )); then
              new_attempt="$attempt"
              echo "Publish recovery attempt $new_attempt started with status $status."
              break
            fi
            sleep 2
          done
          [[ "$new_attempt" =~ ^[0-9]+$ ]]
          (( new_attempt == BEFORE_ATTEMPT + 1 ))

          conclusion=""
          for _ in $(seq 1 720); do
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISH_RUN_ID")"
            attempt="$(jq -r '.run_attempt' <<<"$payload")"
            status="$(jq -r '.status' <<<"$payload")"
            if [[ "$attempt" == "$new_attempt" && "$status" == "completed" ]]; then
              conclusion="$(jq -r '.conclusion' <<<"$payload")"
              break
            fi
            sleep 10
          done
          [[ "$conclusion" == "success" ]] || {
            echo "Automatic publish recovery attempt $new_attempt failed: $conclusion" >&2
            exit 1
          }

      - name: Recovery summary
        if: always()
        env:
          AVAILABLE: ${{ steps.target.outputs.available }}
          CANDIDATE_SET_ID: ${{ steps.target.outputs.candidate_set_id }}
          PUBLISH_RUN_ID: ${{ steps.target.outputs.publish_run_id }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
          RETRY: ${{ steps.validate.outputs.retry }}
          BEFORE_ATTEMPT: ${{ steps.validate.outputs.before_attempt }}
          RERUN_OUTCOME: ${{ steps.rerun.outcome }}
        shell: bash
        run: |
          {
            echo '## Source Lab publish recovery'
            if [[ "$AVAILABLE" != "true" ]]; then
              echo 'No exact failed signed provider publish is waiting for recovery.'
            elif [[ "$VALIDATION_OUTCOME" != "success" ]]; then
              echo 'Recovery target failed provenance validation; no rerun was authorized.'
              echo "Candidate: $CANDIDATE_SET_ID"
            elif [[ "$RETRY" != "true" ]]; then
              echo "Recovery remains fail-closed: publish run $PUBLISH_RUN_ID reached the automatic retry limit after attempt $BEFORE_ATTEMPT."
              echo "Candidate: $CANDIDATE_SET_ID"
            elif [[ "$RERUN_OUTCOME" == "success" ]]; then
              echo "Exact Owner-authorized publish run $PUBLISH_RUN_ID was recovered automatically."
              echo "Candidate: $CANDIDATE_SET_ID"
            else
              echo "Automatic recovery was attempted for publish run $PUBLISH_RUN_ID but did not complete successfully."
              echo "Candidate: $CANDIDATE_SET_ID"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
