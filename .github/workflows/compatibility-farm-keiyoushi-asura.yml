name: Compatibility Farm Keiyoushi Asura

on:
  push:
    branches:
      - cf-keiyoushi-final
    paths:
      - 'compatibility/source-registry.json'
      - 'compatibility/harness/keiyoushi/KeiyoushiAsuraScansParserHarnessTest.kt'
      - 'compatibility/harness/keiyoushi/runtime/**'
      - 'tools/parser_harness_report.py'
      - '.github/workflows/compatibility-farm-keiyoushi-asura.yml'

permissions:
  contents: read

concurrency:
  group: compatibility-farm-keiyoushi-asura-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-parser-asura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: provider-ref
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path('compatibility/source-registry.json').read_text())
          print(f"keiyoushi={data['providerBaselines']['keiyoushi']}")
          PY
      - uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: ${{ steps.provider-ref.outputs.keiyoushi }}
          path: _upstream/keiyoushi
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install deterministic Asura harness
        shell: bash
        run: |
          set -euo pipefail
          module=_upstream/keiyoushi/src/en/asurascans
          mkdir -p "$module/compatibility-farm-test"
          cp compatibility/harness/keiyoushi/KeiyoushiAsuraScansParserHarnessTest.kt "$module/compatibility-farm-test/"
          cp -R compatibility/harness/keiyoushi/runtime/. "$module/compatibility-farm-test/"
          cat >> "$module/build.gradle.kts" <<'EOF'

          android {
              sourceSets {
                  named("test") {
                      java.directories.add("compatibility-farm-test")
                      kotlin.directories.add("compatibility-farm-test")
                  }
              }
              testOptions { unitTests.isReturnDefaultValues = true }
          }
          dependencies {
              testImplementation(libs.junit)
              testImplementation(libs.bundles.common)
          }
          tasks.matching { it.name == "kspDebugUnitTestKotlin" }.configureEach { enabled = false }
          EOF
      - name: Execute real Keiyoushi Asura parser
        working-directory: _upstream/keiyoushi
        run: |
          chmod +x gradlew
          ./gradlew :src:en:asurascans:testDebugUnitTest --tests compatibilityfarm.KeiyoushiAsuraScansParserHarnessTest --no-daemon
      - name: Normalize evidence
        if: always()
        run: >-
          python3 tools/parser_harness_report.py
          --registry compatibility/source-registry.json
          --results-dir _upstream/keiyoushi/src/en/asurascans/build/test-results/testDebugUnitTest
          --provider keiyoushi
          --source miyorare:miyorare-en:ASURASCANS=compatibilityfarm.KeiyoushiAsuraScansParserHarnessTest
          --output build/real-parser-harness-keiyoushi-asura-report.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-farm-keiyoushi-asura-report
          path: |
            build/real-parser-harness-keiyoushi-asura-report.json
            _upstream/keiyoushi/src/en/asurascans/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 14
