name: Source Pack Autonomous Release Control
run-name: Source Pack control ${{ inputs.request_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: Release request mode
        required: false
        default: automatic
        type: choice
        options:
          - automatic
          - source_lab_signed
      candidate_set_id:
        description: Exact Source Lab candidateSetId for a signed release request
        required: false
        type: string
      signing_run_id:
        description: Exact successful Source Lab signing run for a signed release request
        required: false
        type: string
      release_ref:
        description: Temporary ref bound to the exact signed Foundation commit
        required: false
        type: string
      foundation_commit:
        description: Exact signed Foundation commit
        required: false
        type: string
      request_id:
        description: Unique Source Lab request correlation identifier
        required: false
        type: string
      request_run_id:
        description: Exact Source Lab publish workflow run that issued the request
        required: false
        type: string
      authorization_run_id:
        description: Original Owner-authorized Source Lab Publish run for this signed request lineage
        required: false
        type: string
  schedule:
    - cron: '13,43 * * * *'
  push:
    branches:
      - main
    paths:
      - 'compatibility/miyorare-builder-baseline.json'
      - '.github/workflows/source-pack-autonomous-release.yml'
      - '.github/workflows/release-source-packs.yml'

permissions:
  actions: write
  attestations: read
  contents: write
  pull-requests: write

concurrency:
  group: source-pack-autonomous-release-control
  cancel-in-progress: false

jobs:
  control:
    if: github.event_name != 'workflow_dispatch' || inputs.release_mode != 'source_lab_signed'
    name: Promote validated builder and release changed packs
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      MIYORARE_REPOSITORY: Noirero/Miyorare
      FARM_BRANCH: compatibility-farm-foundation
    steps:
      - name: Checkout Source Packs control plane
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          path: control
          fetch-depth: 0

      - name: Checkout authoritative Compatibility Farm
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: compatibility-farm-foundation
          path: farm
          fetch-depth: 1

      - name: Checkout Miyorare beta lineage
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Noirero/Miyorare
          ref: beta
          path: miyorare-beta
          fetch-depth: 0

      - name: Resolve approved provider fingerprint
        id: providers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          registry = json.loads(Path("farm/compatibility/source-registry.json").read_text(encoding="utf-8"))
          status = json.loads(Path("farm/upstream/status.json").read_text(encoding="utf-8"))
          farm_registry = json.loads(Path("farm/upstream/registry.json").read_text(encoding="utf-8"))
          baselines = registry.get("providerBaselines", {})
          providers = status.get("providers", {})
          registry_providers = farm_registry.get("providers", {})
          if status.get("schema") != 3:
              raise SystemExit("Farm status schema must be 3")
          for provider in ("uma", "gekkoushi", "keiyoushi"):
              commit = baselines.get(provider)
              state = providers.get(provider)
              reg = registry_providers.get(provider)
              if not isinstance(commit, str) or len(commit) != 40:
                  raise SystemExit(f"invalid Farm baseline for {provider}")
              if not isinstance(state, dict) or state.get("activeCommit") != commit or state.get("lastKnownGood") != commit:
                  raise SystemExit(f"{provider} approved baseline is not active/LKG")
              if not isinstance(reg, dict) or reg.get("lastKnownGood") != commit:
                  raise SystemExit(f"{provider} Farm upstream registry mismatch")
              print(f"{provider}={commit}")
          PY

      - name: Resolve last manifest-changing beta commit
        id: builder
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git -C miyorare-beta log -1 --format=%H -- extensions/miyorare-sources/packs.json)"
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          baseline="$(python3 control/tools/validate_builder_baseline.py --baseline control/compatibility/miyorare-builder-baseline.json --contract control/compatibility/miyorare-source-pack-contract.v1.json --print-commit)"
          [[ "$baseline" =~ ^[0-9a-f]{40}$ ]]
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          mkdir -p build
          git -C miyorare-beta show "$candidate:extensions/miyorare-sources/packs.json" > build/candidate-packs.json
          if ! git -C miyorare-beta cat-file -e "$baseline^{commit}" 2>/dev/null; then
            git -C miyorare-beta fetch origin "$baseline"
          fi
          git -C miyorare-beta show "$baseline:extensions/miyorare-sources/packs.json" > build/baseline-packs.json
          if cmp --silent build/candidate-packs.json build/baseline-packs.json; then
            echo "manifest_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "manifest_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require candidate manifest to be fully synchronized with Farm
        id: sync
        if: steps.builder.outputs.manifest_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp build/candidate-packs.json build/verified-candidate-packs.json
          test -f miyorare-beta/extensions/miyorare-sources/tools/sync_approved_farm_sources.py
          python3 miyorare-beta/extensions/miyorare-sources/tools/sync_approved_farm_sources.py --registry farm/compatibility/source-registry.json --packs build/verified-candidate-packs.json --report build/candidate-farm-sync-report.json
          cmp --silent build/candidate-packs.json build/verified-candidate-packs.json || { echo "Miyorare beta packs.json is not caught up with authoritative ACTIVE Farm membership." >&2; exit 1; }

      - name: Require successful Miyorare pack checks on candidate commit
        if: steps.builder.outputs.manifest_changed == 'true'
        env:
          CANDIDATE_SHA: ${{ steps.builder.outputs.candidate }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$MIYORARE_REPOSITORY/commits/$CANDIDATE_SHA/check-runs?per_page=100" -o build/miyorare-candidate-checks.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("build/miyorare-candidate-checks.json").read_text(encoding="utf-8"))
          required = {"verify-identity", "Build Miyorare-id", "Build Miyorare-en", "Build Miyorare-Global"}
          conclusions = {}
          for run in data.get("check_runs", []):
              name = run.get("name")
              if name in required:
                  conclusions[name] = run.get("conclusion")
          missing = sorted(required - set(conclusions))
          failed = {name: value for name, value in conclusions.items() if value != "success"}
          if missing or failed:
              raise SystemExit(f"candidate checks not ready: missing={missing}, non_success={failed}")
          PY

      - name: Promote exact manifest commit into pinned builder baseline
        if: steps.builder.outputs.manifest_changed == 'true'
        id: promote
        env:
          CANDIDATE_SHA: ${{ steps.builder.outputs.candidate }}
        shell: bash
        run: |
          set -euo pipefail
          tsuki_api="$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("build/candidate-packs.json").read_text(encoding="utf-8"))["tsukiApi"])
          PY
          )"
          python3 - "$CANDIDATE_SHA" "$tsuki_api" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path("control/compatibility/miyorare-builder-baseline.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          contract = json.loads(Path("control/compatibility/miyorare-source-pack-contract.v1.json").read_text(encoding="utf-8"))
          candidate, tsuki_api = sys.argv[1:3]
          expected_api = contract["compatibility"]["tsukiApi"]
          expected_epoch = contract["compatibility"]["compatibilityEpoch"]
          if tsuki_api != expected_api:
              raise SystemExit("candidate Tsuki API differs from stable compatibility contract")
          data["builderCommit"] = candidate
          data["tsukiApi"] = expected_api
          data["compatibilityEpoch"] = expected_epoch
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          branch="automation/builder-baseline-${CANDIDATE_SHA:0:12}-$GITHUB_RUN_ID"
          git -C control switch -c "$branch"
          git -C control config user.name 'github-actions[bot]'
          git -C control config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C control add compatibility/miyorare-builder-baseline.json
          git -C control diff --cached --quiet && { echo "Builder baseline promotion produced no diff." >&2; exit 1; }
          git -C control commit -m "Promote validated Miyorare pack builder baseline"
          git -C control push origin "HEAD:$branch"
          head_sha="$(git -C control rev-parse HEAD)"
          url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "Promote validated Miyorare pack builder baseline" --body "Automated promotion of exact Miyorare beta manifest commit `$CANDIDATE_SHA` after Farm synchronization and ID/EN/Global pack checks passed.")"
          number="$(gh pr view "$url" --repo "$GITHUB_REPOSITORY" --json number --jq '.number')"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "pr_number=$number" >> "$GITHUB_OUTPUT"
          echo "pr_url=$url" >> "$GITHUB_OUTPUT"

      - name: Validate promoted builder baseline on exact PR head
        if: steps.builder.outputs.manifest_changed == 'true'
        id: baseline_ci
        env:
          BRANCH: ${{ steps.promote.outputs.branch }}
          HEAD_SHA: ${{ steps.promote.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          previous="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow source-pack-builder-baseline.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run source-pack-builder-baseline.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow source-pack-builder-baseline.yml --branch "$BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$HEAD_SHA\" and .databaseId != $previous) | .databaseId" | head -n 1)"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          [[ -n "$run_id" ]]
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10

      - name: Merge validated builder baseline promotion
        if: steps.builder.outputs.manifest_changed == 'true'
        env:
          PR_NUMBER: ${{ steps.promote.outputs.pr_number }}
          HEAD_SHA: ${{ steps.promote.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          live="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          [[ "$live" == "$HEAD_SHA" ]]
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          merged="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergedAt --jq '.mergedAt')"
          [[ -n "$merged" && "$merged" != "null" ]]

      - name: Resolve desired stable release fingerprint
        id: desired
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.builder.outputs.manifest_changed }}" == "true" ]]; then builder="${{ steps.builder.outputs.candidate }}"; else builder="${{ steps.builder.outputs.baseline }}"; fi
          echo "builder=$builder" >> "$GITHUB_OUTPUT"
          python3 - "$builder" "${{ steps.providers.outputs.uma }}" "${{ steps.providers.outputs.gekkoushi }}" "${{ steps.providers.outputs.keiyoushi }}" <<'PY' > build/desired-release-fingerprint.json
          import json, sys
          builder, uma, gekkoushi, keiyoushi = sys.argv[1:5]
          print(json.dumps({"sourceCommit": builder, "upstreams": {"uma": uma, "gekkoushi": gekkoushi, "keiyoushi": keiyoushi}}, indent=2, sort_keys=True))
          PY

      - name: Compare against latest published Source Pack release
        id: release_need
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/latest-release
          mkdir -p build/latest-release
          latest="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,isPrerelease,publishedAt --jq '[.[] | select(.isDraft == false and .isPrerelease == false and (.tagName | startswith("miyorare-sources-v")))] | sort_by(.publishedAt) | reverse | .[0].tagName // ""')"
          echo "latest_tag=$latest" >> "$GITHUB_OUTPUT"
          if [[ -z "$latest" ]]; then echo "needed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          gh release download "$latest" --repo "$GITHUB_REPOSITORY" --pattern miyorare-source-packs.json --dir build/latest-release
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          desired = json.loads(Path("build/desired-release-fingerprint.json").read_text(encoding="utf-8"))
          current = json.loads(Path("build/latest-release/miyorare-source-packs.json").read_text(encoding="utf-8"))
          actual = {"sourceCommit": current.get("sourceCommit"), "upstreams": current.get("upstreams")}
          snapshot_id = current.get("compatibilitySnapshotId")
          has_snapshot = isinstance(snapshot_id, str) and len(snapshot_id) == 64 and all(c in "0123456789abcdef" for c in snapshot_id.lower())
          print("needed=" + ("false" if actual == desired and has_snapshot else "true"))
          PY

      - name: Clean stale queued releases and refuse duplicate active release
        if: steps.release_need.outputs.needed == 'true'
        id: active_release
        shell: bash
        run: |
          set -euo pipefail
          now_epoch="$(date -u +%s)"
          stale_before="$((now_epoch - 21600))"
          mapfile -t stale_queued < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-source-packs.yml --limit 100 --json status,databaseId,createdAt --jq ".[] | select(.status == \"queued\") | select((.createdAt | fromdateiso8601) < $stale_before) | .databaseId")
          for run_id in "${stale_queued[@]}"; do gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true; done
          active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-source-packs.yml --limit 100 --json status,databaseId,createdAt --jq "[.[] | select(.status == \"in_progress\" or (.status == \"queued\" and ((.createdAt | fromdateiso8601) >= $stale_before)))] | length")"
          echo "count=$active" >> "$GITHUB_OUTPUT"
          [[ "$active" == "0" ]] || { echo "A fresh Source Pack release is already queued/running; next control run will re-evaluate." >&2; exit 0; }

      - name: Compute next immutable patch version
        if: steps.release_need.outputs.needed == 'true' && steps.active_release.outputs.count == '0'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | sed -n 's/^miyorare-sources-v//p' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [[ -z "$version" ]]; then next="0.1.0"; else IFS='.' read -r major minor patch <<< "$version"; next="$major.$minor.$((patch + 1))"; fi
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Dispatch sealed stable Source Pack release
        if: steps.release_need.outputs.needed == 'true' && steps.active_release.outputs.count == '0'
        id: dispatch
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="$(gh workflow run release-source-packs.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION")"
          run_id="${run_url##*/}"
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "Could not resolve the newly dispatched Source Pack release run ID from: $run_url" >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for build, seal, attestation, and stable publish
        if: steps.dispatch.outputs.run_id != ''
        env:
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 20

      - name: Upload autonomous release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-pack-autonomous-release-${{ github.run_id }}
          path: |
            build/candidate-packs.json
            build/baseline-packs.json
            build/candidate-farm-sync-report.json
            build/miyorare-candidate-checks.json
            build/desired-release-fingerprint.json
            build/latest-release/miyorare-source-packs.json
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '## Autonomous Source Pack control' >> "$GITHUB_STEP_SUMMARY"
          echo "Current pinned builder: ${{ steps.builder.outputs.baseline }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Latest beta manifest commit: ${{ steps.builder.outputs.candidate }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Manifest promotion needed: ${{ steps.builder.outputs.manifest_changed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Desired UMA: ${{ steps.providers.outputs.uma }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Desired Gekkoushi: ${{ steps.providers.outputs.gekkoushi }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Desired Keiyoushi: ${{ steps.providers.outputs.keiyoushi }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Release needed: ${{ steps.release_need.outputs.needed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Release version: ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

  signed_source_lab_release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_mode == 'source_lab_signed'
    name: Validate signed Source Lab request and release exact commit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_OWNER_ID: '149634319'
      EXPECTED_AUTOMATION_ID: '41898282'
      CANDIDATE_SET_ID: ${{ inputs.candidate_set_id }}
      SIGNING_RUN_ID: ${{ inputs.signing_run_id }}
      RELEASE_REF: ${{ inputs.release_ref }}
      FOUNDATION_COMMIT: ${{ inputs.foundation_commit }}
      REQUEST_ID: ${{ inputs.request_id }}
      REQUEST_RUN_ID: ${{ inputs.request_run_id }}
      AUTHORIZATION_RUN_ID: ${{ inputs.authorization_run_id }}
    steps:
      - name: Fail closed on signed release request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "Noirero/Miyorare-Source-Packs" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_ACTOR_ID" == "$EXPECTED_OWNER_ID" || "$GITHUB_ACTOR_ID" == "$EXPECTED_AUTOMATION_ID" ]]
          [[ "$CANDIDATE_SET_ID" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SIGNING_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$REQUEST_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$AUTHORIZATION_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_REF" =~ ^source-lab-publish-[0-9]+$ ]]
          [[ "$FOUNDATION_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUEST_ID" == "source-lab-${REQUEST_RUN_ID}-${CANDIDATE_SET_ID}" ]]

      - name: Verify authorized Source Lab request run
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REQUEST_RUN_ID" > "$RUNNER_TEMP/request-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AUTHORIZATION_RUN_ID" > "$RUNNER_TEMP/authorization-run.json"
          python3 - "$RUNNER_TEMP/request-run.json" "$RUNNER_TEMP/authorization-run.json" <<'PY'
          import json, os, sys
          request = json.load(open(sys.argv[1], encoding="utf-8"))
          authorization = json.load(open(sys.argv[2], encoding="utf-8"))
          expected = {
              "event": "workflow_dispatch",
              "head_branch": "main",
              "path": ".github/workflows/source-lab-publish-candidate.yml",
              "display_title": f"Source Lab publish {os.environ['CANDIDATE_SET_ID']}",
          }
          for key, value in expected.items():
              if request.get(key) != value:
                  raise SystemExit(f"Source Lab request run {key} mismatch: {request.get(key)!r}")
          if str(request.get("id")) != os.environ["REQUEST_RUN_ID"]:
              raise SystemExit("Source Lab request run ID mismatch")
          if request.get("status") != "in_progress":
              raise SystemExit(f"Source Lab request run is not active: {request.get('status')!r}")

          request_actor = str(request.get("actor", {}).get("id"))
          if request_actor == os.environ["EXPECTED_OWNER_ID"]:
              if os.environ["AUTHORIZATION_RUN_ID"] != os.environ["REQUEST_RUN_ID"]:
                  raise SystemExit("direct Owner Publish authorization run must equal request run")
              if authorization.get("id") != request.get("id"):
                  raise SystemExit("direct Owner Publish authorization payload mismatch")
          elif request_actor == os.environ["EXPECTED_AUTOMATION_ID"]:
              if os.environ["AUTHORIZATION_RUN_ID"] == os.environ["REQUEST_RUN_ID"]:
                  raise SystemExit("automated recovery must reference a distinct Owner authorization run")
              for key, value in expected.items():
                  if authorization.get(key) != value:
                      raise SystemExit(f"Owner authorization run {key} mismatch: {authorization.get(key)!r}")
              if authorization.get("status") != "completed" or authorization.get("conclusion") != "failure":
                  raise SystemExit("Owner authorization run is not a completed failed Publish")
              if str(authorization.get("id")) != os.environ["AUTHORIZATION_RUN_ID"]:
                  raise SystemExit("Owner authorization run ID mismatch")
              if str(authorization.get("actor", {}).get("id")) != os.environ["EXPECTED_OWNER_ID"]:
                  raise SystemExit("automated recovery is not bound to the authorized Owner Publish")
          else:
              raise SystemExit("Source Lab request run actor is neither Owner nor authorized automation")
          PY

      - name: Verify exact successful signing run
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SIGNING_RUN_ID" > "$RUNNER_TEMP/signing-run.json"
          python3 - "$RUNNER_TEMP/signing-run.json" <<'PY'
          import json, os, sys
          run = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {"event": "workflow_dispatch", "head_branch": "main", "conclusion": "success", "path": ".github/workflows/source-lab-sign-candidate.yml"}
          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit(f"signing run {key} mismatch: {run.get(key)!r}")
          if str(run.get("actor", {}).get("id")) != os.environ["EXPECTED_OWNER_ID"]:
              raise SystemExit("signing run actor mismatch")
          if run.get("display_title") != f"Source Lab sign {os.environ['CANDIDATE_SET_ID']}":
              raise SystemExit("signing run candidate title mismatch")
          PY

      - name: Download exact attested signing material
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: source-lab-signature-${{ inputs.candidate_set_id }}
          path: build/signature
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.signing_run_id }}

      - name: Validate exact signed Foundation binding
        shell: bash
        run: |
          set -euo pipefail
          receipt="$(find build/signature -type f -name source-lab-signing-receipt.json -print -quit)"
          manifest="$(find build/signature -type f -name source-lab-signing-manifest.json -print -quit)"
          checksum="$(find build/signature -type f -name source-lab-signing-manifest.sha256 -print -quit)"
          [[ -n "$receipt" && -n "$manifest" && -n "$checksum" ]]
          cp "$receipt" build/source-lab-signing-receipt.json
          cp "$manifest" build/source-lab-signing-manifest.json
          cp "$checksum" build/source-lab-signing-manifest.sha256
          (cd build && sha256sum -c source-lab-signing-manifest.sha256)
          gh attestation verify build/source-lab-signing-manifest.json --repo "$GITHUB_REPOSITORY"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          receipt = json.loads(Path("build/source-lab-signing-receipt.json").read_text(encoding="utf-8"))
          manifest_path = Path("build/source-lab-signing-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if receipt.get("schemaVersion") != 1 or receipt.get("action") != "SIGN": raise SystemExit("invalid signing receipt")
          if receipt.get("state") != "ATTESTED" or receipt.get("publishEligible") is not True: raise SystemExit("signing receipt is not publish eligible")
          if receipt.get("candidateSetId") != os.environ["CANDIDATE_SET_ID"]: raise SystemExit("signing receipt candidate mismatch")
          if receipt.get("signingRunId") != int(os.environ["SIGNING_RUN_ID"]): raise SystemExit("signing receipt run mismatch")
          if manifest.get("candidateSetId") != receipt.get("candidateSetId"): raise SystemExit("manifest candidate mismatch")
          if manifest.get("foundationCommit") != receipt.get("foundationCommit"): raise SystemExit("manifest foundation commit mismatch")
          if manifest.get("providers") != receipt.get("providers"): raise SystemExit("manifest provider pins mismatch")
          if receipt.get("foundationCommit") != os.environ["FOUNDATION_COMMIT"]: raise SystemExit("requested Foundation commit differs from signed receipt")
          if hashlib.sha256(manifest_path.read_bytes()).hexdigest() != receipt.get("manifestSha256"): raise SystemExit("signing manifest digest mismatch")
          PY
          ref_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$RELEASE_REF" --jq '.object.sha')"
          [[ "$ref_sha" == "$FOUNDATION_COMMIT" ]] || { echo "temporary release ref no longer points to the exact signed Foundation commit" >&2; exit 1; }

      - name: Clean stale queued releases and refuse duplicate active publisher
        shell: bash
        run: |
          set -euo pipefail
          now_epoch="$(date -u +%s)"
          stale_before="$((now_epoch - 21600))"
          mapfile -t stale_queued < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-source-packs.yml --limit 100 --json status,databaseId,createdAt --jq ".[] | select(.status == \"queued\") | select((.createdAt | fromdateiso8601) < $stale_before) | .databaseId")
          for run_id in "${stale_queued[@]}"; do gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true; done
          active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-source-packs.yml --limit 100 --json status,databaseId,createdAt --jq "[.[] | select(.status == \"in_progress\" or (.status == \"queued\" and ((.createdAt | fromdateiso8601) >= $stale_before)))] | length")"
          [[ "$active" == "0" ]] || { echo "A fresh Source Pack publisher run is already queued/running." >&2; exit 1; }

      - name: Allocate next immutable stable version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | sed -n 's/^miyorare-sources-v//p' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [[ -z "$version" ]]; then next="0.1.0"; else IFS='.' read -r major minor patch <<< "$version"; next="$major.$minor.$((patch + 1))"; fi
          if gh release view "miyorare-sources-v$next" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "Resolved release version already exists." >&2; exit 1; fi
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Dispatch sole Source Pack publisher on exact signed ref
        id: dispatch
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          started_epoch="$(date -u +%s)"
          gh workflow run release-source-packs.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_REF" -f version="$VERSION"
          run_id=""
          for _ in $(seq 1 90); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-source-packs.yml --branch "$RELEASE_REF" --event workflow_dispatch --limit 30 --json databaseId,headSha,createdAt --jq "[.[] | select(.headSha == \"$FOUNDATION_COMMIT\") | select((.createdAt | fromdateiso8601) >= ($started_epoch - 5))] | sort_by(.databaseId) | last | .databaseId // empty")"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 20

      - name: Verify immutable release and emit controller result
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          tag="miyorare-sources-v$VERSION"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,url > build/release.json
          [[ "$(jq -r '.tagName' build/release.json)" == "$tag" ]]
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = {
              "schemaVersion": 1,
              "requestId": os.environ["REQUEST_ID"],
              "requestRunId": int(os.environ["REQUEST_RUN_ID"]),
              "authorizationRunId": int(os.environ["AUTHORIZATION_RUN_ID"]),
              "candidateSetId": os.environ["CANDIDATE_SET_ID"],
              "signingRunId": int(os.environ["SIGNING_RUN_ID"]),
              "controllerRunId": int(os.environ["GITHUB_RUN_ID"]),
              "releaseRunId": int(os.environ["RELEASE_RUN_ID"]),
              "foundationCommit": os.environ["FOUNDATION_COMMIT"],
              "releaseRef": os.environ["RELEASE_REF"],
              "version": os.environ["VERSION"],
              "tag": f"miyorare-sources-v{os.environ['VERSION']}",
          }
          Path("build/source-pack-signed-release-result.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload signed release result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-pack-signed-release-${{ inputs.candidate_set_id }}
          path: |
            build/source-pack-signed-release-result.json
            build/source-lab-signing-receipt.json
            build/source-lab-signing-manifest.json
            build/release.json
          if-no-files-found: error
          retention-days: 30
