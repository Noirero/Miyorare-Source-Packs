name: Source Lab Expected Candidate Lock CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/source-lab-run-farm.yml'
      - '.github/workflows/source-lab-expected-candidate-lock-ci.yml'

permissions:
  contents: read

jobs:
  expected-candidate-lock:
    name: Prove locked candidate replay and rejection behavior
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Execute embedded candidate-scope helper against advanced head and invalid candidate
        shell: python {0}
        run: |
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          workflow = Path('.github/workflows/source-lab-run-farm.yml').read_text(encoding='utf-8')
          start_marker = "helper.write_text(r'''"
          end_marker = "          '''.replace("
          start = workflow.find(start_marker)
          if start < 0:
              raise SystemExit('candidate-scope helper start marker not found')
          start += len(start_marker)
          end = workflow.find(end_marker, start)
          if end < 0:
              raise SystemExit('candidate-scope helper end marker not found')

          helper_source = workflow[start:end]
          helper_source = helper_source.replace('\n          ', '\n').lstrip('\n')
          expected = '23345ef345e3b20d7fcc0b5d8fdc922d025af47f'
          advanced_head = '7363e4298c2a6cc4e32e6ef6af2d48611d5b619e'
          invalid = '0' * 40
          base = '2025891752e4705effc28e87a043f7205014cde3'
          repository = 'keiyoushi/extensions-source'
          helper_source = helper_source.replace('__VERIFIED_REPOSITORY__', repr(repository)).replace('__VERIFIED_BASE__', repr(base)).replace('__VERIFIED_CANDIDATE__', repr(expected))

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              helper = root / 'source_lab_scope_plan.py'
              helper.write_text(helper_source, encoding='utf-8')

              def write_plan(candidate):
                  plan = {
                      'providers': {
                          'keiyoushi': {
                              'repository': repository,
                              'changed': True,
                              'candidate': candidate,
                              'lastKnownGood': base,
                          },
                          'uma': {
                              'repository': 'InvalidDavid/UMA',
                              'changed': False,
                              'candidate': '1' * 40,
                              'lastKnownGood': '1' * 40,
                          },
                          'gekkoushi': {
                              'repository': 'Gekkoushi/plugin-source',
                              'changed': False,
                              'candidate': '2' * 40,
                              'lastKnownGood': '2' * 40,
                          },
                      }
                  }
                  path = root / 'plan.json'
                  path.write_text(json.dumps(plan), encoding='utf-8')
                  return path

              replayed = subprocess.run(
                  [sys.executable, str(helper), '--plan', str(write_plan(advanced_head)),
                   '--provider', 'keiyoushi', '--expected-candidate', expected],
                  text=True, capture_output=True,
              )
              if replayed.returncode != 0:
                  raise SystemExit(
                      f'locked historical candidate was rejected after upstream advanced: stdout={replayed.stdout!r} stderr={replayed.stderr!r}'
                  )
              replay_plan = json.loads((root / 'plan.json').read_text(encoding='utf-8'))
              selected = replay_plan['providers']['keiyoushi']
              if selected['candidate'] != expected or selected.get('liveCandidate') != advanced_head:
                  raise SystemExit(f'locked replay did not preserve expected/live candidate identity: {selected!r}')

              rejected = subprocess.run(
                  [sys.executable, str(helper), '--plan', str(write_plan(advanced_head)),
                   '--provider', 'keiyoushi', '--expected-candidate', invalid],
                  text=True, capture_output=True,
              )
              if rejected.returncode == 0:
                  raise SystemExit('invalid/unverified candidate was incorrectly accepted')

              wrong_base_plan = write_plan(advanced_head)
              wrong_base_data = json.loads(wrong_base_plan.read_text(encoding='utf-8'))
              wrong_base_data['providers']['keiyoushi']['lastKnownGood'] = '3' * 40
              wrong_base_plan.write_text(json.dumps(wrong_base_data), encoding='utf-8')
              wrong_base = subprocess.run(
                  [sys.executable, str(helper), '--plan', str(wrong_base_plan),
                   '--provider', 'keiyoushi', '--expected-candidate', expected],
                  text=True, capture_output=True,
              )
              if wrong_base.returncode == 0:
                  raise SystemExit('post-verification LKG drift was incorrectly accepted')

          print('expected candidate lock: preverified historical SHA replayed; invalid candidate and LKG drift rejected fail-closed')
