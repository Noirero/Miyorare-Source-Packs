name: Source Lab CI (Internal)

on:
  push:
    branches:
      - 'source-lab-*'
    paths:
      - 'source-lab/**'
      - '.github/workflows/source-lab-ci.yml'
  pull_request:
    paths:
      - 'source-lab/**'
      - '.github/workflows/source-lab-ci.yml'

permissions:
  contents: read

concurrency:
  group: source-lab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  internal-debug-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate official public GitHub App Client ID
        shell: bash
        env:
          OFFICIAL_CLIENT_ID: Iv23lijwK22xASXNEBkP
        run: |
          set -euo pipefail
          CLIENT_ID="$(printf '%s' "$OFFICIAL_CLIENT_ID" | xargs)"
          if [ -z "$CLIENT_ID" ]; then
            echo "::error::Official Source Lab GitHub App Client ID is missing."
            exit 1
          elif [[ "$CLIENT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Official Source Lab GitHub App Client ID must not be numeric."
            exit 1
          elif [[ ! "$CLIENT_ID" =~ ^[A-Za-z0-9._-]{10,128}$ ]]; then
            echo "::error::Official Source Lab GitHub App Client ID has an invalid format."
            exit 1
          fi
          echo "Official Source Lab GitHub App Client ID is valid."

      - name: Run internal debug checks
        run: gradle -p source-lab :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Mark debug build as internal only
        shell: bash
        run: |
          set -euo pipefail
          test -s source-lab/app/build/outputs/apk/debug/app-debug.apk
          echo "Internal CI completed. Debug APK is intentionally not uploaded or published."
          echo "Only Source Lab Stable Release may publish the official APK."
