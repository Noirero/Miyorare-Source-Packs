name: Source Lab CI

on:
  push:
    branches:
      - source-lab-foundation
    paths:
      - 'source-lab/**'
      - '.github/workflows/source-lab-ci.yml'
  pull_request:
    paths:
      - 'source-lab/**'
      - '.github/workflows/source-lab-ci.yml'

permissions:
  contents: read

concurrency:
  group: source-lab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set monotonic Source Lab version
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_LAB_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "SOURCE_LAB_VERSION_NAME=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Prepare stable update signing
        id: signing
        shell: bash
        env:
          SOURCE_LAB_KEYSTORE_B64: ${{ secrets.SOURCE_LAB_KEYSTORE_B64 }}
          SOURCE_LAB_KEYSTORE_PASSWORD: ${{ secrets.SOURCE_LAB_KEYSTORE_PASSWORD }}
          SOURCE_LAB_KEY_ALIAS: ${{ secrets.SOURCE_LAB_KEY_ALIAS }}
          SOURCE_LAB_KEY_PASSWORD: ${{ secrets.SOURCE_LAB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${SOURCE_LAB_KEYSTORE_B64:-}" ] && \
             [ -n "${SOURCE_LAB_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${SOURCE_LAB_KEY_ALIAS:-}" ] && \
             [ -n "${SOURCE_LAB_KEY_PASSWORD:-}" ]; then
            KEYSTORE="$RUNNER_TEMP/miyorare-source-lab-update.jks"
            printf '%s' "$SOURCE_LAB_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
            chmod 600 "$KEYSTORE"
            echo "SOURCE_LAB_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
            echo "SOURCE_LAB_KEYSTORE_PASSWORD=$SOURCE_LAB_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SOURCE_LAB_KEY_ALIAS=$SOURCE_LAB_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SOURCE_LAB_KEY_PASSWORD=$SOURCE_LAB_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SOURCE_LAB_STABLE_SIGNING=true" >> "$GITHUB_ENV"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "SOURCE_LAB_STABLE_SIGNING=false" >> "$GITHUB_ENV"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable Source Lab signing secrets are not configured. Installable APK artifact will be withheld to avoid future signature conflicts."
          fi

      - name: Test, lint and assemble Source Lab debug APK
        run: gradle -p source-lab :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Verify stable APK signature
        if: steps.signing.outputs.stable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="source-lab/app/build/outputs/apk/debug/app-debug.apk"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload updateable Source Lab debug APK
        if: steps.signing.outputs.stable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: miyorare-source-lab-updateable-debug
          path: source-lab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Explain withheld APK
        if: steps.signing.outputs.stable != 'true'
        shell: bash
        run: |
          echo "Build/tests completed, but APK upload is intentionally withheld until stable signing secrets are configured."
          echo "This prevents users from installing APKs signed by different ephemeral CI debug keys."
