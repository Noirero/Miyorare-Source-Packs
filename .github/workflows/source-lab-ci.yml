name: Source Lab CI

on:
  push:
    branches:
      - source-lab-foundation
    paths:
      - 'source-lab/**'
      - '.github/workflows/source-lab-ci.yml'
  pull_request:
    paths:
      - 'source-lab/**'
      - '.github/workflows/source-lab-ci.yml'

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Assemble Source Lab debug APK
        run: gradle -p source-lab :app:assembleDebug --stacktrace
