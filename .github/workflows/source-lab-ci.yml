name: Source Lab CI

on:
  push:
    branches:
      - 'source-lab-*'
    paths:
      - 'source-lab/**'
      - '.github/workflows/source-lab-ci.yml'
  pull_request:
    paths:
      - 'source-lab/**'
      - '.github/workflows/source-lab-ci.yml'

permissions:
  contents: read

concurrency:
  group: source-lab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check public GitHub App client id configuration
        shell: bash
        env:
          SOURCE_LAB_GITHUB_CLIENT_ID: ${{ vars.SOURCE_LAB_GITHUB_CLIENT_ID }}
        run: |
          if [ -z "${SOURCE_LAB_GITHUB_CLIENT_ID:-}" ]; then
            echo "::warning::SOURCE_LAB_GITHUB_CLIENT_ID repository variable is not configured. Owner login will require the recovery Client ID field."
          elif [[ "$SOURCE_LAB_GITHUB_CLIENT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::SOURCE_LAB_GITHUB_CLIENT_ID must be the GitHub App Client ID, not a numeric App/Installation ID."
            exit 1
          else
            echo "Source Lab GitHub App Client ID is configured as public build configuration."
          fi

      - name: Test, lint and assemble Source Lab debug APK
        env:
          SOURCE_LAB_GITHUB_CLIENT_ID: ${{ vars.SOURCE_LAB_GITHUB_CLIENT_ID }}
        run: gradle -p source-lab :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload Source Lab debug APK
        uses: actions/upload-artifact@v4
        with:
          name: miyorare-source-lab-debug
          path: source-lab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare stable Source Lab signing key
        if: ${{ secrets.SOURCE_LAB_KEYSTORE_BASE64 != '' && secrets.SOURCE_LAB_STORE_PASSWORD != '' && secrets.SOURCE_LAB_KEY_ALIAS != '' && secrets.SOURCE_LAB_KEY_PASSWORD != '' }}
        shell: bash
        env:
          SOURCE_LAB_KEYSTORE_BASE64: ${{ secrets.SOURCE_LAB_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_LAB_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/source-lab-release.jks"
          chmod 600 "$RUNNER_TEMP/source-lab-release.jks"

      - name: Assemble stable signed Source Lab APK
        if: ${{ secrets.SOURCE_LAB_KEYSTORE_BASE64 != '' && secrets.SOURCE_LAB_STORE_PASSWORD != '' && secrets.SOURCE_LAB_KEY_ALIAS != '' && secrets.SOURCE_LAB_KEY_PASSWORD != '' }}
        env:
          SOURCE_LAB_GITHUB_CLIENT_ID: ${{ vars.SOURCE_LAB_GITHUB_CLIENT_ID }}
          SOURCE_LAB_KEYSTORE_PATH: ${{ runner.temp }}/source-lab-release.jks
          SOURCE_LAB_STORE_PASSWORD: ${{ secrets.SOURCE_LAB_STORE_PASSWORD }}
          SOURCE_LAB_KEY_ALIAS: ${{ secrets.SOURCE_LAB_KEY_ALIAS }}
          SOURCE_LAB_KEY_PASSWORD: ${{ secrets.SOURCE_LAB_KEY_PASSWORD }}
        run: gradle -p source-lab :app:assembleRelease --stacktrace

      - name: Upload stable signed Source Lab APK
        if: ${{ secrets.SOURCE_LAB_KEYSTORE_BASE64 != '' && secrets.SOURCE_LAB_STORE_PASSWORD != '' && secrets.SOURCE_LAB_KEY_ALIAS != '' && secrets.SOURCE_LAB_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: miyorare-source-lab-stable-signed
          path: source-lab/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
