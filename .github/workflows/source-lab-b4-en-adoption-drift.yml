name: Source Lab B4 EN Adoption Drift
run-name: Source Lab B4 EN Adoption Drift

on:
  workflow_dispatch:
  schedule:
    - cron: '11 3 * * *'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/source-lab-b4-en-adoption-drift.yml'
      - 'tools/source_lab_b4_en_adoption_drift.py'
      - 'tests/test_source_lab_b4_en_adoption_drift.py'
      - 'compatibility/evidence/track-b-batch4-en-baseline.json'
      - 'compatibility/evidence/track-b-batch3-runtime-boundary.json'
      - 'compatibility/evidence/track-b-batch3-upstream-disposition.json'
      - 'compatibility/evidence/track-b-batch3-live-runtime-access.json'
      - 'compatibility/evidence/track-b-batch3-identity-closure.json'
      - 'tools/source_lab_b3_reconciliation.py'
      - 'tools/source_lab_b3_runtime_closure.py'
      - 'tools/source_lab_b3_identity_closure.py'

permissions:
  contents: read

concurrency:
  group: source-lab-b4-en-adoption-drift-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_OWNER_ID: '149634319'
  INVENTORY_BASELINE: '2c4768c7ea9914030868792bcd73d5f7f461907b'
  FARM_BASELINE: '654af67becbdb0adf85ab87663674ba7340b3cf4'
  MIYORARE_AMAIN2_BASELINE: 'f366d775c5b4c3a330b4baf105e24ce93fd66fc7'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  en-adoption-drift:
    name: Freeze EN parity and detect future drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Validate safe execution context
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "Noirero/Miyorare-Source-Packs" ]]
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              [[ "$PR_HEAD_REPO" == "$GITHUB_REPOSITORY" ]] || {
                echo "::error::B4 accepts same-repository pull requests only"
                exit 1
              }
              ;;
            schedule) ;;
            workflow_dispatch)
              [[ "$GITHUB_ACTOR_ID" == "$EXPECTED_OWNER_ID" ]]
              [[ "$GITHUB_REF_NAME" == "main" ]]
              ;;
            *) echo "::error::unexpected event: $GITHUB_EVENT_NAME"; exit 1 ;;
          esac

      - name: Checkout proposed control plane
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: control
          fetch-depth: 1

      - name: Checkout frozen inventory baseline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.INVENTORY_BASELINE }}
          path: inventory-baseline
          fetch-depth: 1

      - name: Checkout current informational inventory
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: source-inventory-live
          path: inventory-current
          fetch-depth: 1

      - name: Checkout frozen Farm baseline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.FARM_BASELINE }}
          path: farm-baseline
          fetch-depth: 1

      - name: Checkout current Compatibility Farm
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: compatibility-farm-foundation
          path: farm-current
          fetch-depth: 1

      - name: Checkout frozen Amain2 consumer baseline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Noirero/Miyorare
          ref: ${{ env.MIYORARE_AMAIN2_BASELINE }}
          path: miyorare-baseline
          fetch-depth: 1

      - name: Checkout current Amain2 consumer
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Noirero/Miyorare
          ref: Amain2
          path: miyorare-current
          fetch-depth: 1

      - name: Pin current heads and verify frozen baseline metadata
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          inventory="$(git -C inventory-current rev-parse HEAD)"
          farm="$(git -C farm-current rev-parse HEAD)"
          miyorare="$(git -C miyorare-current rev-parse HEAD)"
          [[ "$(git -C inventory-baseline rev-parse HEAD)" == "$INVENTORY_BASELINE" ]]
          [[ "$(git -C farm-baseline rev-parse HEAD)" == "$FARM_BASELINE" ]]
          [[ "$(git -C miyorare-baseline rev-parse HEAD)" == "$MIYORARE_AMAIN2_BASELINE" ]]
          [[ "$inventory" == "$(git -C inventory-current ls-remote origin refs/heads/source-inventory-live | awk '{print $1}')" ]]
          [[ "$farm" == "$(git -C farm-current ls-remote origin refs/heads/compatibility-farm-foundation | awk '{print $1}')" ]]
          [[ "$miyorare" == "$(git -C miyorare-current ls-remote origin refs/heads/Amain2 | awk '{print $1}')" ]]
          echo "inventory=$inventory" >> "$GITHUB_OUTPUT"
          echo "farm=$farm" >> "$GITHUB_OUTPUT"
          echo "miyorare=$miyorare" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('control/compatibility/evidence/track-b-batch4-en-baseline.json').read_text())
          refs = data['refs']
          assert refs['sourceInventory'] == os.environ['INVENTORY_BASELINE']
          assert refs['compatibilityFarm'] == os.environ['FARM_BASELINE']
          assert refs['miyorareAmain2'] == os.environ['MIYORARE_AMAIN2_BASELINE']
          PY
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            [[ "$inventory" == "$INVENTORY_BASELINE" ]] || { echo "::error::inventory moved before B4 closure PR validation"; exit 1; }
            [[ "$farm" == "$FARM_BASELINE" ]] || { echo "::error::Farm moved before B4 closure PR validation"; exit 1; }
            [[ "$miyorare" == "$MIYORARE_AMAIN2_BASELINE" ]] || { echo "::error::Amain2 moved before B4 closure PR validation"; exit 1; }
          fi

      - name: Compile and run B4 regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              'tools/source_lab_b4_en_adoption_drift.py',
              'tests/test_source_lab_b4_en_adoption_drift.py',
          ):
              path = Path('control') / name
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY
          PYTHONPATH=control/tools python3 -m unittest control/tests/test_source_lab_b4_en_adoption_drift.py

      - name: Rebuild exact final Batch 3 closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          PYTHONPATH=control/tools python3 control/tools/source_lab_b3_identity_closure.py \
            --boundary control/compatibility/evidence/track-b-batch3-runtime-boundary.json \
            --upstream-evidence control/compatibility/evidence/track-b-batch3-upstream-disposition.json \
            --live-access-evidence control/compatibility/evidence/track-b-batch3-live-runtime-access.json \
            --identity-evidence control/compatibility/evidence/track-b-batch3-identity-closure.json \
            --output build/track-b-batch3-final.json

      - name: Build Batch 4 parity and drift report
        id: report
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control/tools python3 control/tools/source_lab_b4_en_adoption_drift.py \
            --baseline control/compatibility/evidence/track-b-batch4-en-baseline.json \
            --b3-closure build/track-b-batch3-final.json \
            --inventory-baseline inventory-baseline/inventory/source-inventory.json \
            --inventory-current inventory-current/inventory/source-inventory.json \
            --farm-baseline farm-baseline/compatibility/source-registry.json \
            --farm-current farm-current/compatibility/source-registry.json \
            --miyorare-baseline-root miyorare-baseline \
            --miyorare-current-root miyorare-current \
            --inventory-current-commit '${{ steps.pins.outputs.inventory }}' \
            --farm-current-commit '${{ steps.pins.outputs.farm }}' \
            --miyorare-current-commit '${{ steps.pins.outputs.miyorare }}' \
            --output build/track-b-batch4-en-adoption-drift.json \
            --markdown-output build/track-b-batch4-en-adoption-drift.md
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path('build/track-b-batch4-en-adoption-drift.json').read_text())
          assert data['schemaVersion'] == 1
          assert data['phase'] == 'TRACK_B_BATCH_4_ADOPTION_DRIFT'
          assert data['readOnly'] is True
          assert data['trackBClosed'] is True
          assert data['batch3']['rows'] == 33
          assert data['batch3']['evidenceBackedRows'] == 33
          assert data['adoption']['policy'] == 'PASS_ONLY'
          assert data['adoption']['eligibleRows'] == 0
          assert data['adoption']['adoptionPerformed'] is False
          assert not any(data['safety'].values())
          if __import__('os').environ['GITHUB_EVENT_NAME'] == 'pull_request':
              assert data['status'] == 'TRACK_B_CLOSED_BASELINE_CLEAN', data['status']
              assert data['handoff']['required'] is False
          print('status=' + data['status'])
          print('handoff=' + ('true' if data['handoff']['required'] else 'false'))
          PY

      - name: Recheck live heads and prove all checkouts stayed read-only
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.pins.outputs.inventory }}' == "$(git -C inventory-current ls-remote origin refs/heads/source-inventory-live | awk '{print $1}')" ]]
          [[ '${{ steps.pins.outputs.farm }}' == "$(git -C farm-current ls-remote origin refs/heads/compatibility-farm-foundation | awk '{print $1}')" ]]
          [[ '${{ steps.pins.outputs.miyorare }}' == "$(git -C miyorare-current ls-remote origin refs/heads/Amain2 | awk '{print $1}')" ]]
          for repo in control inventory-baseline inventory-current farm-baseline farm-current miyorare-baseline miyorare-current; do
            test -z "$(git -C "$repo" status --porcelain)"
          done

      - name: Surface drift without creating promotion authority
        if: steps.report.outputs.handoff == 'true'
        shell: bash
        run: |
          echo "::warning::Track B EN parity drift detected. Existing Source Lab inventory/Farm/PENDING/approval pipeline remains the handoff authority."

      - name: Upload Batch 4 checkpoint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-b-batch4-en-adoption-drift-${{ github.run_id }}
          path: |
            build/track-b-batch3-final.json
            build/track-b-batch4-en-adoption-drift.json
            build/track-b-batch4-en-adoption-drift.md
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        shell: bash
        run: |
          if [[ -f build/track-b-batch4-en-adoption-drift.md ]]; then
            cat build/track-b-batch4-en-adoption-drift.md >> "$GITHUB_STEP_SUMMARY"
          fi
