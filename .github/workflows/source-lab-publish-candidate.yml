name: Source Lab Publish Candidate
run-name: Source Lab publish ${{ inputs.candidate_set_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_set_id:
        description: Exact signed candidateSetId to publish
        required: true
        type: string
      signing_run_id:
        description: Exact successful Source Lab signing workflow run
        required: true
        type: number
permissions:
  actions: write
  attestations: read
  contents: write

concurrency:
  group: source-lab-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact attested Source Pack state
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_OWNER_ID: '149634319'
      CANDIDATE_SET_ID: ${{ inputs.candidate_set_id }}
      SIGNING_RUN_ID: ${{ inputs.signing_run_id }}
    steps:
      - name: Fail closed on caller and request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REPOSITORY" == "Noirero/Miyorare-Source-Packs" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_ACTOR_ID" == "$EXPECTED_OWNER_ID" ]]
          [[ "$CANDIDATE_SET_ID" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SIGNING_RUN_ID" =~ ^[0-9]+$ ]]

      - name: Verify exact successful signing run
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SIGNING_RUN_ID" > "$RUNNER_TEMP/signing-run.json"
          python3 - "$RUNNER_TEMP/signing-run.json" <<'PY'
          import json, os, sys
          run = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {
              "event": "workflow_dispatch",
              "head_branch": "main",
              "conclusion": "success",
              "path": ".github/workflows/source-lab-sign-candidate.yml",
          }
          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit(f"signing run {key} mismatch: {run.get(key)!r}")
          if str(run.get("actor", {}).get("id")) != os.environ["EXPECTED_OWNER_ID"]:
              raise SystemExit("signing run actor mismatch")
          if run.get("display_title") != f"Source Lab sign {os.environ['CANDIDATE_SET_ID']}":
              raise SystemExit("signing run candidate title mismatch")
          PY

      - name: Download exact attested signing material
        uses: actions/download-artifact@v5
        with:
          name: source-lab-signature-${{ inputs.candidate_set_id }}
          path: build/signature
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.signing_run_id }}

      - name: Validate signing receipt and manifest
        id: signature
        shell: bash
        run: |
          set -euo pipefail
          receipt="$(find build/signature -type f -name source-lab-signing-receipt.json -print -quit)"
          manifest="$(find build/signature -type f -name source-lab-signing-manifest.json -print -quit)"
          checksum="$(find build/signature -type f -name source-lab-signing-manifest.sha256 -print -quit)"
          [[ -n "$receipt" && -n "$manifest" && -n "$checksum" ]]
          cp "$receipt" build/source-lab-signing-receipt.json
          cp "$manifest" build/source-lab-signing-manifest.json
          cp "$checksum" build/source-lab-signing-manifest.sha256
          (cd build && sha256sum -c source-lab-signing-manifest.sha256)

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, json, os
          from pathlib import Path
          receipt = json.loads(Path("build/source-lab-signing-receipt.json").read_text(encoding="utf-8"))
          manifest_path = Path("build/source-lab-signing-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if receipt.get("schemaVersion") != 1 or receipt.get("action") != "SIGN":
              raise SystemExit("invalid signing receipt")
          if receipt.get("state") != "ATTESTED" or receipt.get("publishEligible") is not True:
              raise SystemExit("signing receipt is not publish eligible")
          if receipt.get("candidateSetId") != os.environ["CANDIDATE_SET_ID"]:
              raise SystemExit("signing receipt candidate mismatch")
          if receipt.get("signingRunId") != int(os.environ["SIGNING_RUN_ID"]):
              raise SystemExit("signing receipt run mismatch")
          if manifest.get("candidateSetId") != receipt.get("candidateSetId"):
              raise SystemExit("manifest candidate mismatch")
          if manifest.get("foundationCommit") != receipt.get("foundationCommit"):
              raise SystemExit("manifest foundation commit mismatch")
          if manifest.get("providers") != receipt.get("providers"):
              raise SystemExit("manifest provider pins mismatch")
          digest = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          if digest != receipt.get("manifestSha256"):
              raise SystemExit("signing manifest digest mismatch")
          commit = receipt.get("foundationCommit")
          if not isinstance(commit, str) or len(commit) != 40:
              raise SystemExit("signed foundation commit invalid")
          print(f"foundation_commit={commit}")
          PY

      - name: Verify GitHub artifact attestation
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify \
            build/source-lab-signing-manifest.json \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify live provider state and create exact temporary release ref
        id: release-ref
        env:
          FOUNDATION_COMMIT: ${{ steps.signature.outputs.foundation_commit }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch compatibility-farm-foundation \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$RUNNER_TEMP/live-farm"

          python3 - <<'PY'
          import json
          from pathlib import Path
          signing = json.loads(Path("build/source-lab-signing-receipt.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("build/source-lab-signing-manifest.json").read_text(encoding="utf-8"))
          root = Path(__import__("os").environ["RUNNER_TEMP"]) / "live-farm"
          upstream = json.loads((root / "upstream/registry.json").read_text(encoding="utf-8"))
          compatibility = json.loads((root / "compatibility/source-registry.json").read_text(encoding="utf-8"))
          status = json.loads((root / "upstream/status.json").read_text(encoding="utf-8"))
          if status.get("approvalCandidate") is not None:
              raise SystemExit("live provider approval candidate appeared after signing")
          last = status.get("lastPromotion")
          if not isinstance(last, dict):
              raise SystemExit("live lastPromotion is missing")
          if last.get("candidateSetId") != signing.get("candidateSetId"):
              raise SystemExit("live lastPromotion candidate changed after signing")
          if last.get("promotionRunId") != signing.get("promotionRunId"):
              raise SystemExit("live promotion run changed after signing")
          if last.get("providers") != signing.get("providers"):
              raise SystemExit("live promoted provider pins changed after signing")
          if last.get("evidenceBinding") != manifest.get("evidenceBinding"):
              raise SystemExit("live promotion evidence binding changed after signing")
          for provider, commit in signing.get("providers", {}).items():
              if upstream.get("providers", {}).get(provider, {}).get("lastKnownGood") != commit:
                  raise SystemExit(f"live provider baseline moved after signing: {provider}")
              if compatibility.get("providerBaselines", {}).get(provider) != commit:
                  raise SystemExit(f"live compatibility baseline moved after signing: {provider}")
              provider_status = status.get("providers", {}).get(provider, {})
              if provider_status.get("activeCommit") != commit:
                  raise SystemExit(f"live provider activeCommit moved after signing: {provider}")
              if provider_status.get("lastKnownGood") != commit:
                  raise SystemExit(f"live provider lastKnownGood moved after signing: {provider}")
          PY

          temp_branch="source-lab-publish-${GITHUB_RUN_ID}"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$temp_branch" \
            -f sha="$FOUNDATION_COMMIT" >/dev/null
          echo "temp_branch=$temp_branch" >> "$GITHUB_OUTPUT"

      - name: Send signed release request to authoritative controller
        id: controller
        env:
          TEMP_BRANCH: ${{ steps.release-ref.outputs.temp_branch }}
          FOUNDATION_COMMIT: ${{ steps.signature.outputs.foundation_commit }}
        shell: bash
        run: |
          set -euo pipefail
          started_epoch="$(date -u +%s)"
          gh workflow run source-pack-autonomous-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_mode=source_lab_signed \
            -f candidate_set_id="$CANDIDATE_SET_ID" \
            -f signing_run_id="$SIGNING_RUN_ID" \
            -f release_ref="$TEMP_BRANCH" \
            -f foundation_commit="$FOUNDATION_COMMIT"

          controller_run_id=""
          for _ in $(seq 1 90); do
            controller_run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow source-pack-autonomous-release.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,createdAt,displayTitle \
              --jq "[.[] | select((.createdAt | fromdateiso8601) >= ($started_epoch - 5))] | sort_by(.databaseId) | last | .databaseId // empty")"
            [[ -n "$controller_run_id" ]] && break
            sleep 2
          done
          [[ "$controller_run_id" =~ ^[0-9]+$ ]]
          gh run watch "$controller_run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 20
          echo "run_id=$controller_run_id" >> "$GITHUB_OUTPUT"

      - name: Download authoritative controller result
        uses: actions/download-artifact@v5
        with:
          name: source-pack-signed-release-${{ inputs.candidate_set_id }}
          path: build/controller
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.controller.outputs.run_id }}

      - name: Verify controller result and emit immutable publish receipt
        env:
          FOUNDATION_COMMIT: ${{ steps.signature.outputs.foundation_commit }}
          CONTROLLER_RUN_ID: ${{ steps.controller.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(find build/controller -type f -name source-pack-signed-release-result.json -print -quit)"
          [[ -n "$result" ]]
          cp "$result" build/source-pack-signed-release-result.json
          release_json="$(find build/controller -type f -name release.json -print -quit)"
          [[ -n "$release_json" ]]
          cp "$release_json" build/release.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          signing = json.loads(Path("build/source-lab-signing-receipt.json").read_text(encoding="utf-8"))
          result = json.loads(Path("build/source-pack-signed-release-result.json").read_text(encoding="utf-8"))
          if result.get("candidateSetId") != signing.get("candidateSetId"):
              raise SystemExit("controller result candidate mismatch")
          if result.get("signingRunId") != signing.get("signingRunId"):
              raise SystemExit("controller result signing run mismatch")
          if result.get("controllerRunId") != int(os.environ["CONTROLLER_RUN_ID"]):
              raise SystemExit("controller run binding mismatch")
          if result.get("foundationCommit") != os.environ["FOUNDATION_COMMIT"]:
              raise SystemExit("controller result Foundation commit mismatch")
          version = result.get("version")
          tag = result.get("tag")
          if not isinstance(version, str) or tag != f"miyorare-sources-v{version}":
              raise SystemExit("controller result version/tag mismatch")
          receipt = {
              "schemaVersion": 1,
              "action": "PUBLISH",
              "state": "PUBLISHED",
              "candidateSetId": signing["candidateSetId"],
              "signingRunId": signing["signingRunId"],
              "publishRunId": int(os.environ["GITHUB_RUN_ID"]),
              "controllerRunId": result["controllerRunId"],
              "releaseRunId": result["releaseRunId"],
              "foundationCommit": result["foundationCommit"],
              "providers": signing["providers"],
              "version": version,
              "tag": tag,
          }
          Path("build/source-lab-publish-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Record completed publish cycle in live Farm status
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch compatibility-farm-foundation \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" farm
          git -C farm config user.name github-actions[bot]
          git -C farm config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in $(seq 1 6); do
            git -C farm fetch origin compatibility-farm-foundation
            git -C farm reset --hard origin/compatibility-farm-foundation
            python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          receipt = json.loads(Path("build/source-lab-publish-receipt.json").read_text(encoding="utf-8"))
          signing = json.loads(Path("build/source-lab-signing-receipt.json").read_text(encoding="utf-8"))
          status_path = Path("farm/upstream/status.json")
          registry_path = Path("farm/upstream/registry.json")
          compatibility_path = Path("farm/compatibility/source-registry.json")
          status = json.loads(status_path.read_text(encoding="utf-8"))
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          compatibility = json.loads(compatibility_path.read_text(encoding="utf-8"))
          if status.get("approvalCandidate") is not None:
              raise SystemExit("a new approvalCandidate appeared before publish marker")
          last = status.get("lastPromotion")
          if not isinstance(last, dict) or last.get("candidateSetId") != receipt["candidateSetId"]:
              raise SystemExit("live lastPromotion changed before publish marker")
          if last.get("promotionRunId") != signing.get("promotionRunId"):
              raise SystemExit("live promotion run changed before publish marker")
          if last.get("providers") != receipt.get("providers"):
              raise SystemExit("live promoted provider pins changed before publish marker")
          for provider, commit in receipt.get("providers", {}).items():
              if registry.get("providers", {}).get(provider, {}).get("lastKnownGood") != commit:
                  raise SystemExit(f"live provider baseline moved before publish marker: {provider}")
              if compatibility.get("providerBaselines", {}).get(provider) != commit:
                  raise SystemExit(f"live compatibility baseline moved before publish marker: {provider}")
              provider_status = status.get("providers", {}).get(provider, {})
              if provider_status.get("activeCommit") != commit or provider_status.get("lastKnownGood") != commit:
                  raise SystemExit(f"live provider runtime state moved before publish marker: {provider}")
          status["lastPublish"] = receipt
          status.pop("lastPublishFailure", None)
          automation = status.get("automation")
          if isinstance(automation, dict) and (
              automation.get("state") == "PUBLISHING"
              or (automation.get("state") == "INFRASTRUCTURE_FAILURE" and automation.get("reason") == "PUBLISH_PIPELINE_FAILED")
          ):
              automation["state"] = "ALL_GOOD"
              automation["reason"] = "PUBLISH_COMPLETED"
              automation["ownerActionRequired"] = False
              automation["workflowRunId"] = receipt["publishRunId"]
              automation["updatedAt"] = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          status_path.write_text(json.dumps(status, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
            git -C farm add upstream/status.json
            git -C farm commit -m "Record Source Lab published candidate $CANDIDATE_SET_ID"
            if git -C farm push origin HEAD:compatibility-farm-foundation; then
              break
            fi
            if [[ "$attempt" == "6" ]]; then
              echo "Compatibility Farm kept moving while recording publish marker." >&2
              exit 1
            fi
          done

      - name: Record failed publish cycle in live Farm status
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REPOSITORY" == "Noirero/Miyorare-Source-Packs" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_ACTOR_ID" == "$EXPECTED_OWNER_ID" ]]
          [[ "$CANDIDATE_SET_ID" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SIGNING_RUN_ID" =~ ^[0-9]+$ ]]
          rm -rf farm-failure
          git clone --branch compatibility-farm-foundation \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" farm-failure
          git -C farm-failure config user.name github-actions[bot]
          git -C farm-failure config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in $(seq 1 6); do
            git -C farm-failure fetch origin compatibility-farm-foundation
            git -C farm-failure reset --hard origin/compatibility-farm-foundation
            set +e
            python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path("farm-failure/upstream/status.json")
          status = json.loads(path.read_text(encoding="utf-8"))
          last = status.get("lastPromotion")
          candidate = os.environ["CANDIDATE_SET_ID"]
          if not isinstance(last, dict) or last.get("candidateSetId") != candidate:
              raise SystemExit(3)
          published = status.get("lastPublish")
          if isinstance(published, dict) and published.get("candidateSetId") == candidate:
              raise SystemExit(3)
          failure = {
              "schemaVersion": 1,
              "state": "FAILED",
              "candidateSetId": candidate,
              "signingRunId": int(os.environ["SIGNING_RUN_ID"]),
              "publishRunId": int(os.environ["GITHUB_RUN_ID"]),
              "reason": "PUBLISH_WORKFLOW_FAILED",
              "recordedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          status["lastPublishFailure"] = failure
          automation = status.get("automation")
          if not isinstance(automation, dict):
              automation = {"schemaVersion": 2}
          automation["state"] = "INFRASTRUCTURE_FAILURE"
          automation["reason"] = "PUBLISH_PIPELINE_FAILED"
          automation["ownerActionRequired"] = True
          automation["workflowRunId"] = int(os.environ["GITHUB_RUN_ID"])
          automation["updatedAt"] = failure["recordedAt"]
          status["automation"] = automation
          path.write_text(json.dumps(status, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
            code=$?
            set -e
            if [[ "$code" == "3" ]]; then
              echo "Publish lifecycle already moved on; failure marker not written."
              exit 0
            elif [[ "$code" != "0" ]]; then
              exit "$code"
            fi
            git -C farm-failure add upstream/status.json
            git -C farm-failure commit -m "Record Source Lab publish failure $CANDIDATE_SET_ID"
            if git -C farm-failure push origin HEAD:compatibility-farm-foundation; then
              break
            fi
            if [[ "$attempt" == "6" ]]; then
              echo "Compatibility Farm kept moving while recording publish failure." >&2
              exit 1
            fi
          done

      - name: Upload publish receipt
        uses: actions/upload-artifact@v4
        with:
          name: source-lab-publish-${{ inputs.candidate_set_id }}
          path: |
            build/source-lab-publish-receipt.json
            build/source-pack-signed-release-result.json
            build/source-lab-signing-receipt.json
            build/source-lab-signing-manifest.json
            build/release.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary release ref
        if: always()
        env:
          TEMP_BRANCH: ${{ steps.release-ref.outputs.temp_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${TEMP_BRANCH:-}" ]]; then
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/git/refs/heads/$TEMP_BRANCH" \
              >/dev/null 2>&1 || true
          fi
