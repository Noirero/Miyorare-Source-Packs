name: Compatibility Farm Keiyoushi Aqua

on:
  push:
    branches:
      - compatibility-farm-foundation
    paths:
      - 'compatibility/source-registry.json'
      - 'compatibility/harness/keiyoushi/KeiyoushiAquaMangaParserHarnessTest.kt'
      - 'compatibility/harness/keiyoushi/runtime/**'
      - 'tools/parser_harness_report.py'
      - '.github/workflows/compatibility-farm-keiyoushi-aqua.yml'
  pull_request:
    branches:
      - beta
      - main
    paths:
      - 'compatibility/source-registry.json'
      - 'compatibility/harness/keiyoushi/KeiyoushiAquaMangaParserHarnessTest.kt'
      - 'compatibility/harness/keiyoushi/runtime/**'
      - 'tools/parser_harness_report.py'
      - '.github/workflows/compatibility-farm-keiyoushi-aqua.yml'

permissions:
  contents: read

concurrency:
  group: compatibility-farm-keiyoushi-aqua-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-parser-aqua:
    name: Execute pinned Keiyoushi Aqua parser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Compatibility Farm
        uses: actions/checkout@v5

      - name: Resolve pinned Keiyoushi baseline
        id: provider-ref
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path('compatibility/source-registry.json').read_text(encoding='utf-8'))
          print(f"keiyoushi={data['providerBaselines']['keiyoushi']}")
          PY

      - name: Checkout pinned Keiyoushi source
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: ${{ steps.provider-ref.outputs.keiyoushi }}
          path: _upstream/keiyoushi
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install deterministic Aqua parser harness
        shell: bash
        run: |
          set -euo pipefail
          module=_upstream/keiyoushi/src/en/aquamanga
          mkdir -p "$module/compatibility-farm-test"
          # The Aqua harness resolves the pinned MadaraLegacy i18n bundle relative to
          # the module test working directory. Expose the real upstream lib tree there
          # without copying or modifying upstream source files.
          ln -s ../../../lib-multisrc "$module/lib-multisrc"
          cp compatibility/harness/keiyoushi/KeiyoushiAquaMangaParserHarnessTest.kt "$module/compatibility-farm-test/"
          cp -R compatibility/harness/keiyoushi/runtime/. "$module/compatibility-farm-test/"
          cat >> "$module/build.gradle.kts" <<'EOF'

          // Compatibility Farm test-only wiring. This exists only in the disposable CI checkout.
          android {
              sourceSets {
                  named("test") {
                      java.directories.add("compatibility-farm-test")
                      kotlin.directories.add("compatibility-farm-test")
                  }
              }
              testOptions {
                  unitTests.isReturnDefaultValues = true
              }
          }

          dependencies {
              testImplementation(libs.junit)
              testImplementation(libs.bundles.common)
          }

          tasks.matching { it.name == "kspDebugUnitTestKotlin" }.configureEach {
              enabled = false
          }
          EOF

      - name: Execute real Keiyoushi Aqua MadaraLegacy parser harness
        working-directory: _upstream/keiyoushi
        run: |
          chmod +x gradlew
          ./gradlew :src:en:aquamanga:testDebugUnitTest \
            --tests compatibilityfarm.KeiyoushiAquaMangaParserHarnessTest \
            --no-daemon

      - name: Normalize Aqua real parser evidence
        run: >-
          python3 tools/parser_harness_report.py
          --registry compatibility/source-registry.json
          --results-dir _upstream/keiyoushi/src/en/aquamanga/build/test-results/testDebugUnitTest
          --provider keiyoushi
          --source miyorare:miyorare-en:AQUAMANGA=compatibilityfarm.KeiyoushiAquaMangaParserHarnessTest
          --output build/real-parser-harness-keiyoushi-aqua-report.json

      - name: Upload Aqua parser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-farm-keiyoushi-aqua-report
          path: |
            build/real-parser-harness-keiyoushi-aqua-report.json
            _upstream/keiyoushi/src/en/aquamanga/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 14
