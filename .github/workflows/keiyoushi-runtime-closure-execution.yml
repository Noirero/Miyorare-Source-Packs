name: Keiyoushi Runtime Closure Execution
run-name: Runtime closure ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 32 lowercase hex correlation identifier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: keiyoushi-runtime-closure-execution
  cancel-in-progress: false

env:
  FOUNDATION: 3ddb997f545b2267dc3371c64b77e1b2a9019126
  BASELINE: 2025891752e4705effc28e87a043f7205014cde3
  CANDIDATE: 23345ef345e3b20d7fcc0b5d8fdc922d025af47f
  EXPECTED_OWNER_ID: '149634319'

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: BACAMI, canonical: 'miyorare:miyorare-id:BACAMI', module: 'src/id/bacami', test: 'compatibilityfarm.KeiyoushiBacamiParserHarnessTest', profile: common, webview: false}
          - {label: KIRYUU, canonical: 'miyorare:miyorare-id:KIRYUU', module: 'src/id/kiryuu', test: 'compatibilityfarm.KeiyoushiKiryuuParserHarnessTest', profile: common, webview: false}
          - {label: KOMIKU, canonical: 'miyorare:miyorare-id:KOMIKU', module: 'src/id/komiku', test: 'compatibilityfarm.KeiyoushiKomikuParserHarnessTest', profile: common, webview: false}
          - {label: ASURASCANS, canonical: 'miyorare:miyorare-en:ASURASCANS', module: 'src/en/asurascans', test: 'compatibilityfarm.KeiyoushiAsuraScansParserHarnessTest', profile: configurable, webview: false}
          - {label: AQUAMANGA, canonical: 'miyorare:miyorare-en:AQUAMANGA', module: 'src/en/aquamanga', test: 'compatibilityfarm.KeiyoushiAquaMangaParserHarnessTest', profile: common, webview: false}
          - {label: BATCAVE, canonical: 'miyorare:miyorare-en:BATCAVE', module: 'src/en/batcave', test: 'compatibilityfarm.KeiyoushiBatCaveParserHarnessTest', profile: common, webview: true}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate owner and request
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python3 - <<'PY'
          import os,re
          assert os.environ['GITHUB_REPOSITORY']=='Noirero/Miyorare-Source-Packs'
          assert os.environ['GITHUB_ACTOR_ID']==os.environ['EXPECTED_OWNER_ID']
          assert re.fullmatch(r'[0-9a-f]{32}',os.environ['REQUEST_ID'])
          PY
      - name: Checkout exact evidence foundation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 3ddb997f545b2267dc3371c64b77e1b2a9019126
          path: _farm
          persist-credentials: false
      - name: Checkout exact provenance producer
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: _control
          persist-credentials: false
      - name: Checkout exact Keiyoushi candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: keiyoushi/extensions-source
          ref: 23345ef345e3b20d7fcc0b5d8fdc922d025af47f
          path: _upstream/keiyoushi
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Install deterministic source harness
        env:
          MODULE: ${{ matrix.module }}
          TEST_CLASS: ${{ matrix.test }}
          RUNTIME_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          test "$(git -C _farm rev-parse HEAD)" = "$FOUNDATION"
          test "$(git -C _control rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C _upstream/keiyoushi rev-parse HEAD)" = "$CANDIDATE"
          module="_upstream/keiyoushi/$MODULE"
          mkdir -p "$module/compatibility-farm-test" "$module/compatibility-farm-resources/compatibility-farm"
          cp "_farm/compatibility/harness/keiyoushi/${TEST_CLASS##*.}.kt" "$module/compatibility-farm-test/"
          cp -R _farm/compatibility/harness/keiyoushi/runtime/. "$module/compatibility-farm-test/"
          if [[ "$RUNTIME_PROFILE" != common ]]; then
            cp -R "_farm/compatibility/harness/keiyoushi/runtime-profiles/$RUNTIME_PROFILE/." "$module/compatibility-farm-test/"
          fi
          cp -R _farm/compatibility/harness/keiyoushi/resources/. "$module/compatibility-farm-resources/compatibility-farm/"
          ln -s ../../../lib-multisrc "$module/lib-multisrc"
          cat >> "$module/build.gradle.kts" <<'EOF'
          android {
              sourceSets.named("test") {
                  java.directories.add("compatibility-farm-test")
                  kotlin.directories.add("compatibility-farm-test")
                  resources.directories.add("compatibility-farm-resources")
              }
              testOptions {
                  unitTests.isReturnDefaultValues = true
              }
          }
          dependencies {
              testImplementation(libs.junit)
              testImplementation(libs.bundles.common)
          }
          tasks.matching { it.name == "kspDebugUnitTestKotlin" }.configureEach {
              enabled = false
          }
          EOF
      - name: Execute exact candidate parser
        working-directory: _upstream/keiyoushi
        env:
          MODULE: ${{ matrix.module }}
          TEST_CLASS: ${{ matrix.test }}
        run: |
          set -o pipefail
          bash gradlew ":${MODULE//\//:}:testDebugUnitTest" --tests "$TEST_CLASS" --no-daemon --console=plain | tee "$RUNNER_TEMP/runtime-closure-gradle.log"
      - name: Record exact execution provenance
        if: always()
        env:
          CANONICAL: ${{ matrix.canonical }}
          MODULE: ${{ matrix.module }}
          WEBVIEW: ${{ matrix.webview }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p build/runtime-closure
          test -f "$RUNNER_TEMP/runtime-closure-gradle.log" || : > "$RUNNER_TEMP/runtime-closure-gradle.log"
          python3 _control/tools/runtime_closure_provenance.py \
            --repo _upstream/keiyoushi \
            --base "$BASELINE" \
            --candidate "$CANDIDATE" \
            --module "$MODULE" \
            --canonical "$CANONICAL" \
            --gradle-log "$RUNNER_TEMP/runtime-closure-gradle.log" \
            --webview "$WEBVIEW" \
            --job-status "$JOB_STATUS" \
            --run-id "$GITHUB_RUN_ID" \
            --output build/runtime-closure/execution.json
      - name: Upload runtime closure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-closure-${{ matrix.label }}-${{ inputs.request_id }}
          path: |
            build/runtime-closure/execution.json
            _upstream/keiyoushi/${{ matrix.module }}/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 14
