name: Miyorare Source Pack Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Source pack version (for example 0.5.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: miyorare-source-pack-release
  cancel-in-progress: false

jobs:
  resolve-source:
    name: Resolve validated source and compatibility baseline
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
      runtime_commit: ${{ steps.runtime.outputs.commit }}
      runtime_version_code: ${{ steps.runtime.outputs.version_code }}
      tsuki_api: ${{ steps.runtime.outputs.tsuki_api }}
      compatibility_epoch: ${{ steps.runtime.outputs.compatibility_epoch }}
      uma_commit: ${{ steps.registry.outputs.uma_commit }}
      gekkoushi_commit: ${{ steps.registry.outputs.gekkoushi_commit }}
      keiyoushi_commit: ${{ steps.registry.outputs.keiyoushi_commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout Source Packs registry
        uses: actions/checkout@v5
        with:
          path: source-packs

      - name: Checkout authoritative Compatibility Farm
        uses: actions/checkout@v5
        with:
          ref: compatibility-farm-foundation
          path: farm
          fetch-depth: 1

      - name: Validate version release and tag immutability
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SOURCE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Version must use MAJOR.MINOR.PATCH."
            exit 1
          }
          TAG="miyorare-sources-v${SOURCE_VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
             git -C source-packs ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Release or tag $TAG already exists. Source-pack releases are immutable."
            exit 1
          fi

      - name: Validate upstream registry
        run: python3 source-packs/tools/upstream_sync.py validate --registry source-packs/upstream/registry.json

      - name: Resolve approved Compatibility Farm provider baselines
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          source_registry = json.loads(Path('farm/compatibility/source-registry.json').read_text(encoding='utf-8'))
          status = json.loads(Path('farm/upstream/status.json').read_text(encoding='utf-8'))
          farm_registry = json.loads(Path('farm/upstream/registry.json').read_text(encoding='utf-8'))
          if status.get('schema') != 3:
              raise SystemExit('authoritative Farm status schema must be 3')
          baselines = source_registry.get('providerBaselines')
          if not isinstance(baselines, dict):
              raise SystemExit('authoritative Farm providerBaselines missing')
          provider_status = status.get('providers')
          if not isinstance(provider_status, dict):
              raise SystemExit('authoritative Farm provider status missing')
          farm_providers = farm_registry.get('providers')
          if not isinstance(farm_providers, dict):
              raise SystemExit('authoritative Farm upstream registry providers missing')

          for provider in ('uma', 'gekkoushi', 'keiyoushi'):
              commit = baselines.get(provider)
              if not isinstance(commit, str) or len(commit) != 40:
                  raise SystemExit(f'invalid approved baseline for {provider}')
              item = provider_status.get(provider)
              if not isinstance(item, dict):
                  raise SystemExit(f'provider status missing for {provider}')
              if item.get('activeCommit') != commit or item.get('lastKnownGood') != commit:
                  raise SystemExit(f'{provider} Farm baseline is not active/LKG')
              registry_item = farm_providers.get(provider)
              if not isinstance(registry_item, dict) or registry_item.get('lastKnownGood') != commit:
                  raise SystemExit(f'{provider} Farm upstream registry disagrees with approved baseline')
              print(f"{provider}_commit={commit}")
          PY

      - name: Resolve pinned Miyorare builder baseline
        id: builder
        shell: bash
        run: |
          set -euo pipefail
          commit="$(python3 source-packs/tools/validate_builder_baseline.py \
            --baseline source-packs/compatibility/miyorare-builder-baseline.json \
            --contract source-packs/compatibility/miyorare-source-pack-contract.v1.json \
            --print-commit)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Checkout exact pinned Miyorare builder
        uses: actions/checkout@v5
        with:
          repository: Noirero/Miyorare
          ref: ${{ steps.builder.outputs.commit }}
          path: miyorare
          fetch-depth: 1

      - name: Verify pinned Miyorare builder commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C miyorare rev-parse HEAD)"
          test "$actual" = '${{ steps.builder.outputs.commit }}' || {
            echo "::error::Checked-out Miyorare builder does not match pinned baseline."
            exit 1
          }
          echo "commit=$actual" >> "$GITHUB_OUTPUT"

      - name: Checkout stable Miyorare compatibility baseline
        uses: actions/checkout@v5
        with:
          repository: Noirero/Miyorare
          ref: main
          path: miyorare-stable
          fetch-depth: 1

      - name: Resolve stable runtime compatibility metadata
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          cmp --silent \
            source-packs/compatibility/miyorare-source-pack-contract.v1.json \
            miyorare-stable/compatibility/miyorare-source-pack-contract.v1.json || {
            echo "::error::Miyorare and Source Packs compatibility contracts differ."
            exit 1
          }
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          import subprocess
          from pathlib import Path

          contract = json.loads(Path('source-packs/compatibility/miyorare-source-pack-contract.v1.json').read_text(encoding='utf-8'))
          baseline = json.loads(Path('source-packs/compatibility/miyorare-builder-baseline.json').read_text(encoding='utf-8'))
          stable_gradle = Path('miyorare-stable/app/build.gradle').read_text(encoding='utf-8')
          version_match = re.search(r'(?m)^\s*versionCode\s*=\s*(\d+)\s*$', stable_gradle)
          if version_match is None:
              raise SystemExit('could not resolve stable Miyorare versionCode')
          version_code = int(version_match.group(1))
          if version_code < 1:
              raise SystemExit('stable Miyorare versionCode must be positive')

          expected_api = contract['compatibility']['tsukiApi']
          stable_packs = json.loads(Path('miyorare-stable/extensions/miyorare-sources/packs.json').read_text(encoding='utf-8'))
          builder_packs = json.loads(Path('miyorare/extensions/miyorare-sources/packs.json').read_text(encoding='utf-8'))
          if stable_packs.get('tsukiApi') != expected_api:
              raise SystemExit('stable Miyorare Tsuki API does not match compatibility contract')
          if baseline.get('tsukiApi') != expected_api or builder_packs.get('tsukiApi') != expected_api:
              raise SystemExit('pinned builder Tsuki API does not match stable compatibility contract')
          if baseline.get('compatibilityEpoch') != contract['compatibility']['compatibilityEpoch']:
              raise SystemExit('pinned builder compatibility epoch does not match contract')

          commit = subprocess.check_output(['git', '-C', 'miyorare-stable', 'rev-parse', 'HEAD'], text=True).strip()
          print(f'commit={commit}')
          print(f'version_code={version_code}')
          print(f'tsuki_api={expected_api}')
          print(f"compatibility_epoch={contract['compatibility']['compatibilityEpoch']}")
          PY

  build-pack:
    name: Build Miyorare-${{ matrix.pack }}
    needs: resolve-source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack: [id, en]

    steps:
      - name: Checkout Source Packs registry
        uses: actions/checkout@v5
        with:
          path: source-packs

      - name: Checkout exact pinned Miyorare builder
        uses: actions/checkout@v5
        with:
          repository: Noirero/Miyorare
          ref: ${{ needs.resolve-source.outputs.source_commit }}
          path: miyorare
          fetch-depth: 1

      - name: Checkout validated UMA source
        uses: actions/checkout@v5
        with:
          repository: InvalidDavid/UMA
          ref: ${{ needs.resolve-source.outputs.uma_commit }}
          path: _upstream/uma
          fetch-depth: 1

      - name: Checkout validated Gekkoushi source
        uses: actions/checkout@v5
        with:
          repository: Gekkoushi/plugin-source
          ref: ${{ needs.resolve-source.outputs.gekkoushi_commit }}
          path: _upstream/gekkoushi
          fetch-depth: 1

      - name: Checkout validated Keiyoushi source
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: ${{ needs.resolve-source.outputs.keiyoushi_commit }}
          path: _upstream/keiyoushi
          fetch-depth: 1

      - name: Materialize validated upstream pins
        run: |
          python3 source-packs/tools/upstream_sync.py materialize \
            --registry farm/upstream/registry.json \
            --miyorare-root miyorare

      - name: Verify canonical multi-upstream aliases
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/verify_multi_upstream.py \
            --manifest miyorare/extensions/miyorare-sources/multi-upstream.json \
            --packs miyorare/extensions/miyorare-sources/packs.json \
            --uma _upstream/uma \
            --keiyoushi _upstream/keiyoushi \
            --output build/verified-multi-upstream-${{ matrix.pack }}.json

      - name: Apply matching Miyorare Gekkoushi overlays
        env:
          PACK: ${{ matrix.pack }}
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          pack = os.environ['PACK']
          root = Path('miyorare/extensions/miyorare-sources/overlays/gekkoushi')
          if not root.is_dir():
              raise SystemExit(0)
          for file in root.rglob('*.kt'):
              rel = file.relative_to(root)
              if not rel.parts or rel.parts[0] != pack:
                  continue
              target = Path('_upstream/gekkoushi/src/main/kotlin/tsuki/site') / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(file, target)
              print(f'overlay: {file} -> {target}')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Prepare curated UMA shard
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/prepare_pack.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --upstream _upstream/uma \
            --pack '${{ matrix.pack }}'

      - name: Build UMA shard with UMA build system
        working-directory: _upstream/uma
        run: |
          chmod +x gradlew
          ./gradlew buildJar --rerun-tasks --no-daemon

      - name: Finalize UMA shard
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/finalize_pack.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --upstream _upstream/uma \
            --pack '${{ matrix.pack }}' \
            --output build/miyorare-source-packs/${{ matrix.pack }}

      - name: Prepare Gekkoushi shard
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/prepare_gekkoushi_shard.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --uma-upstream _upstream/uma \
            --gekkoushi-upstream _upstream/gekkoushi \
            --pack '${{ matrix.pack }}'

      - name: Build Gekkoushi shard with Gekkoushi build system
        working-directory: _upstream/gekkoushi
        run: |
          chmod +x gradlew
          ./gradlew buildJar --rerun-tasks --no-daemon

      - name: Finalize Gekkoushi shard
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/finalize_pack.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --upstream _upstream/gekkoushi \
            --pack '${{ matrix.pack }}' \
            --output build/miyorare-source-packs/${{ matrix.pack }}

      - name: Finalize logical pack manifest
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/finalize_logical_pack.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --pack '${{ matrix.pack }}' \
            --uma-metadata _upstream/uma/miyorare-pack.json \
            --gekkoushi-metadata _upstream/gekkoushi/miyorare-pack.json \
            --output build/miyorare-source-packs/${{ matrix.pack }}

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: miyorare-${{ matrix.pack }}-release
          path: build/miyorare-source-packs/${{ matrix.pack }}/
          if-no-files-found: error
          retention-days: 3

  build-global:
    name: Build Miyorare-Global
    needs: resolve-source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Packs registry
        uses: actions/checkout@v5
        with:
          path: source-packs

      - name: Checkout exact pinned Miyorare builder
        uses: actions/checkout@v5
        with:
          repository: Noirero/Miyorare
          ref: ${{ needs.resolve-source.outputs.source_commit }}
          path: miyorare
          fetch-depth: 1

      - name: Checkout validated Gekkoushi source
        uses: actions/checkout@v5
        with:
          repository: Gekkoushi/plugin-source
          ref: ${{ needs.resolve-source.outputs.gekkoushi_commit }}
          path: _upstream/gekkoushi
          fetch-depth: 1

      - name: Materialize validated upstream pins
        run: |
          python3 source-packs/tools/upstream_sync.py materialize \
            --registry farm/upstream/registry.json \
            --miyorare-root miyorare

      - name: Apply Miyorare Global parser overlays
        run: |
          python3 - <<'PY'
          import shutil
          from pathlib import Path

          root = Path('miyorare/extensions/miyorare-sources/overlays/gekkoushi/all')
          if not root.is_dir():
              raise SystemExit(0)
          for file in root.rglob('*.kt'):
              rel = file.relative_to(root)
              target = Path('_upstream/gekkoushi/src/main/kotlin/tsuki/site/all') / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(file, target)
              print(f'overlay: {file} -> {target}')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Prepare global Gekkoushi shard
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/prepare_global_gekkoushi_shard.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --gekkoushi-upstream _upstream/gekkoushi \
            --pack global

      - name: Build global Gekkoushi shard
        working-directory: _upstream/gekkoushi
        run: |
          chmod +x gradlew
          ./gradlew buildJar --rerun-tasks --no-daemon

      - name: Finalize global shard
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/finalize_global_shard.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --upstream _upstream/gekkoushi \
            --output build/miyorare-source-packs/global

      - name: Finalize logical global pack
        run: |
          python3 miyorare/extensions/miyorare-sources/tools/finalize_global_pack.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --pack global \
            --gekkoushi-metadata _upstream/gekkoushi/miyorare-pack.json \
            --output build/miyorare-source-packs/global

      - name: Verify exposed global sources
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/miyorare-source-packs/global/miyorare-global-pack.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['sourceNames'] == ['EXHENTAI', 'GELBOORU'], data['sourceNames']
          assert data['sourceCount'] == 2, data['sourceCount']
          PY

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: miyorare-global-release
          path: build/miyorare-source-packs/global/
          if-no-files-found: error
          retention-days: 3

  stage-draft:
    name: Stage official source packs as draft
    needs: [resolve-source, build-pack, build-global]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_VERSION: ${{ inputs.version }}
      SOURCE_COMMIT: ${{ needs.resolve-source.outputs.source_commit }}
      RUNTIME_COMMIT: ${{ needs.resolve-source.outputs.runtime_commit }}
      RUNTIME_VERSION_CODE: ${{ needs.resolve-source.outputs.runtime_version_code }}
      TSUKI_API: ${{ needs.resolve-source.outputs.tsuki_api }}
      COMPATIBILITY_EPOCH: ${{ needs.resolve-source.outputs.compatibility_epoch }}
      UMA_COMMIT: ${{ needs.resolve-source.outputs.uma_commit }}
      GEKKOUSHI_COMMIT: ${{ needs.resolve-source.outputs.gekkoushi_commit }}
      KEIYOUSHI_COMMIT: ${{ needs.resolve-source.outputs.keiyoushi_commit }}

    steps:
      - name: Checkout release repository
        uses: actions/checkout@v5

      - name: Download verified packs
        uses: actions/download-artifact@v5
        with:
          pattern: miyorare-*-release
          path: dist
          merge-multiple: true

      - name: Verify release payload and immutable tag namespace
        shell: bash
        run: |
          set -euo pipefail
          TAG="miyorare-sources-v${SOURCE_VERSION}"
          test -n "$SOURCE_COMMIT"
          test -n "$RUNTIME_COMMIT"
          test -n "$RUNTIME_VERSION_CODE"
          test -n "$TSUKI_API"
          test -n "$COMPATIBILITY_EPOCH"
          test -n "$UMA_COMMIT"
          test -n "$GEKKOUSHI_COMMIT"
          test -n "$KEIYOUSHI_COMMIT"
          for language in id en; do
            for shard in uma gekkoushi; do
              test -f "dist/miyorare-${language}-${shard}.jar"
              test -f "dist/miyorare-${language}-${shard}.jar.sha256"
              (cd dist && sha256sum -c "miyorare-${language}-${shard}.jar.sha256")
            done
            test -f "dist/miyorare-${language}-pack.json"
          done
          test -f "dist/miyorare-global-gekkoushi.jar"
          test -f "dist/miyorare-global-gekkoushi.jar.sha256"
          (cd dist && sha256sum -c "miyorare-global-gekkoushi.jar.sha256")
          test -f "dist/miyorare-global-pack.json"
          if gh release view "$TAG" >/dev/null 2>&1 || \
             git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Release or tag $TAG already exists. Source-pack releases are immutable."
            exit 1
          fi

      - name: Generate and validate release manifest v3
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/source_pack_manifest.py generate \
            --dist dist \
            --contract compatibility/miyorare-source-pack-contract.v1.json \
            --version "$SOURCE_VERSION" \
            --source-commit "$SOURCE_COMMIT" \
            --runtime-commit "$RUNTIME_COMMIT" \
            --runtime-version-code "$RUNTIME_VERSION_CODE" \
            --tsuki-api "$TSUKI_API" \
            --compatibility-epoch "$COMPATIBILITY_EPOCH" \
            --uma-commit "$UMA_COMMIT" \
            --gekkoushi-commit "$GEKKOUSHI_COMMIT" \
            --keiyoushi-commit "$KEIYOUSHI_COMMIT" \
            --output dist/miyorare-source-packs.json
          python3 tools/source_pack_manifest.py validate \
            --manifest dist/miyorare-source-packs.json \
            --contract compatibility/miyorare-source-pack-contract.v1.json \
            --tag "miyorare-sources-v${SOURCE_VERSION}"

      - name: Create draft GitHub release with complete payload
        id: draft
        shell: bash
        run: |
          set -euo pipefail
          TAG="miyorare-sources-v${SOURCE_VERSION}"
          gh release create "$TAG" \
            dist/miyorare-id-uma.jar \
            dist/miyorare-id-uma.jar.sha256 \
            dist/miyorare-id-gekkoushi.jar \
            dist/miyorare-id-gekkoushi.jar.sha256 \
            dist/miyorare-id-pack.json \
            dist/miyorare-en-uma.jar \
            dist/miyorare-en-uma.jar.sha256 \
            dist/miyorare-en-gekkoushi.jar \
            dist/miyorare-en-gekkoushi.jar.sha256 \
            dist/miyorare-en-pack.json \
            dist/miyorare-global-gekkoushi.jar \
            dist/miyorare-global-gekkoushi.jar.sha256 \
            dist/miyorare-global-pack.json \
            dist/miyorare-source-packs.json \
            --draft \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "Miyorare Source Packs v${SOURCE_VERSION}" \
            --notes "Official Miyorare-ID, Miyorare-EN, and Miyorare-Global packs. Built from pinned Miyorare builder ${SOURCE_COMMIT} (beta lineage); stable runtime compatibility baseline Miyorare main ${RUNTIME_COMMIT} (versionCode ${RUNTIME_VERSION_CODE}, Tsuki ${TSUKI_API}); validated upstreams: UMA ${UMA_COMMIT}, Gekkoushi ${GEKKOUSHI_COMMIT}, Keiyoushi ${KEIYOUSHI_COMMIT}."
          gh release view "$TAG" --json isDraft,isPrerelease --jq 'select(.isDraft == true and .isPrerelease == false)' >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  seal-draft:
    name: Seal staged Source Pack draft
    needs: stage-draft
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/source-pack-release-seal.yml
    with:
      tag: ${{ needs.stage-draft.outputs.tag }}

  publish-stable:
    name: Audit seal then publish stable release
    needs: [resolve-source, stage-draft, seal-draft]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.stage-draft.outputs.tag }}
      RUNTIME_COMMIT: ${{ needs.resolve-source.outputs.runtime_commit }}

    steps:
      - name: Checkout final release auditors
        uses: actions/checkout@v5

      - name: Require release to remain draft
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import json, os, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          if data.get('tagName') != os.environ['TAG']:
              raise SystemExit('release tag mismatch')
          if data.get('isDraft') is not True or data.get('isPrerelease') is True:
              raise SystemExit('release must remain a non-prerelease draft until final audit succeeds')
          PY

      - name: Re-download complete sealed draft
        shell: bash
        run: |
          set -euo pipefail
          rm -rf audit
          mkdir audit
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir audit
          test -s audit/miyorare-release-lock.json
          test -s audit/miyorare-release-lock.sha256

      - name: Final compatibility integrity and authenticity audit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/source_pack_manifest.py validate \
            --manifest audit/miyorare-source-packs.json \
            --contract compatibility/miyorare-source-pack-contract.v1.json \
            --tag "$TAG"
          MANIFEST_RUNTIME_COMMIT="$(python3 - <<'PY'
          import json
          print(json.load(open('audit/miyorare-source-packs.json', encoding='utf-8'))['runtimeCompatibility']['commit'])
          PY
          )"
          test "$MANIFEST_RUNTIME_COMMIT" = "$RUNTIME_COMMIT"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/Noirero/Miyorare/${RUNTIME_COMMIT}/compatibility/miyorare-source-pack-contract.v1.json" \
            -o "$RUNNER_TEMP/miyorare-contract.json"
          cmp --silent compatibility/miyorare-source-pack-contract.v1.json "$RUNNER_TEMP/miyorare-contract.json" || {
            echo "::error::Release contract differs from the exact stable Miyorare runtime baseline."
            exit 1
          }
          gh attestation verify audit/miyorare-release-lock.json --repo "$GITHUB_REPOSITORY"
          python3 tools/verify_release_lock.py \
            --dir audit \
            --tag "$TAG" \
            --require-sealed-before-publish

      - name: Publish audited stable release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName \
            --jq 'select(.isDraft == false and .isPrerelease == false)' >/dev/null

      - name: Summary
        shell: bash
        run: |
          {
            echo '# Stable Source Pack publication'
            echo
            echo "Tag: \`$TAG\`"
            echo "Pinned builder: \`${{ needs.resolve-source.outputs.source_commit }}\`"
            echo 'The release remained draft through payload upload, manifest validation, release-lock generation, OIDC attestation, and remote re-download audit.'
            echo 'Stable publication occurred only after seal-before-publish verification succeeded.'
          } >> "$GITHUB_STEP_SUMMARY"
