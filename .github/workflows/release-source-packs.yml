name: Miyorare Source Pack Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Source pack version (for example 0.3.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: miyorare-source-pack-release
  cancel-in-progress: false

jobs:
  resolve-source:
    name: Resolve Miyorare beta source
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_VERSION: ${{ inputs.version }}

    steps:
      - name: Validate version and release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SOURCE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Version must use MAJOR.MINOR.PATCH."
            exit 1
          }
          TAG="miyorare-sources-v${SOURCE_VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Source-pack releases are immutable."
            exit 1
          fi

      - name: Checkout Miyorare beta
        uses: actions/checkout@v5
        with:
          repository: Noirero/Miyorare
          ref: beta
          path: miyorare
          fetch-depth: 1

      - name: Pin source commit
        id: source
        shell: bash
        run: echo "commit=$(git -C miyorare rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-pack:
    name: Build Miyorare-${{ matrix.pack }}
    needs: resolve-source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack: [id, en]

    steps:
      - name: Checkout pinned Miyorare source
        uses: actions/checkout@v5
        with:
          repository: Noirero/Miyorare
          ref: ${{ needs.resolve-source.outputs.source_commit }}
          path: miyorare
          fetch-depth: 1

      - name: Checkout pinned UMA source
        uses: actions/checkout@v5
        with:
          repository: InvalidDavid/UMA
          ref: a0ebc9ffc7de02b7b50cbcb620092d0a9263c785
          path: _upstream/uma
          fetch-depth: 1

      - name: Checkout pinned Gekkoushi source
        uses: actions/checkout@v5
        with:
          repository: Gekkoushi/plugin-source
          ref: 9aa770b7cb699c6385f574f13710990e17ef5517
          path: _upstream/gekkoushi
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare curated UMA shard
        shell: bash
        run: |
          set -euo pipefail
          python3 miyorare/extensions/miyorare-sources/tools/prepare_pack.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --upstream _upstream/uma \
            --pack '${{ matrix.pack }}'

      - name: Build UMA shard with UMA build system
        working-directory: _upstream/uma
        run: |
          chmod +x gradlew
          ./gradlew buildJar --rerun-tasks --no-daemon

      - name: Finalize UMA shard
        shell: bash
        run: |
          set -euo pipefail
          python3 miyorare/extensions/miyorare-sources/tools/finalize_pack.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --upstream _upstream/uma \
            --pack '${{ matrix.pack }}' \
            --output build/miyorare-source-packs/${{ matrix.pack }}

      - name: Prepare Gekkoushi shard without modifying its source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 miyorare/extensions/miyorare-sources/tools/prepare_gekkoushi_shard.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --uma-upstream _upstream/uma \
            --gekkoushi-upstream _upstream/gekkoushi \
            --pack '${{ matrix.pack }}'

      - name: Build Gekkoushi shard with Gekkoushi build system
        working-directory: _upstream/gekkoushi
        run: |
          chmod +x gradlew
          ./gradlew buildJar --rerun-tasks --no-daemon

      - name: Finalize Gekkoushi shard
        shell: bash
        run: |
          set -euo pipefail
          python3 miyorare/extensions/miyorare-sources/tools/finalize_pack.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --upstream _upstream/gekkoushi \
            --pack '${{ matrix.pack }}' \
            --output build/miyorare-source-packs/${{ matrix.pack }}

      - name: Finalize logical pack manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 miyorare/extensions/miyorare-sources/tools/finalize_logical_pack.py \
            --manifest miyorare/extensions/miyorare-sources/packs.json \
            --pack '${{ matrix.pack }}' \
            --uma-metadata _upstream/uma/miyorare-pack.json \
            --gekkoushi-metadata _upstream/gekkoushi/miyorare-pack.json \
            --output build/miyorare-source-packs/${{ matrix.pack }}

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: miyorare-${{ matrix.pack }}-release
          path: build/miyorare-source-packs/${{ matrix.pack }}/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish official source packs
    needs: [resolve-source, build-pack]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_VERSION: ${{ inputs.version }}
      SOURCE_COMMIT: ${{ needs.resolve-source.outputs.source_commit }}

    steps:
      - name: Checkout release repository
        uses: actions/checkout@v5

      - name: Download verified packs
        uses: actions/download-artifact@v5
        with:
          pattern: miyorare-*-release
          path: dist
          merge-multiple: true

      - name: Verify release payload
        shell: bash
        run: |
          set -euo pipefail
          TAG="miyorare-sources-v${SOURCE_VERSION}"
          test -n "$SOURCE_COMMIT"
          for language in id en; do
            for shard in uma gekkoushi; do
              test -f "dist/miyorare-${language}-${shard}.jar"
              test -f "dist/miyorare-${language}-${shard}.jar.sha256"
              (cd dist && sha256sum -c "miyorare-${language}-${shard}.jar.sha256")
            done
            test -f "dist/miyorare-${language}-pack.json"
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Source-pack releases are immutable."
            exit 1
          fi

      - name: Generate release manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = os.environ['SOURCE_VERSION']
          source_commit = os.environ['SOURCE_COMMIT']
          tag = f'miyorare-sources-v{version}'
          packs = []
          for language in ('id', 'en'):
              logical = json.loads((Path('dist') / f'miyorare-{language}-pack.json').read_text(encoding='utf-8'))
              shards = []
              for shard in logical['shards']:
                  asset = Path('dist') / shard['assetName']
                  data = asset.read_bytes()
                  shards.append({
                      'provider': shard['provider'],
                      'pluginId': shard['pluginId'],
                      'assetName': asset.name,
                      'size': len(data),
                      'sha256': hashlib.sha256(data).hexdigest(),
                      'sourceCount': shard['sourceCount'],
                  })
              packs.append({
                  'pluginId': logical['packId'],
                  'language': language,
                  'sourceCount': logical['sourceCount'],
                  'shards': shards,
              })
          manifest = {
              'schema': 2,
              'version': version,
              'tag': tag,
              'sourceRepository': 'Noirero/Miyorare',
              'sourceBranch': 'beta',
              'sourceCommit': source_commit,
              'packs': packs,
          }
          Path('dist/miyorare-source-packs.json').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Publish immutable GitHub release
        shell: bash
        run: |
          set -euo pipefail
          TAG="miyorare-sources-v${SOURCE_VERSION}"
          gh release create "$TAG" \
            dist/miyorare-id-uma.jar \
            dist/miyorare-id-uma.jar.sha256 \
            dist/miyorare-id-gekkoushi.jar \
            dist/miyorare-id-gekkoushi.jar.sha256 \
            dist/miyorare-id-pack.json \
            dist/miyorare-en-uma.jar \
            dist/miyorare-en-uma.jar.sha256 \
            dist/miyorare-en-gekkoushi.jar \
            dist/miyorare-en-gekkoushi.jar.sha256 \
            dist/miyorare-en-pack.json \
            dist/miyorare-source-packs.json \
            --target "$GITHUB_SHA" \
            --title "Miyorare Source Packs v${SOURCE_VERSION}" \
            --notes "Official logical Miyorare-ID and Miyorare-EN packs. Each language contains independently built UMA and Gekkoushi shards, verified from Noirero/Miyorare beta commit ${SOURCE_COMMIT}."
